      /* ===== MD3 THEME ===== */
  :root{
    --bg:#FAF8F3; --card:#FFFFFF; --primary:#2F5D50; --secondary:#6E9F8D; --accent:#D6A84F;
    --ink:#2A2A28; --ink2:#6B6B66; --line:#EAE4D9;
    --r-card:24px; --r-btn:999px; --r-input:14px;
    --shadow:0 10px 30px -14px rgba(47,93,80,.18);
    --shadow-hover:0 20px 46px -20px rgba(47,93,80,.30);
    --font-title:"STKaiti","KaiTi","Songti SC","SimSun",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
    --t:.22s;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181D1B; --card:#212825; --primary:#7FB3A0; --secondary:#6E9F8D; --accent:#E0B45C;
      --ink:#ECEAE3; --ink2:#A6B1AB; --line:#343E39;
      --shadow:0 12px 34px -14px rgba(0,0,0,.55);
      --shadow-hover:0 22px 50px -20px rgba(0,0,0,.7);
    }
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow-x:hidden;}
  .glowbg{display:none!important;}
  .ic-svg{width:1em;height:1em;vertical-align:-.12em;display:inline-block;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  header{padding:26px 0 10px;}
  header h1{font-family:var(--font-title);color:var(--primary);font-size:1.55rem;letter-spacing:2px;font-weight:700;line-height:1.4;}
  header .sub{color:var(--ink2);font-size:.9rem;}
  .wm{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--primary);box-shadow:var(--shadow);font-size:.76rem;}
  .hint{color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;box-shadow:var(--shadow);font-size:.78rem;}
  .save-state{color:var(--primary);font-size:.78rem;}
  .warn{background:#FDECEA;color:#A9442F;border:1px solid #F3C1BB;border-radius:14px;}
  .chips{flex-wrap:wrap;}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;font-weight:600;transition:transform var(--t),box-shadow var(--t),background var(--t),color var(--t);}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(47,93,80,.5);}
  .chip.add{border-style:dashed;color:var(--primary);}
  .toolbar{flex-wrap:wrap;}
  .toolbar .tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;font-weight:600;box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t);}

<script>

otes": "①少无适俗韵：韵，气质。②一去三十年：三十年，言其久。③羁鸟恋旧林：羁鸟，笼中鸟。④守拙归园田：拙，愚拙的本性。⑤暧暧远人村：暧暧，昏暗模糊。", "errors": "“羁鸟”的“羁”；“榆柳荫后檐”的“荫”；“狗吠深巷中”的“吠”；“依依墟里烟”的“墟”。高频句：羁鸟恋旧林，池鱼思故渊。", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿，池鱼思故渊。开荒南野际，＿＿＿＿。", "暧暧远人村，＿＿＿＿。狗吠深巷中，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 双鸟恋旧林喻向往田园：＿＿＿＿，＿＿＿＿。", "(2) 黄昏温馨画面：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 27, "section": "诗词曲40首", "color": "#b45f2a", "title": "《拟行路难（其四）》", "author": "南朝宋·鲍照", "notes": "①泻水置平地：泻，倾倒。②安能行叹复坐愁：安能，怎能。③酌酒以自宽：自宽，自我宽慰。④举杯断绝歌路难：断绝，停止。⑤吞声踯躅不敢言：踯躅，徘徊不进。", "errors": "“泻水”勿误；“踯躅”极易写错。高频句：心非木石岂无感？吞声踯躅不敢言。", "exercises": [{"type": "原文挖空", "items": ["泻水置平地，＿＿＿＿。", "心非木石岂无感？＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 水流喻人生贵贱不同：＿＿＿＿，＿＿＿＿。", "(2) 忍气吞声痛苦压抑：＿＿＿＿。"]}]}, {"no": 28, "section": "诗词曲40首", "color": "#b45f2a", "title": "《春江花月夜》", "author": "唐·张若虚", "notes": "①滟滟随波千万里：滟滟，波光荡漾。②流霜不觉飞：月色如霜。③汀上白沙看不见：汀，水边平地。④人生代代无穷已：穷已，穷尽。⑤落月摇情满江树：摇情，牵动情思。", "errors": "“滟滟”易错；“霰”字；“汀”易误；“扁舟子”的“扁”；“碣石潇湘”的“碣”。高频句：江畔何人初见月？江月何年初照人？", "exercises": [{"type": "原文挖空", "items": ["春江潮水连海平，＿＿＿＿。", "＿＿＿＿？江月何年初照人？", "不知乘月几人归，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 人生代代江月千古：＿＿＿＿，＿＿＿＿。", "(2) 落月摇情：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 29, "section": "诗词曲40首", "color": "#b45f2a", "title": "《山居秋暝》", "author": "唐·王维", "notes": "①空山新雨后：新，刚刚。②明月松间照：照，映照。③竹喧归浣女：浣，洗涤。④随意春芳歇：歇，消歇。⑤王孙自可留。", "errors": "“暝”字从日；“浣女”的“浣”易错；“莲动下渔舟”的“莲”“渔”。高频句：明月松间照，清泉石上流。", "exercises": [{"type": "原文挖空", "items": ["空山新雨后，＿＿＿＿。", "明月松间照，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 月光与泉流：＿＿＿＿，＿＿＿＿。", "(2) 浣女归家渔舟拨莲：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 30, "section": "诗词曲40首", "color": "#b45f2a", "title": "《蜀道难》", "author": "唐·李白", "notes": "①噫吁嚱：惊叹声。②可以横绝峨眉巅：横绝，横渡。③飞湍瀑流争喧豗：豗，轰响。④砯崖转石万壑雷：砯，水击岩石声。⑤侧身西望长咨嗟：咨嗟，叹息。", "errors": "“噫吁嚱”必考；“蚕丛及鱼凫”的“凫”；“地崩山摧壮士死”的“摧”；“飞湍瀑流争喧豗”的“豗”；“砯崖”的“砯”。通假字：“匪”同“非”。高频句：蜀道之难，难于上青天！", "exercises": [{"type": "原文挖空", "items": ["噫吁嚱，＿＿＿＿！蜀道之难，＿＿＿＿！", "飞湍瀑流争喧豗，＿＿＿＿。", "其险也如此，＿＿＿＿！"]}, {"type": "情景默写", "items": ["(1) “五丁开山”开路艰难：＿＿＿＿，＿＿＿＿。", "(2) 瀑布撞击山崖滚石如雷：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 31, "section": "诗词曲40首", "color": "#b45f2a", "title": "《梦游天姥吟留别》", "author": "唐·李白", "notes": "①天姥连天向天横：横，遮断。②势拔五岳掩赤城：拔，超出。③熊咆龙吟殷岩泉：殷，震动。④云青青兮欲雨：青青，黑沉沉。⑤安能摧眉折腰事权贵：摧眉，低眉。", "errors": "“天姥”的“姥”；“瀛洲”的“瀛”；“剡溪”的“剡”；“渌水”的“渌”；“霓为衣兮风为马”的“霓”。高频句：安能摧眉折腰事权贵，使我不得开心颜！", "exercises": [{"type": "原文挖空", "items": ["天姥连天向天横，＿＿＿＿。", "＿＿＿＿，迷花倚石忽已暝。", "安能摧眉折腰事权贵，＿＿＿＿？"]}, {"type": "情景默写", "items": ["(1) 仙人出场：＿＿＿＿，＿＿＿＿。", "(2) 蔑视权贵：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 32, "section": "诗词曲40首", "color": "#b45f2a", "title": "《将进酒》", "author": "唐·李白", "notes": "①将进酒：将，请。②人生得意须尽欢：尽，尽情。③钟鼓馔玉不足贵：馔玉，精美饮食。④斗酒十千恣欢谑：恣，放纵。⑤与尔同销万古愁：销，消除。", "errors": "“烹羊宰牛”的“烹”；“馔玉”的“馔”；“恣欢谑”的“谑”；“五花马、千金裘”的“裘”。通假字：“销”通“消”。高频句：天生我材必有用，千金散尽还复来。", "exercises": [{"type": "原文挖空", "items": ["人生得意须尽欢，＿＿＿＿。", "＿＿＿＿，千金散尽还复来。", "钟鼓馔玉不足贵，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 与君歌一曲：＿＿＿＿，＿＿＿＿。", "(2) 材华必用不消沉：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 33, "section": "诗词曲40首", "color": "#b45f2a", "title": "《燕歌行》", "author": "唐·高适", "notes": "①汉家烟尘在东北：烟尘，战争。②男儿本自重横行：横行，驰骋。③摐金伐鼓下榆关：摐，撞击。④边庭飘飖那可度：飘飖，遥远。⑤至今犹忆李将军：李将军，李广。", "errors": "“摐金伐鼓”的“摐”；“旌旆”的“旆”；“逶迤”的“逶”；“玉箸”易误。高频句：战士军前半死生，美人帐下犹歌舞。", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿，美人帐下犹歌舞。", "大漠穷秋塞草腓，＿＿＿＿。", "君不见沙场征战苦，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 将领享乐不恤士卒：＿＿＿＿，＿＿＿＿。", "(2) 怀念李广深化反战：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 34, "section": "诗词曲40首", "color": "#b45f2a", "title": "《蜀相》", "author": "唐·杜甫", "notes": "①锦官城外柏森森：森森，茂盛。②三顾频烦天下计：频烦，频繁。③两朝开济老臣心：开济，开创、匡济。④出师未捷身先死：捷，获胜。⑤长使英雄泪满襟。", "errors": "“柏森森”的“森”；“隔叶黄鹂”的“鹂”；“三顾频烦”勿少“频”。高频句：出师未捷身先死，长使英雄泪满襟。", "exercises": [{"type": "原文挖空", "items": ["丞相祠堂何处寻？＿＿＿＿。", "映阶碧草自春色，＿＿＿＿。", "＿＿＿＿，长使英雄泪满襟。"]}, {"type": "情景默写", "items": ["(1) 概括诸葛亮一生功业：＿＿＿＿，＿＿＿＿。", "(2) 壮志未酬千古悲歌：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 35, "section": "诗词曲40首", "color": "#b45f2a", "title": "《客至》", "author": "唐·杜甫", "notes": "①舍南舍北皆春水：舍，房屋。②花径不曾缘客扫：缘，因为。③盘飧市远无兼味：飧，熟食。④樽酒家贫只旧醅：醅，未滤的酒。⑤肯与邻翁相对饮：肯，愿意。", "errors": "“飧”极易写错；“醅”注意酉字旁；“蓬门今始为君开”的“蓬”。高频句：花径不曾缘客扫，蓬门今始为君开。", "exercises": [{"type": "原文挖空", "items": ["舍南舍北皆春水，＿＿＿＿。", "＿＿＿＿，蓬门今始为君开。", "盘飧市远无兼味，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 落花小径喜客而至：＿＿＿＿，＿＿＿＿。", "(2) 酒菜简单热情相邀：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 36, "section": "诗词曲40首", "color": "#b45f2a", "title": "《登高》", "author": "唐·杜甫", "notes": "①渚清沙白鸟飞回：渚，水中小洲。②万里悲秋常作客：作客，客居异乡。③百年多病独登台：百年，晚年。④艰难苦恨繁霜鬓：繁，增多。⑤潦倒新停浊酒杯。", "errors": "“渚”易误；“萧萧”勿作“箫”；“繁霜鬓”的“鬓”易错；“潦倒”勿错。高频句：无边落木萧萧下，不尽长江滚滚来。", "exercises": [{"type": "原文挖空", "items": ["风急天高猿啸哀，＿＿＿＿。", "＿＿＿＿，不尽长江滚滚来。", "万里悲秋常作客，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 萧萧落叶壮阔意境：＿＿＿＿，＿＿＿＿。", "(2) 晚年漂泊多病独登台：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 37, "section": "诗词曲40首", "color": "#b45f2a", "title": "《登岳阳楼》", "author": "唐·杜甫", "notes": "①吴楚东南坼：坼，分裂。②乾坤日夜浮：日夜，一天到晚。③戎马关山北：戎马，战争。④凭轩涕泗流：涕泗，眼泪鼻涕。", "errors": "“坼”字易错；“乾坤”的“乾”；“戎马”勿错；“涕泗”的“泗”。高频句：吴楚东南坼，乾坤日夜浮。", "exercises": [{"type": "原文挖空", "items": ["昔闻洞庭水，＿＿＿＿。", "吴楚东南坼，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 割裂吴楚浮起日月：＿＿＿＿，＿＿＿＿。", "(2) 凭窗北望老病孤愁：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 38, "section": "诗词曲40首", "color": "#b45f2a", "title": "《琵琶行》", "author": "唐·白居易", "notes": "①委身为贾人妇：委身，嫁。②转轴拨弦三两声：转轴，拧弦调音。③幽咽泉流冰下难：冰下难，冰下阻塞不畅。④银瓶乍破水浆迸：迸，溅射。⑤东船西舫悄无言：舫，船。", "errors": "“荻花”的“荻”非“笛”；“弦弦掩抑”；“幽咽泉流冰下难”极易错写成“水下滩”；“此时无声胜有声”高频。高频句：同是天涯沦落人，相逢何必曾相识。", "exercises": [{"type": "原文挖空", "items": ["千呼万唤始出来，＿＿＿＿。", "别有幽愁暗恨生，＿＿＿＿。", "＿＿＿＿，相逢何必曾相识。"]}, {"type": "情景默写", "items": ["(1) 无声胜有声：＿＿＿＿，＿＿＿＿。", "(2) 天涯沦落共鸣：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 39, "section": "诗词曲40首", "color": "#b45f2a", "title": "《李凭箜篌引》", "author": "唐·李贺", "notes": "①吴丝蜀桐张高秋：张，调弦。②空山凝云颓不流：颓，颓然。③昆山玉碎凤凰叫：昆山，产玉之地。④女娲炼石补天处：女娲。⑤露脚斜飞湿寒兔：寒兔，月宫玉兔。", "errors": "“箜篌”生僻；“颓”易错；“昆山”勿写“昆仑”；“老鱼跳波瘦蛟舞”的“蛟”。高频句：昆山玉碎凤凰叫，芙蓉泣露香兰笑。", "exercises": [{"type": "原文挖空", "items": ["吴丝蜀桐张高秋，＿＿＿＿。", "＿＿＿＿，芙蓉泣露香兰笑。"]}, {"type": "情景默写", "items": ["(1) 玉碎凤鸣描摹箜篌：＿＿＿＿，＿＿＿＿。", "(2) 乐声使老鱼蛟龙起舞：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 40, "section": "诗词曲40首", "color": "#b45f2a", "title": "《菩萨蛮（小山重叠金明灭）》", "author": "唐·温庭筠", "notes": "①小山重叠金明灭：小山，屏风上的山峦；金明灭，阳光照耀下闪烁。②鬓云欲度香腮雪：度，掠过。③懒起画蛾眉：蛾眉，女子长而美的眉毛。④双双金鹧鸪：鹧鸪，饰物图案。", "errors": "“鬓”易错；“香腮雪”的“腮”；“鹧鸪”生僻。高频句：小山重叠金明灭，鬓云欲度香腮雪。", "exercises": [{"type": "原文挖空", "items": ["小山重叠金明灭，＿＿＿＿。", "新帖绣罗襦，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 鬓发如云拂过香腮：＿＿＿＿，＿＿＿＿。", "(2) 罗襦金线鹧鸪反衬孤寂：＿＿＿＿。"]}]}, {"no": 41, "section": "诗词曲40首", "color": "#b45f2a", "title": "《锦瑟》", "author": "唐·李商隐", "notes": "①锦瑟无端五十弦：无端，无缘无故。②庄生晓梦迷蝴蝶：迷，迷离。③望帝春心托杜鹃：托，托付。④蓝田日暖玉生烟：玉生烟，良玉生烟。⑤此情可待成追忆：可待，岂待。", "errors": "“锦瑟”的“瑟”易少点；“杜鹃”的“鹃”；“蓝田”注意。高频句：此情可待成追忆，只是当时已惘然。", "exercises": [{"type": "原文挖空", "items": ["锦瑟无端五十弦，＿＿＿＿。", "＿＿＿＿，望帝春心托杜鹃。", "此情可待成追忆，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 庄周梦蝶人生如梦：＿＿＿＿，＿＿＿＿。", "(2) 昔日迷惘惆怅：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 42, "section": "诗词曲40首", "color": "#b45f2a", "title": "《虞美人》", "author": "五代·李煜", "notes": "①春花秋月何时了：了，了结。②故国不堪回首月明中：不堪，不忍。③雕栏玉砌应犹在：砌，台阶。④问君能有几多愁：几多，多少。⑤恰似一江春水向东流。", "errors": "“虞美人”的“虞”；“砌”易错；“一江春水”易误。高频句：问君能有几多愁？恰似一江春水向东流。", "exercises": [{"type": "原文挖空", "items": ["春花秋月何时了，＿＿＿＿。", "问君能有几多愁？＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 春水喻愁汹涌无尽：＿＿＿＿，＿＿＿＿。", "(2) 往事不堪回首亡国之痛：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 43, "section": "诗词曲40首", "color": "#b45f2a", "title": "《望海潮》", "author": "宋·柳永", "notes": "①东南形胜：形胜，地形优越。②市列珠玑：珠玑，珍宝。③户盈罗绮：罗绮，绫罗绸缎。④重湖叠巘清嘉：叠巘，层叠的山峦。⑤异日图将好景：图，描绘。", "errors": "“叠巘”的“巘”易错；“珠玑”的“玑”；“罗绮”的“绮”；“羌管弄晴”的“羌”；“钓叟莲娃”的“叟”。高频句：有三秋桂子，十里荷花。", "exercises": [{"type": "原文挖空", "items": ["东南形胜，三吴都会，＿＿＿＿。", "＿＿＿＿，十里荷花。"]}, {"type": "情景默写", "items": ["(1) 西湖昼夜欢歌桂荷之美：＿＿＿＿，＿＿＿＿。", "(2) 街市繁华珍宝丝帛充盈：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 44, "section": "诗词曲40首", "color": "#b45f2a", "title": "《桂枝香·金陵怀古》", "author": "宋·王安石", "notes": "①登临送目：送目，远望。②千里澄江似练：练，白绢。③彩舟云淡：彩舟，画船。④谩嗟荣辱：谩，徒然。⑤至今商女，时时犹唱：商女，歌女。", "errors": "“澄江似练”的“练”；“翠峰如簇”的“簇”；“谩嗟”的“谩”通“漫”。高频句：六朝旧事随流水，但寒烟衰草凝绿。", "exercises": [{"type": "原文挖空", "items": ["千里澄江似练，＿＿＿＿。", "六朝旧事随流水，＿＿＿＿。", "至今商女，＿＿＿＿，《后庭》遗曲。"]}, {"type": "情景默写", "items": ["(1) 白练江水翠峰簇拥：＿＿＿＿，＿＿＿＿。", "(2) 化用杜牧批判当朝：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 45, "section": "诗词曲40首", "color": "#b45f2a", "title": "《江城子·乙卯正月二十日夜记梦》", "author": "宋·苏轼", "notes": "①十年生死两茫茫：茫茫，没有音讯。②不思量，自难忘：自，却。③尘满面，鬓如霜：尘，风尘。④小轩窗，正梳妆：轩，小屋的窗。⑤相顾无言，惟 清照", "notes": "①凄凄惨惨戚戚：戚戚，忧伤。②乍暖还寒时候：乍，忽然。③怎敌他、晚来风急：敌，抵挡。④满地黄花堆积：黄花，菊花。⑤这次第，怎一个愁字了得：次第，光景。", "errors": "“戚戚”易错；“乍暖还寒”的“还”；“憔悴损”的“损”勿丢；“盏”易错。高频句：寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", "exercises": [{"type": "原文挖空", "items": ["寻寻觅觅，冷冷清清，＿＿＿＿。", "三杯两盏淡酒，＿＿＿＿！"]}, {"type": "情景默写", "items": ["(1) 叠词刻画失落哀愁：＿＿＿＿，＿＿＿＿，＿＿＿＿。", "(2) 黄花凋零喻自身憔悴：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 51, "section": "诗词曲40首", "color": "#b45f2a", "title": "《书愤》", "author": "宋·陆游", "notes": "①早岁那知世事艰：那，同“哪”。②楼船夜雪瓜洲渡：楼船，高大的战船。③塞上长城空自许：长城，比喻保卫国家的良将。④出师一表真名世：名世，闻名于世。⑤千载谁堪伯仲间：伯仲，不相上下。", "errors": "“那知”通“哪”；“瓜洲渡”的“洲”；“空自许”易错；“伯仲”易错。高频句：楼船夜雪瓜洲渡，铁马秋风大散关。", "exercises": [{"type": "原文挖空", "items": ["早岁那知世事艰，＿＿＿＿。", "＿＿＿＿，铁马秋风大散关。", "出师一表真名世，＿＿＿＿！"]}, {"type": "情景默写", "items": ["(1) 雄阔意象回忆抗金：＿＿＿＿，＿＿＿＿。", "(2) 羡慕诸葛亮壮志难酬：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 52, "section": "诗词曲40首", "color": "#b45f2a", "title": "《临安春雨初霁》", "author": "宋·陆游", "notes": "①世味年来薄似纱：世味，世态人情。②小楼一夜听春雨：听春雨。③矮纸斜行闲作草：矮纸，短纸；草，草书。④素衣莫起风尘叹：风尘，比喻世俗垢污。⑤犹及清明可到家。", "errors": "“薄似纱”的“薄”；“矮纸”不易误；“风尘叹”注意。高频句：小楼一夜听春雨，深巷明朝卖杏花。", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿，深巷明朝卖杏花。", "矮纸斜行闲作草，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 一夜听雨清晨叫卖杏花：＿＿＿＿，＿＿＿＿。", "(2) 不被世俗所染清明回乡：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 53, "section": "诗词曲40首", "color": "#b45f2a", "title": "《永遇乐·京口北固亭怀古》", "author": "宋·辛弃疾", "notes": "①千古江山，英雄无觅孙仲谋处：孙仲谋，孙权。②舞榭歌台：榭，台上的房屋。③人道寄奴曾住：寄奴，刘裕。④烽火扬州路：路，宋代行政区划。⑤廉颇老矣，尚能饭否：饭，吃饭。", "errors": "“舞榭歌台”的“榭”；“气吞万里如虎”的“吞”；“元嘉草草”的“嘉”；“仓皇”勿错。高频句：想当年，金戈铁马，气吞万里如虎。", "exercises": [{"type": "原文挖空", "items": ["千古江山，＿＿＿＿。", "想当年，＿＿＿＿，＿＿＿＿。", "凭谁问：廉颇老矣，＿＿＿＿？"]}, {"type": "情景默写", "items": ["(1) 刘裕北伐气吞万里：＿＿＿＿，＿＿＿＿。", "(2) 廉颇自喻老当益壮无人问：＿＿＿＿，＿＿＿＿？"]}]}, {"no": 54, "section": "诗词曲40首", "color": "#b45f2a", "title": "《菩萨蛮·书江西造口壁》", "author": "宋·辛弃疾", "notes": "①郁孤台下清江水：郁孤台，地名。②中间多少行人泪：行人，流离失所者。③青山遮不住，毕竟东流去。④江晚正愁余：愁余，使我忧愁。⑤山深闻鹧鸪：鹧鸪，鸟名。", "errors": "“郁孤台”的“郁”；“鹧鸪”极生僻。高频句：青山遮不住，毕竟东流去。", "exercises": [{"type": "原文挖空", "items": ["郁孤台下清江水，＿＿＿＿。", "青山遮不住，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 抗金意志不可阻挡：＿＿＿＿，＿＿＿＿。", "(2) 鹧鸪声声忧国愁绪：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 55, "section": "诗词曲40首", "color": "#b45f2a", "title": "《青玉案·元夕》", "author": "宋·辛弃疾", "notes": "①东风夜放花千树：花千树，灯火极盛。②星如雨：焰火纷落。③宝马雕车香满路：宝马雕车，豪华马车。④笑语盈盈暗香去：盈盈，仪态美好。⑤蓦然回首：蓦然，突然。", "errors": "“蓦然”的“蓦”必考易错；“阑珊”易误； “蛾儿雪柳黄金缕”的“蛾”。高频句：蓦然回首，那人却在，灯火阑珊处。", "exercises": [{"type": "原文挖空", "items": ["东风夜放花千树，＿＿＿＿。", "＿＿＿＿，那人却在，灯火阑珊处。"]}, {"type": "情景默写", "items": ["(1) 元宵花灯璀璨烟花纷落：＿＿＿＿，＿＿＿＿。", "(2) 历经寻觅忽见知音：＿＿＿＿，＿＿＿＿，＿＿＿＿。"]}]}, {"no": 56, "section": "诗词曲40首", "color": "#b45f2a", "title": "《贺新郎·国脉微如缕》", "author": "宋·刘克庄", "notes": "①国脉微如缕：微，微弱；缕，丝线。②问长缨何时入手：长缨，长绳。③未必人间无好汉：好汉，英雄。④快投笔，莫题柱：投笔，弃文从武；题柱，指求功名。", "errors": "“长缨”的“缨”易错；“投笔”注意。高频句：问长缨何时入手，缚将戎主？未必人间无好汉，谁与宽些尺度？", "exercises": [{"type": "原文挖空", "items": ["国脉微如缕，＿＿＿＿？", "＿＿＿＿，谁与宽些尺度？"]}, {"type": "情景默写", "items": ["(1) 长缨在手渴望从军擒敌：＿＿＿＿，＿＿＿＿。", "(2) 激励投笔从戎：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 57, "section": "诗词曲40首", "color": "#b45f2a", "title": "《扬州慢·淮左名都》", "author": "宋·姜夔", "notes": "①淮左名都：扬州。②解鞍少驻初程：少，稍微。③尽荠麦青青：荠麦，野生的麦子。④自胡马窥江去后：窥，侵犯。⑤年年知为谁生。", "errors": "“荠麦”的“荠”；“窥江”的“窥”；“戌角”与“戍”区分。高频句：二十四桥仍在，波心荡，冷月无声。念桥边红药，年年知为谁生？", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿，波心荡，冷月无声。", "念桥边红药，＿＿＿＿？"]}, {"type": "情景默写", "items": ["(1) 荠麦青青废池乔木厌战：＿＿＿＿，＿＿＿＿。", "(2) 桥边红药物是人非：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 58, "section": "诗词曲40首", "color": "#b45f2a", "title": "《念奴娇·过洞庭》", "author": "宋·张孝祥", "notes": "①洞庭青草：青草，湖名。②更无一点风色：风色，风。③玉鉴琼田三万顷：玉鉴，镜面。④素月分辉，明河共影：明河，银河。⑤妙处难与君说：妙处，美妙的情趣。", "errors": "“琼田”的“琼”；“素月分辉”的“素”；“孤光自照”易误。高频句：玉鉴琼田三万顷，着我扁舟一叶。孤光自照，肝肺皆冰雪。", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿，着我扁舟一叶。", "孤光自照，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 玉镜琼田般澄澈壮阔：＿＿＿＿，＿＿＿＿。", "(2) 冰雪之洁喻忠贞高洁：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 59, "section": "诗词曲40首", "color": "#b45f2a", "title": "《游园（【皂罗袍】）》", "author": "明·汤显祖", "notes": "①原来姹紫嫣红开遍：姹紫嫣红，花色鲜艳。②似这般都付与断井颓垣：颓垣，坍塌的墙。③朝飞暮卷：形容云雨。④锦屏人忒看的这韶光贱：锦屏人，深闺女子；韶光，春光。", "errors": "“姹紫嫣红”的“姹”“嫣”必考易错；“颓垣”的“垣”；“忒”易错。高频句：良辰美景奈何天，赏心乐事谁家院！", "exercises": [{"type": "原文挖空", "items": ["原来姹紫嫣红开遍，＿＿＿＿。", "良辰美景奈何天，＿＿＿＿！"]}, {"type": "情景默写", "items": ["(1) 春光绚烂闲置在破井荒墙：＿＿＿＿，＿＿＿＿。", "(2) 辜负春光叹惜年华虚度：＿＿＿＿，＿＿＿＿。"]}]}, {"no": 60, "section": "诗词曲40首", "color": "#b45f2a", "title": "《朝天子·咏喇叭》", "author": "明·王磐", "notes": "①喇叭，唢呐，曲儿小腔儿大：曲儿，曲调。②官船来往乱如麻：乱如麻，形容多而乱。③全仗你抬声价：抬声价，抬高身价。④军听了军愁，民听了民怕：怕，害怕。⑤吹伤了这家，只吹的水尽鹅飞罢：鹅飞罢，一切都完了。", "errors": "“唢呐”易写错；“乱如麻”的“麻”；“水尽鹅飞”易误。高频句：军听了军愁，民听了民怕。", "exercises": [{"type": "原文挖空", "items": ["官船来往乱如麻，＿＿＿＿。", "军听了军愁，＿＿＿＿。"]}, {"type": "情景默写", "items": ["(1) 官船喇叭虚张声势害民：＿＿＿＿，＿＿＿＿。", "(2) 吹到民穷财尽：＿＿＿＿，＿＿＿＿。"]}]}];
