}
function resetAllData() {
  if (!confirm("确定重置全部数据吗？将清空所有孩子的打卡记录、授权激活，恢复到出厂状态。")) return;
  if (!confirm("再次确认：此操作不可恢复，建议先备份。真的要重置吗？")) return;
  state = defaultState();
  save();
  render();
  el("activation").classList.add("show");
  flash("已重置全部数据");
}
function setPin(v) {
  state.pin = v.replace(/\D/g, "").slice(0, 6);
  save();
  el("pinInput").value = state.pin;
}

/* 初始化 */
function init() {
  const app = el("app");
  POEMS.forEach(function (p) {
    let curG = app.lastElementChild;
    if (!curG || curG.dataset.grade !== p.grade) {
      const g = document.createElement("details");
      g.className = "group";
      g.dataset.grade = p.grade;
      g.style.background = "linear-gradient(160deg, " + p.color + ", " + p.color + "cc)";
      g.innerHTML = "<summary>" + p.grade + "<span class='cnt'></span><span class='gp'></span></summary><div class='cards'></div>";
      g.querySelector(".cnt").textContent = POEMS.filter(function (x) { return x.grade === p.grade; }).length + " 首";
      app.appendChild(g);
      curG = g;
    }
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.no = p.no;
    card.style.setProperty("--c", p.color);
    card.innerHTML =
      "<button class='head' onclick='toggleCard(this)'>" +
        "<span class='no' style='background:" + p.color + "'>" + p.no + "</span>" +
        "<span class='t'>" + p.title + "</span>" +
        "<span class='a'>" + p.author + "</span><span class='chev'>▾</span>" +
      "</button>" +
        "<div class='body'>" +
        "<div class='poem-text'></div>" +
        "<button class='read-btn' onclick='readPoem(" + p.no + ")'><svg width='15' height='15' viewBox='0 0 24 24' fill='currentColor' aria-hidden='true'><path d='M3 9v6h4l5 5V4L7 9H3z'/><path d='M16.5 12c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.73 2.5-2.25 2.5-4.02z'/></svg>朗读全诗</button>" +
        "<div class='note'>📖 注释：" + p.ann + "</div>" +
        "<div class='note err'>⚠️ 易错：" + p.err + "</div>" +
        "<div class='checks'>" +
          "<button class='ck rec' style='--c:#6b9b37;--bc:#6b9b37' onclick='toggleRec(" + p.no + ")'></button>" +
          "<button class='ck wri' style='--c:#2c5f8a;--bc:#2c5f8a' onclick='toggleWri(" + p.no + ")'></button>" +
          "<button class='ck par' style='--c:#b45f2a;--bc:#b45f2a' onclick='togglePar(" + p.no + ")'></button>" +
        "</div>" +
      "</div>";
    curG.querySelector(".cards").appendChild(card);
  });
  el("pinInput").value = state.pin || "";
  /* 在「备份与设置」里动态加入：下载带记录的版本（推荐） */
  const pinBox = el("pinInput");
  const dlBlock = document.createElement("div");
  dlBlock.style.cssText = "display:grid;gap:6px";
  const dlLabel = document.createElement("label");
  dlLabel.style.cssText = "font-size:.85rem;color:#5c4b3a";
  dlLabel.textContent = "💾 最省事：下载「带记录的版本」——文件自带全部记录，发到新手机打开，记录自动恢复";
  const dlBtn = document.createElement("button");
  dlBtn.className = "mini-btn";
  dlBtn.textContent = "💾 下载带记录的版本（推荐）";
  dlBtn.onclick = downloadWithRecords;
  dlBlock.appendChild(dlLabel);
  dlBlock.appendChild(dlBtn);
  pinBox.parentNode.insertBefore(dlBlock, pinBox);
  const rsBtn = document.createElement("button");
  rsBtn.className = "mini-btn";
  rsBtn.style.cssText = "background:#fdecea;color:#a9442f;border-color:#f3c1bb";
  rsBtn.textContent = "🔄 重置全部数据（清空所有记录和激活，恢复出厂）";
  rsBtn.onclick = resetAllData;
  pinBox.parentNode.insertBefore(rsBtn, pinBox);
  importEmbedded();
  render();
  if (!storageOK) el("storageWarn").style.display = "block";
  if (devUnlocked() && (!state.activated || !state.activated.name)) {
    state.activated = { name: "开发者", code: "DEV", date: todayStr() };
  }
  if (!state.activated || !state.activated.name) el("activation").classList.add("show");
  if (location.search.indexOf("selftest") >= 0) runSelfTest();
}

/* 自检 */
function runSelfTest() {
  state = defaultState();
  state.activated = { name: "张三", code: makeCode("张三"), date: "2026-08-06" };
  el("activation").classList.remove("show");
  const codeOk = checkCode("张三", makeCode("张三"));
  const codeBad = checkCode("张三", "GD75-0000-0000");
  toggleRec("1"); toggleRec("2");
  checkin("2026-08-06"); checkin("2026-08-05");
  const s1 = computeStreak(cur().days, "2026-08-06");
  const rA = Object.keys(cur().rec).length;
  const idB = addChildRaw("妹妹", "👧");
  switchChild(idB);
  toggleRec("3");
  const rB = Object.keys(cur().rec).length;
  const firstId = Object.keys(state.children)[0];
  const rA2 = Object.keys(state.children[firstId].rec).length;
  const rubyOk = POEMS[0].fullRuby.indexOf("<rt>") > -1;
  const pyOff = state.py;
  POEMS.forEach(function (p) { cur().rec[String(p.no)] = "2026-08-06"; });
  render();
  const onN = document.querySelectorAll(".ck.rec.on").length;
  const banner = el("banner").classList.contains("show");
  const saveTxt = el("saveState").textContent.indexOf("自动保存在本机") > -1;
  const marker = "window.__EMBEDDED__ = null;";
  const htmlSrc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const hasMarker = htmlSrc.indexOf(marker) > -1;
  const src2 = htmlSrc.replace(marker, "window.__EMBEDDED__ = " + JSON.stringify({ v: 2 }) + ";");
  const fnReset = typeof resetAllData === "function";
  const fnSet = typeof openSettings === "function" && !!el("settingsPanel");
  const embOk = src2.indexOf("window.__EMBEDDED__ = {\"v\":2};") > -1;
  let stOK = true;
  try {
    save();
    state = defaultState();
    state = load();
    stOK = !!state.children && Object.keys(state.children).length === 2;
  } catch (e) { stOK = false; }
  window.__EMBEDDED__ = { v: 2, children: state.children, active: state.active, pin: "", py: true, activated: state.activated };
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  const impBefore = Object.keys(state.children).length;
  state = defaultState();
  const impOk = importEmbedded() && Object.keys(state.children).length === impBefore;
  window.__EMBEDDED__ = null;
  const sp = splitBlanks("甲＿＿＿＿乙＿＿＿＿丙");
  const spOk = sp.length === 3;
  const fm1 = fillMatch("春眠不觉晓，处处闻啼鸟", ["春眠不觉晓，处处闻啼鸟"]);
  const fm2 = !fillMatch("春眠不觉晓", ["春眠不觉晓，处处闻啼鸟"]);
  const fm3 = fillMatch("歌", ["歌"]);
  const fillOk = spOk && fm1 && fm2 && fm3 && FILL.length > 50;
  const devT = (function () {
    try {
      localStorage.setItem("gsk_dev_ok", "1");
      const r = devUnlocked();
      localStorage.removeItem("gsk_dev_ok");
      return r;
    } catch (e) { return false; }
  })();
  const audioOk = ("speechSynthesis" in window);
  const ok = codeOk && devT && fillOk && !codeBad && s1 === 2 && rA === 2 && rB === 1 && rA2 === 2 && rubyOk && pyOff && onN === 75 && banner && stOK && hasMarker && embOk && saveTxt && impOk && fnReset && fnSet && audioOk;
  el("selftest").textContent = "SELFTEST " + (ok ? "OK" : "FAIL")
    + " code=" + codeOk + "/" + codeBad + " streak=" + s1 + " rA=" + rA + " rB=" + rB
    + " rA2=" + rA2 + " ruby=" + rubyOk + " py=" + pyOff + " on=" + onN
    + " banner=" + banner + " storage=" + stOK + " marker=" + hasMarker + "/" + embOk
    + " save=" + saveTxt + " imp=" + impOk + " reset=" + fnReset + " set=" + fnSet + " fill=" + spOk + "/" + fm1 + "/" + fm2 + "/" + fm3 + " pool=" + FILL.length + " audio=" + audioOk;
  el("selftest").style.display = "block";
}

document.addEventListener("DOMContentLoaded", init);
document.addEventListener("DOMContentLoaded", function () {
  if (location.search.indexOf("fill=1") >= 0 && typeof startFill === "function") {
    setTimeout(startFill, 400);
  }
});

</script>
