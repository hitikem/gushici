      /* ===== MD3 THEME ===== */
  :root{
    --bg:#FAF8F3; --card:#FFFFFF; --primary:#2F5D50; --secondary:#6E9F8D; --accent:#D6A84F;
    --ink:#2A2A28; --ink2:#6B6B66; --line:#EAE4D9;
    --r-card:24px; --r-btn:999px; --r-input:14px;
    --shadow:0 10px 30px -14px rgba(47,93,80,.18);
    --shadow-hover:0 20px 46px -20px rgba(47,93,80,.30);
    --font-title:"STKaiti","KaiTi","Songti SC","SimSun",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
    --t:.22s;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181D1B; --card:#212825; --primary:#7FB3A0; --secondary:#6E9F8D; --accent:#E0B45C;
      --ink:#ECEAE3; --ink2:#A6B1AB; --line:#343E39;
      --shadow:0 12px 34px -14px rgba(0,0,0,.55);
      --shadow-hover:0 22px 50px -20px rgba(0,0,0,.7);
    }
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow-x:hidden;}
  .glowbg{display:none!important;}
  .ic-svg{width:1em;height:1em;vertical-align:-.12em;display:inline-block;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  header{padding:26px 0 10px;}
  header h1{font-family:var(--font-title);color:var(--primary);font-size:1.55rem;letter-spacing:2px;font-weight:700;line-height:1.4;}
  header .sub{color:var(--ink2);font-size:.9rem;}
  .wm{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--primary);box-shadow:var(--shadow);font-size:.76rem;}
  .hint{color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;box-shadow:var(--shadow);font-size:.78rem;}
  .save-state{color:var(--primary);font-size:.78rem;}
  .warn{background:#FDECEA;color:#A9442F;border:1px solid #F3C1BB;border-radius:14px;}
  .chips{flex-wrap:wrap;}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;font-weight:600;transition:transform var(--t),box-shadow var(--t),background var(--t),color var(--t);}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(47,93,80,.5);}
  .chip.add{border-style:dashed;color:var(--primary);}
  .toolbar{flex-wrap:wrap;}
  .toolbar .tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;font-weight:600;box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t);}
  .toolbar .tbtn:active{transform:scale(.97);}
  .toolbar .tbtn.go{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;box-shadow:0 10px 22px -10px rgba(47,93,80,.5);}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);}
  .ring .num{color:var(--primary);font-family:var(--font-title);}
  .ring .num small{color:var(--ink2);}
  .stat{background:color-mix(in srgb,var(--secondary) 10%, var(--card));border-radius:14px;border:1px solid transparent;}
  .stat .k{color:var(--ink2);}

<script>

const POEMS = [{"grade": "一年级上册", "emoji": "🦢", "title": "咏鹅", "author": "唐·骆宾王", "full": "鹅，鹅，鹅，\n曲项向天歌。\n白毛浮绿水，\n红掌拨清波。", "ann": "曲项：弯曲着脖子。拨：划动。", "err": "“鹅”右边是“鸟”；“拨”右上是“发”。", "no": 1, "color": "#6b9b37", "fullRuby": "<ruby>鹅<rt>é</rt></ruby>，<ruby>鹅<rt>é</rt></ruby>，<ruby>鹅<rt>é</rt></ruby>，<br><ruby>曲<rt>qū</rt></ruby><ruby>项<rt>xiàng</rt></ruby><ruby>向<rt>xiàng</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>歌<rt>gē</rt></ruby>。<br><ruby>白<rt>bái</rt></ruby><ruby>毛<rt>máo</rt></ruby><ruby>浮<rt>fú</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>水<rt>shuǐ</rt></ruby>，<br><ruby>红<rt>hóng</rt></ruby><ruby>掌<rt>zhǎng</rt></ruby><ruby>拨<rt>bō</rt></ruby><ruby>清<rt>qīng</rt></ruby><ruby>波<rt>bō</rt></ruby>。"}, {"grade": "一年级上册", "emoji": "🪷", "title": "江南", "author": "汉乐府", "full": "江南可采莲，\n莲叶何田田。\n鱼戏莲叶间。\n鱼戏莲叶东，\n鱼戏莲叶西，\n鱼戏莲叶南，\n鱼戏莲叶北。", "ann": "何：多么。田田：莲叶茂盛的样子。", "err": "“莲”下面是“连”；四个方位字别写乱。", "no": 2, "color": "#6b9b37", "fullRuby": "<ruby>江<rt>jiāng</rt></ruby><ruby>南<rt>nán</rt></ruby><ruby>可<rt>kě</rt></ruby><ruby>采<rt>cǎi</rt></ruby><ruby>莲<rt>lián</rt></ruby>，<br><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>田<rt>tián</rt></ruby><ruby>田<rt>tián</rt></ruby>。<br><ruby>鱼<rt>yú</rt></ruby><ruby>戏<rt>xì</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>间<rt>jiān</rt></ruby>。<br><ruby>鱼<rt>yú</rt></ruby><ruby>戏<rt>xì</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>东<rt>dōng</rt></ruby>，<br><ruby>鱼<rt>yú</rt></ruby><ruby>戏<rt>xì</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>西<rt>xī</rt></ruby>，<br><ruby>鱼<rt>yú</rt></ruby><ruby>戏<rt>xì</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>南<rt>nán</rt></ruby>，<br><ruby>鱼<rt>yú</rt></ruby><ruby>戏<rt>xì</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>北<rt>běi</rt></ruby>。"}, {"grade": "一年级上册", "emoji": "🌾", "title": "悯农（其二）", "author": "唐·李绅", "full": "锄禾日当午，\n汗滴禾下土。\n谁知盘中餐，\n粒粒皆辛苦。", "ann": "禾：禾苗。餐：饭食。", "err": "“锄”右边是“助”；“餐”左上角是“歺”。", "no": 3, "color": "#6b9b37", "fullRuby": "<ruby>锄<rt>chú</rt></ruby><ruby>禾<rt>hé</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>当<rt>dāng</rt></ruby><ruby>午<rt>wǔ</rt></ruby>，<br><ruby>汗<rt>hàn</rt></ruby><ruby>滴<rt>dī</rt></ruby><ruby>禾<rt>hé</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>土<rt>tǔ</rt></ruby>。<br><ruby>谁<rt>shuí</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>盘<rt>pán</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>餐<rt>cān</rt></ruby>，<br><ruby>粒<rt>lì</rt></ruby><ruby>粒<rt>lì</rt></ruby><ruby>皆<rt>jiē</rt></ruby><ruby>辛<rt>xīn</rt></ruby><ruby>苦<rt>kǔ</rt></ruby>。"}, {"grade": "一年级上册", "emoji": "🌙", "title": "古朗月行（节选）", "author": "唐·李白", "full": "小时不识月，\n呼作白玉盘。\n又疑瑶台镜，\n飞在青云端。", "ann": "呼作：叫作。瑶台：传说中仙人居住的地方。", "err": "“朗”左边不是“良”；“镜”右边是“竟”。", "no": 4, "color": "#6b9b37", "fullRuby": "<ruby>小<rt>xiǎo</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>月<rt>yuè</rt></ruby>，<br><ruby>呼<rt>hū</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>玉<rt>yù</rt></ruby><ruby>盘<rt>pán</rt></ruby>。<br><ruby>又<rt>yòu</rt></ruby><ruby>疑<rt>yí</rt></ruby><ruby>瑶<rt>yáo</rt></ruby><ruby>台<rt>tái</rt></ruby><ruby>镜<rt>jìng</rt></ruby>，<br><ruby>飞<rt>fēi</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>端<rt>duān</rt></ruby>。"}, {"grade": "一年级上册", "emoji": "🍃", "title": "风", "author": "唐·李峤", "full": "解落三秋叶，\n能开二月花。\n过江千尺浪，\n入竹万竿斜。", "ann": "解：能够。三秋：深秋。", "err": "“解”右边是“角”加“牛”；“斜”右边是“斗”。", "no": 5, "color": "#6b9b37", "fullRuby": "<ruby>解<rt>jiě</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>叶<rt>yè</rt></ruby>，<br><ruby>能<rt>néng</rt></ruby><ruby>开<rt>kāi</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>花<rt>huā</rt></ruby>。<br><ruby>过<rt>guò</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>尺<rt>chǐ</rt></ruby><ruby>浪<rt>làng</rt></ruby>，<br><ruby>入<rt>rù</rt></ruby><ruby>竹<rt>zhú</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>竿<rt>gān</rt></ruby><ruby>斜<rt>xié</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "🐦", "title": "春晓", "author": "唐·孟浩然", "full": "春眠不觉晓，\n处处闻啼鸟。\n夜来风雨声，\n花落知多少。", "ann": "晓：天亮。闻：听见。", "err": "“晓”右边是“尧”；“啼”右边是“帝”。", "no": 6, "color": "#4a8fb1", "fullRuby": "<ruby>春<rt>chūn</rt></ruby><ruby>眠<rt>mián</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>觉<rt>jué</rt></ruby><ruby>晓<rt>xiǎo</rt></ruby>，<br><ruby>处<rt>chù</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>闻<rt>wén</rt></ruby><ruby>啼<rt>tí</rt></ruby><ruby>鸟<rt>niǎo</rt></ruby>。<br><ruby>夜<rt>yè</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>声<rt>shēng</rt></ruby>，<br><ruby>花<rt>huā</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>多<rt>duō</rt></ruby><ruby>少<rt>shǎo</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "⛵", "title": "赠汪伦", "author": "唐·李白", "full": "李白乘舟将欲行，\n忽闻岸上踏歌声。\n桃花潭水深千尺，\n不及汪伦送我情。", "ann": "踏歌：边唱歌边用脚打拍子。不及：比不上。", "err": "“乘”的中间不是“乖”；“踏”右下是“日”。", "no": 7, "color": "#4a8fb1", "fullRuby": "<ruby>李<rt>lǐ</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>乘<rt>chéng</rt></ruby><ruby>舟<rt>zhōu</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>行<rt>xíng</rt></ruby>，<br><ruby>忽<rt>hū</rt></ruby><ruby>闻<rt>wén</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>踏<rt>tà</rt></ruby><ruby>歌<rt>gē</rt></ruby><ruby>声<rt>shēng</rt></ruby>。<br><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>潭<rt>tán</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>尺<rt>chǐ</rt></ruby>，<br><ruby>不<rt>bù</rt></ruby><ruby>及<rt>jí</rt></ruby><ruby>汪<rt>wāng</rt></ruby><ruby>伦<rt>lún</rt></ruby><ruby>送<rt>sòng</rt></ruby><ruby>我<rt>wǒ</rt></ruby><ruby>情<rt>qíng</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "🌕", "title": "静夜思", "author": "唐·李白", "full": "床前明月光，\n疑是地上霜。\n举头望明月，\n低头思故乡。", "ann": "疑：好像。举头：抬头。", "err": "“疑”左上是“匕”；“望”左上是“亡”。", "no": 8, "color": "#4a8fb1", "fullRuby": "<ruby>床<rt>chuáng</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>光<rt>guāng</rt></ruby>，<br><ruby>疑<rt>yí</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>霜<rt>shuāng</rt></ruby>。<br><ruby>举<rt>jǔ</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>望<rt>wàng</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>月<rt>yuè</rt></ruby>，<br><ruby>低<rt>dī</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>思<rt>sī</rt></ruby><ruby>故<rt>gù</rt></ruby><ruby>乡<rt>xiāng</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "🌲", "title": "寻隐者不遇", "author": "唐·贾岛", "full": "松下问童子，\n言师采药去。\n只在此山中，\n云深不知处。", "ann": "言：说。童子：小孩子。", "err": "“松”右边是“公”；“深”右边是“罙”。", "no": 9, "color": "#4a8fb1", "fullRuby": "<ruby>松<rt>sōng</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>童<rt>tóng</rt></ruby><ruby>子<rt>zi</rt></ruby>，<br><ruby>言<rt>yán</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>采<rt>cǎi</rt></ruby><ruby>药<rt>yào</rt></ruby><ruby>去<rt>qù</rt></ruby>。<br><ruby>只<rt>zhǐ</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>此<rt>cǐ</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<br><ruby>云<rt>yún</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>处<rt>chù</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "🛶", "title": "池上", "author": "唐·白居易", "full": "小娃撑小艇，\n偷采白莲回。\n不解藏踪迹，\n浮萍一道开。", "ann": "艇：小船。解：懂得。", "err": "“撑”右边是“掌”；“藏”下面是“臧”。", "no": 10, "color": "#4a8fb1", "fullRuby": "<ruby>小<rt>xiǎo</rt></ruby><ruby>娃<rt>wá</rt></ruby><ruby>撑<rt>chēng</rt></ruby><ruby>小<rt>xiǎo</rt></ruby><ruby>艇<rt>tǐng</rt></ruby>，<br><ruby>偷<rt>tōu</rt></ruby><ruby>采<rt>cǎi</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>回<rt>huí</rt></ruby>。<br><ruby>不<rt>bù</rt></ruby><ruby>解<rt>jiě</rt></ruby><ruby>藏<rt>cáng</rt></ruby><ruby>踪<rt>zōng</rt></ruby><ruby>迹<rt>jì</rt></ruby>，<br><ruby>浮<rt>fú</rt></ruby><ruby>萍<rt>píng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>道<rt>dào</rt></ruby><ruby>开<rt>kāi</rt></ruby>。"}, {"grade": "一年级下册", "emoji": "🌱", "title": "小池", "author": "宋·杨万里", "full": "泉眼无声惜细流，\n树阴照水爱晴柔。\n小荷才露尖尖角，\n早有蜻蜓立上头。", "ann": "惜：爱惜。晴柔：晴天里柔和的风光。", "err": "“惜”右边是“昔”；“蜓”右边是“廷”。", "no": 11, "color": "#4a8fb1", "fullRuby": "<ruby>泉<rt>quán</rt></ruby><ruby>眼<rt>yǎn</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>惜<rt>xī</rt></ruby><ruby>细<rt>xì</rt></ruby><ruby>流<rt>liú</rt></ruby>，<br><ruby>树<rt>shù</rt></ruby><ruby>阴<rt>yīn</rt></ruby><ruby>照<rt>zhào</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>晴<rt>qíng</rt></ruby><ruby>柔<rt>róu</rt></ruby>。<br><ruby>小<rt>xiǎo</rt></ruby><ruby>荷<rt>hé</rt></ruby><ruby>才<rt>cái</rt></ruby><ruby>露<rt>lù</rt></ruby><ruby>尖<rt>jiān</rt></ruby><ruby>尖<rt>jiān</rt></ruby><ruby>角<rt>jiǎo</rt></ruby>，<br><ruby>早<rt>zǎo</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>蜻<rt>qīng</rt></ruby><ruby>蜓<rt>tíng</rt></ruby><ruby>立<rt>lì</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>头<rt>tóu</rt></ruby>。"}, {"grade": "二年级上册", "emoji": "🐎", "title": "敕勒歌", "author": "北朝民歌", "full": "敕勒川，阴山下。\n天似穹庐，笼盖四野。\n天苍苍，野茫茫，\n风吹草低见牛羊。", "ann": "穹庐：圆顶帐篷。见：同“现”，显现。", "err": "“敕”左边是“束”；“茫”右下是“亡”。", "no": 12, "color": "#9b6fb0", "fullRuby": "<ruby>敕<rt>chì</rt></ruby><ruby>勒<rt>lè</rt></ruby><ruby>川<rt>chuān</rt></ruby>，<ruby>阴<rt>yīn</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>下<rt>xià</rt></ruby>。<br><ruby>天<rt>tiān</rt></ruby><ruby>似<rt>shì</rt></ruby><ruby>穹<rt>qióng</rt></ruby><ruby>庐<rt>lú</rt></ruby>，<ruby>笼<rt>lǒng</rt></ruby><ruby>盖<rt>gài</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>野<rt>yě</rt></ruby>。<br><ruby>天<rt>tiān</rt></ruby><ruby>苍<rt>cāng</rt></ruby><ruby>苍<rt>cāng</rt></ruby>，<ruby>野<rt>yě</rt></ruby><ruby>茫<rt>máng</rt></ruby><ruby>茫<rt>máng</rt></ruby>，<br><ruby>风<rt>fēng</rt></ruby><ruby>吹<rt>chuī</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>低<rt>dī</rt></ruby><ruby>见<rt>xiàn</rt></ruby><ruby>牛<rt>niú</rt></ruby><ruby>羊<rt>yáng</rt></ruby>。"}, {"grade": "二年级上册", "emoji": "🎣", "title": "小儿垂钓", "author": "唐·胡令能", "full": "蓬头稚子学垂纶，\n侧坐莓苔草映身。\n路人借问遥招手，\n怕得鱼惊不应人。", "ann": "稚子：小孩子。纶：钓鱼用的丝线。", "err": "“垂”中间四横；“莓苔”都是草字头。", "no": 13, "color": "#9b6fb0", "fullRuby": "<ruby>蓬<rt>péng</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>稚<rt>zhì</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>垂<rt>chuí</rt></ruby><ruby>纶<rt>lún</rt></ruby>，<br><ruby>侧<rt>cè</rt></ruby><ruby>坐<rt>zuò</rt></ruby><ruby>莓<rt>méi</rt></ruby><ruby>苔<rt>tái</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>映<rt>yìng</rt></ruby><ruby>身<rt>shēn</rt></ruby>。<br><ruby>路<rt>lù</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>借<rt>jiè</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>遥<rt>yáo</rt></ruby><ruby>招<rt>zhāo</rt></ruby><ruby>手<rt>shǒu</rt></ruby>，<br><ruby>怕<rt>pà</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>鱼<rt>yú</rt></ruby><ruby>惊<rt>jīng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>应<rt>yìng</rt></ruby><ruby>人<rt>rén</rt></ruby>。"}, {"grade": "二年级上册", "emoji": "🏯", "title": "登鹳雀楼", "author": "唐·王之涣", "full": "白日依山尽，\n黄河入海流。\n欲穷千里目，\n更上一层楼。", "ann": "穷：尽。更：再。", "err": "“雀”下面是“隹”；“楼”右边是“娄”。", "no": 14, "color": "#9b6fb0", "fullRuby": "<ruby>白<rt>bái</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>依<rt>yī</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>尽<rt>jǐn</rt></ruby>，<br><ruby>黄<rt>huáng</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>海<rt>hǎi</rt></ruby><ruby>流<rt>liú</rt></ruby>。<br><ruby>欲<rt>yù</rt></ruby><ruby>穷<rt>qióng</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>目<rt>mù</rt></ruby>，<br><ruby>更<rt>gèng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>层<rt>céng</rt></ruby><ruby>楼<rt>lóu</rt></ruby>。"}, {"grade": "二年级上册", "emoji": "⛰️", "title": "望庐山瀑布", "author": "唐·李白", "full": "日照香炉生紫烟，\n遥看瀑布挂前川。\n飞流直下三千尺，\n疑是银河落九天。", "ann": "香炉：指香炉峰。川：河流。", "err": "“炉”右边是“户”；“瀑”右下是“水”。", "no": 15, "color": "#9b6fb0", "fullRuby": "<ruby>日<rt>rì</rt></ruby><ruby>照<rt>zhào</rt></ruby><ruby>香<rt>xiāng</rt></ruby><ruby>炉<rt>lú</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>紫<rt>zǐ</rt></ruby><ruby>烟<rt>yān</rt></ruby>，<br><ruby>遥<rt>yáo</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>瀑<rt>pù</rt></ruby><ruby>布<rt>bù</rt></ruby><ruby>挂<rt>guà</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>川<rt>chuān</rt></ruby>。<br><ruby>飞<rt>fēi</rt></ruby><ruby>流<rt>liú</rt></ruby><ruby>直<rt>zhí</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>尺<rt>chǐ</rt></ruby>，<br><ruby>疑<rt>yí</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>银<rt>yín</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>九<rt>jiǔ</rt></ruby><ruby>天<rt>tiān</rt></ruby>。"}, {"grade": "二年级上册", "emoji": "❄️", "title": "江雪", "author": "唐·柳宗元", "full": "千山鸟飞绝，\n万径人踪灭。\n孤舟蓑笠翁，\n独钓寒江雪。", "ann": "绝：尽，没有。径：小路。", "err": "“蓑”中间是“衰”；“笠”下面是“立”。", "no": 16, "color": "#9b6fb0", "fullRuby": "<ruby>千<rt>qiān</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>鸟<rt>niǎo</rt></ruby><ruby>飞<rt>fēi</rt></ruby><ruby>绝<rt>jué</rt></ruby>，<br><ruby>万<rt>wàn</rt></ruby><ruby>径<rt>jìng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>踪<rt>zōng</rt></ruby><ruby>灭<rt>miè</rt></ruby>。<br><ruby>孤<rt>gū</rt></ruby><ruby>舟<rt>zhōu</rt></ruby><ruby>蓑<rt>suō</rt></ruby><ruby>笠<rt>lì</rt></ruby><ruby>翁<rt>wēng</rt></ruby>，<br><ruby>独<rt>dú</rt></ruby><ruby>钓<rt>diào</rt></ruby><ruby>寒<rt>hán</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>雪<rt>xuě</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🪁", "title": "村居", "author": "清·高鼎", "full": "草长莺飞二月天，\n拂堤杨柳醉春烟。\n儿童散学归来早，\n忙趁东风放纸鸢。", "ann": "醉：陶醉。纸鸢：风筝。", "err": "“莺”上是草字头；“鸢”下面是“鸟”。", "no": 17, "color": "#d97c2b", "fullRuby": "<ruby>草<rt>cǎo</rt></ruby><ruby>长<rt>zhǎng</rt></ruby><ruby>莺<rt>yīng</rt></ruby><ruby>飞<rt>fēi</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>天<rt>tiān</rt></ruby>，<br><ruby>拂<rt>fú</rt></ruby><ruby>堤<rt>dī</rt></ruby><ruby>杨<rt>yáng</rt></ruby><ruby>柳<rt>liǔ</rt></ruby><ruby>醉<rt>zuì</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>烟<rt>yān</rt></ruby>。<br><ruby>儿<rt>ér</rt></ruby><ruby>童<rt>tóng</rt></ruby><ruby>散<rt>sàn</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>归<rt>guī</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>早<rt>zǎo</rt></ruby>，<br><ruby>忙<rt>máng</rt></ruby><ruby>趁<rt>chèn</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>放<rt>fàng</rt></ruby><ruby>纸<rt>zhǐ</rt></ruby><ruby>鸢<rt>yuān</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🌿", "title": "咏柳", "author": "唐·贺知章", "full": "碧玉妆成一树高，\n万条垂下绿丝绦。\n不知细叶谁裁出，\n二月春风似剪刀。", "ann": "妆：打扮。绦：丝带。", "err": "“碧”上面是“王”和“白”；“绦”右边是“条”。", "no": 18, "color": "#d97c2b", "fullRuby": "<ruby>碧<rt>bì</rt></ruby><ruby>玉<rt>yù</rt></ruby><ruby>妆<rt>zhuāng</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>树<rt>shù</rt></ruby><ruby>高<rt>gāo</rt></ruby>，<br><ruby>万<rt>wàn</rt></ruby><ruby>条<rt>tiáo</rt></ruby><ruby>垂<rt>chuí</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>丝<rt>sī</rt></ruby><ruby>绦<rt>tāo</rt></ruby>。<br><ruby>不<rt>bù</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>细<rt>xì</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>谁<rt>shuí</rt></ruby><ruby>裁<rt>cái</rt></ruby><ruby>出<rt>chū</rt></ruby>，<br><ruby>二<rt>èr</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>似<rt>shì</rt></ruby><ruby>剪<rt>jiǎn</rt></ruby><ruby>刀<rt>dāo</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🍀", "title": "赋得古原草送别（节选）", "author": "唐·白居易", "full": "离离原上草，\n一岁一枯荣。\n野火烧不尽，\n春风吹又生。", "ann": "离离：野草茂盛的样子。荣：茂盛。", "err": "“离”的下面不要写成“内”；“烧”右上没有点。", "no": 19, "color": "#d97c2b", "fullRuby": "<ruby>离<rt>lí</rt></ruby><ruby>离<rt>lí</rt></ruby><ruby>原<rt>yuán</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>草<rt>cǎo</rt></ruby>，<br><ruby>一<rt>yī</rt></ruby><ruby>岁<rt>suì</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>枯<rt>kū</rt></ruby><ruby>荣<rt>róng</rt></ruby>。<br><ruby>野<rt>yě</rt></ruby><ruby>火<rt>huǒ</rt></ruby><ruby>烧<rt>shāo</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>尽<rt>jǐn</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>吹<rt>chuī</rt></ruby><ruby>又<rt>yòu</rt></ruby><ruby>生<rt>shēng</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🌅", "title": "晓出净慈寺送林子方", "author": "宋·杨万里", "full": "毕竟西湖六月中，\n风光不与四时同。\n接天莲叶无穷碧，\n映日荷花别样红。", "ann": "毕竟：到底。四时：春夏秋冬。", "err": "“慈”中间是“兹”；“映”是“日”字旁。", "no": 20, "color": "#d97c2b", "fullRuby": "<ruby>毕<rt>bì</rt></ruby><ruby>竟<rt>jìng</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>湖<rt>hú</rt></ruby><ruby>六<rt>liù</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>中<rt>zhōng</rt></ruby>，<br><ruby>风<rt>fēng</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>同<rt>tóng</rt></ruby>。<br><ruby>接<rt>jiē</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>莲<rt>lián</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>穷<rt>qióng</rt></ruby><ruby>碧<rt>bì</rt></ruby>，<br><ruby>映<rt>yìng</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>荷<rt>hé</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>别<rt>bié</rt></ruby><ruby>样<rt>yàng</rt></ruby><ruby>红<rt>hóng</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🦜", "title": "绝句（两个黄鹂鸣翠柳）", "author": "唐·杜甫", "full": "两个黄鹂鸣翠柳，\n一行白鹭上青天。\n窗含西岭千秋雪，\n门泊东吴万里船。", "ann": "含：包含。泊：停船靠岸。", "err": "“鹂”“鹭”都是鸟字旁；“窗”下面是“囱”。", "no": 21, "color": "#d97c2b", "fullRuby": "<ruby>两<rt>liǎng</rt></ruby><ruby>个<rt>gè</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹂<rt>lí</rt></ruby><ruby>鸣<rt>míng</rt></ruby><ruby>翠<rt>cuì</rt></ruby><ruby>柳<rt>liǔ</rt></ruby>，<br><ruby>一<rt>yī</rt></ruby><ruby>行<rt>xíng</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>鹭<rt>lù</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>天<rt>tiān</rt></ruby>。<br><ruby>窗<rt>chuāng</rt></ruby><ruby>含<rt>hán</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>岭<rt>lǐng</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>雪<rt>xuě</rt></ruby>，<br><ruby>门<rt>mén</rt></ruby><ruby>泊<rt>bó</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>吴<rt>wú</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>船<rt>chuán</rt></ruby>。"}, {"grade": "二年级下册", "emoji": "🌽", "title": "悯农（其一）", "author": "唐·李绅", "full": "春种一粒粟，\n秋收万颗子。\n四海无闲田，\n农夫犹饿死。", "ann": "粟：谷子。闲田：荒废的田地。", "err": "“粟”下面是“米”；“农”的竖撇别漏写。", "no": 22, "color": "#d97c2b", "fullRuby": "<ruby>春<rt>chūn</rt></ruby><ruby>种<rt>zhòng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>粒<rt>lì</rt></ruby><ruby>粟<rt>sù</rt></ruby>，<br><ruby>秋<rt>qiū</rt></ruby><ruby>收<rt>shōu</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>颗<rt>kē</rt></ruby><ruby>子<rt>zi</rt></ruby>。<br><ruby>四<rt>sì</rt></ruby><ruby>海<rt>hǎi</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>闲<rt>xián</rt></ruby><ruby>田<rt>tián</rt></ruby>，<br><ruby>农<rt>nóng</rt></ruby><ruby>夫<rt>fū</rt></ruby><ruby>犹<rt>yóu</rt></ruby><ruby>饿<rt>è</rt></ruby><ruby>死<rt>sǐ</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "🐂", "title": "所见", "author": "清·袁枚", "full": "牧童骑黄牛，\n歌声振林樾。\n意欲捕鸣蝉，\n忽然闭口立。", "ann": "振：回荡。樾：树荫。欲：想要。", "err": "“牧”右边是“攵”；“蝉”左边是“虫”。", "no": 23, "color": "#d6536d", "fullRuby": "<ruby>牧<rt>mù</rt></ruby><ruby>童<rt>tóng</rt></ruby><ruby>骑<rt>qí</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>牛<rt>niú</rt></ruby>，<br><ruby>歌<rt>gē</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>振<rt>zhèn</rt></ruby><ruby>林<rt>lín</rt></ruby><ruby>樾<rt>yuè</rt></ruby>。<br><ruby>意<rt>yì</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>捕<rt>bǔ</rt></ruby><ruby>鸣<rt>míng</rt></ruby><ruby>蝉<rt>chán</rt></ruby>，<br><ruby>忽<rt>hū</rt></ruby><ruby>然<rt>rán</rt></ruby><ruby>闭<rt>bì</rt></ruby><ruby>口<rt>kǒu</rt></ruby><ruby>立<rt>lì</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "🍁", "title": "山行", "author": "唐·杜牧", "full": "远上寒山石径斜，\n白云生处有人家。\n停车坐爱枫林晚，\n霜叶红于二月花。", "ann": "坐：因为。于：比。", "err": "“径”右边是“巠”；“霜”下面是“相”。", "no": 24, "color": "#d6536d", "fullRuby": "<ruby>远<rt>yuǎn</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>寒<rt>hán</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>石<rt>shí</rt></ruby><ruby>径<rt>jìng</rt></ruby><ruby>斜<rt>xié</rt></ruby>，<br><ruby>白<rt>bái</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>家<rt>jiā</rt></ruby>。<br><ruby>停<rt>tíng</rt></ruby><ruby>车<rt>chē</rt></ruby><ruby>坐<rt>zuò</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>枫<rt>fēng</rt></ruby><ruby>林<rt>lín</rt></ruby><ruby>晚<rt>wǎn</rt></ruby>，<br><ruby>霜<rt>shuāng</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>二<rt>èr</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>花<rt>huā</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "⛵", "title": "望天门山", "author": "唐·李白", "full": "天门中断楚江开，\n碧水东流至此回。\n两岸青山相对出，\n孤帆一片日边来。", "ann": "中断：从中间断开。回：回旋。", "err": "“断”右边是“斤”；“孤”右边是“瓜”。", "no": 25, "color": "#d6536d", "fullRuby": "<ruby>天<rt>tiān</rt></ruby><ruby>门<rt>mén</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>断<rt>duàn</rt></ruby><ruby>楚<rt>chǔ</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>开<rt>kāi</rt></ruby>，<br><ruby>碧<rt>bì</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>流<rt>liú</rt></ruby><ruby>至<rt>zhì</rt></ruby><ruby>此<rt>cǐ</rt></ruby><ruby>回<rt>huí</rt></ruby>。<br><ruby>两<rt>liǎng</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>对<rt>duì</rt></ruby><ruby>出<rt>chū</rt></ruby>，<br><ruby>孤<rt>gū</rt></ruby><ruby>帆<rt>fān</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>片<rt>piàn</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>边<rt>biān</rt></ruby><ruby>来<rt>lái</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "🌄", "title": "饮湖上初晴后雨", "author": "宋·苏轼", "full": "水光潋滟晴方好，\n山色空蒙雨亦奇。\n欲把西湖比西子，\n淡妆浓抹总相宜。", "ann": "潋滟：波光闪动的样子。西子：西施。", "err": "“潋”“滟”都是三点水；“抹”右边是“末”。", "no": 26, "color": "#d6536d", "fullRuby": "<ruby>水<rt>shuǐ</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>潋<rt>liàn</rt></ruby><ruby>滟<rt>yàn</rt></ruby><ruby>晴<rt>qíng</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>好<rt>hǎo</rt></ruby>，<br><ruby>山<rt>shān</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>蒙<rt>méng</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>奇<rt>qí</rt></ruby>。<br><ruby>欲<rt>yù</rt></ruby><ruby>把<rt>bǎ</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>湖<rt>hú</rt></ruby><ruby>比<rt>bǐ</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>子<rt>zi</rt></ruby>，<br><ruby>淡<rt>dàn</rt></ruby><ruby>妆<rt>zhuāng</rt></ruby><ruby>浓<rt>nóng</rt></ruby><ruby>抹<rt>mǒ</rt></ruby><ruby>总<rt>zǒng</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>宜<rt>yí</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "🏞️", "title": "望洞庭", "author": "唐·刘禹锡", "full": "湖光秋月两相和，\n潭面无风镜未磨。\n遥望洞庭山水翠，\n白银盘里一青螺。", "ann": "和：和谐。青螺：青绿色的螺，比喻洞庭山。", "err": "“潭”右边是“覃”；“螺”是“虫”字旁。", "no": 27, "color": "#d6536d", "fullRuby": "<ruby>湖<rt>hú</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>两<rt>liǎng</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>和<rt>hé</rt></ruby>，<br><ruby>潭<rt>tán</rt></ruby><ruby>面<rt>miàn</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>镜<rt>jìng</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>磨<rt>mó</rt></ruby>。<br><ruby>遥<rt>yáo</rt></ruby><ruby>望<rt>wàng</rt></ruby><ruby>洞<rt>dòng</rt></ruby><ruby>庭<rt>tíng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>翠<rt>cuì</rt></ruby>，<br><ruby>白<rt>bái</rt></ruby><ruby>银<rt>yín</rt></ruby><ruby>盘<rt>pán</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>螺<rt>luó</rt></ruby>。"}, {"grade": "三年级上册", "emoji": "⛴️", "title": "早发白帝城", "author": "唐·李白", "full": "朝辞白帝彩云间，\n千里江陵一日还。\n两岸猿声啼不住，\n轻舟已过万重山。", "ann": "辞：告别。还：返回。", "err": "“辞”左边是“舌”；“猿”右边是“袁”。", "no": 28, "color": "#d6536d", "fullRuby": "<ruby>朝<rt>zhāo</rt></ruby><ruby>辞<rt>cí</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>帝<rt>dì</rt></ruby><ruby>彩<rt>cǎi</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>间<rt>jiān</rt></ruby>，<br><ruby>千<rt>qiān</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>陵<rt>líng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>还<rt>huán</rt></ruby>。<br><ruby>两<rt>liǎng</rt></ruby><ruby>岸<rt>àn</rt></ruby><ruby>猿<rt>yuán</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>啼<rt>tí</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>住<rt>zhù</rt></ruby>，<br><ruby>轻<rt>qīng</rt></ruby><ruby>舟<rt>zhōu</rt></ruby><ruby>已<rt>yǐ</rt></ruby><ruby>过<rt>guò</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>重<rt>chóng</rt></ruby><ruby>山<rt>shān</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🦋", "title": "绝句（迟日江山丽）", "author": "唐·杜甫", "full": "迟日江山丽，\n春风花草香。\n泥融飞燕子，\n沙暖睡鸳鸯。", "ann": "迟日：春天的太阳。泥融：泥土松软。", "err": "“融”左边是“鬲”；“鸳鸯”都是鸟字旁。", "no": 29, "color": "#c0397b", "fullRuby": "<ruby>迟<rt>chí</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>丽<rt>lì</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>香<rt>xiāng</rt></ruby>。<br><ruby>泥<rt>ní</rt></ruby><ruby>融<rt>róng</rt></ruby><ruby>飞<rt>fēi</rt></ruby><ruby>燕<rt>yàn</rt></ruby><ruby>子<rt>zi</rt></ruby>，<br><ruby>沙<rt>shā</rt></ruby><ruby>暖<rt>nuǎn</rt></ruby><ruby>睡<rt>shuì</rt></ruby><ruby>鸳<rt>yuān</rt></ruby><ruby>鸯<rt>yāng</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🦆", "title": "惠崇春江晚景", "author": "宋·苏轼", "full": "竹外桃花三两枝，\n春江水暖鸭先知。\n蒌蒿满地芦芽短，\n正是河豚欲上时。", "ann": "蒌蒿：一种草本植物。河豚：一种味美的鱼。", "err": "“惠”中间是“田”；“蒌蒿”都是草字头。", "no": 30, "color": "#c0397b", "fullRuby": "<ruby>竹<rt>zhú</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>两<rt>liǎng</rt></ruby><ruby>枝<rt>zhī</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>暖<rt>nuǎn</rt></ruby><ruby>鸭<rt>yā</rt></ruby><ruby>先<rt>xiān</rt></ruby><ruby>知<rt>zhī</rt></ruby>。<br><ruby>蒌<rt>lóu</rt></ruby><ruby>蒿<rt>hāo</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>芦<rt>lú</rt></ruby><ruby>芽<rt>yá</rt></ruby><ruby>短<rt>duǎn</rt></ruby>，<br><ruby>正<rt>zhèng</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>豚<rt>tún</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>时<rt>shí</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🌳", "title": "三衢道中", "author": "宋·曾几", "full": "梅子黄时日日晴，\n小溪泛尽却山行。\n绿阴不减来时路，\n添得黄鹂四五声。", "ann": "泛：乘船。却：再，又。", "err": "“衢”中间是“目”；“减”右边是“咸”。", "no": 31, "color": "#c0397b", "fullRuby": "<ruby>梅<rt>méi</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>晴<rt>qíng</rt></ruby>，<br><ruby>小<rt>xiǎo</rt></ruby><ruby>溪<rt>xī</rt></ruby><ruby>泛<rt>fàn</rt></ruby><ruby>尽<rt>jǐn</rt></ruby><ruby>却<rt>què</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>行<rt>xíng</rt></ruby>。<br><ruby>绿<rt>lǜ</rt></ruby><ruby>阴<rt>yīn</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>减<rt>jiǎn</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>路<rt>lù</rt></ruby>，<br><ruby>添<rt>tiān</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹂<rt>lí</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>五<rt>wǔ</rt></ruby><ruby>声<rt>shēng</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🌊", "title": "忆江南", "author": "唐·白居易", "full": "江南好，\n风景旧曾谙。\n日出江花红胜火，\n春来江水绿如蓝。\n能不忆江南？", "ann": "谙：熟悉。胜：超过。", "err": "“谙”右边是“音”；“蓝”下面是“监”。", "no": 32, "color": "#c0397b", "fullRuby": "<ruby>江<rt>jiāng</rt></ruby><ruby>南<rt>nán</rt></ruby><ruby>好<rt>hǎo</rt></ruby>，<br><ruby>风<rt>fēng</rt></ruby><ruby>景<rt>jǐng</rt></ruby><ruby>旧<rt>jiù</rt></ruby><ruby>曾<rt>céng</rt></ruby><ruby>谙<rt>ān</rt></ruby>。<br><ruby>日<rt>rì</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>胜<rt>shèng</rt></ruby><ruby>火<rt>huǒ</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>蓝<rt>lán</rt></ruby>。<br><ruby>能<rt>néng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>忆<rt>yì</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>南<rt>nán</rt></ruby>？"}, {"grade": "三年级下册", "emoji": "🧨", "title": "元日", "author": "宋·王安石", "full": "爆竹声中一岁除，\n春风送暖入屠苏。\n千门万户曈曈日，\n总把新桃换旧符。", "ann": "元日：正月初一。屠苏：屠苏酒。曈曈：太阳初升时光亮的样子。", "err": "“爆”是“火”字旁；“曈”是“日”字旁。", "no": 33, "color": "#c0397b", "fullRuby": "<ruby>爆<rt>bào</rt></ruby><ruby>竹<rt>zhú</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>岁<rt>suì</rt></ruby><ruby>除<rt>chú</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>送<rt>sòng</rt></ruby><ruby>暖<rt>nuǎn</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>屠<rt>tú</rt></ruby><ruby>苏<rt>sū</rt></ruby>。<br><ruby>千<rt>qiān</rt></ruby><ruby>门<rt>mén</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>户<rt>hù</rt></ruby><ruby>曈<rt>tóng</rt></ruby><ruby>曈<rt>tóng</rt></ruby><ruby>日<rt>rì</rt></ruby>，<br><ruby>总<rt>zǒng</rt></ruby><ruby>把<rt>bǎ</rt></ruby><ruby>新<rt>xīn</rt></ruby><ruby>桃<rt>táo</rt></ruby><ruby>换<rt>huàn</rt></ruby><ruby>旧<rt>jiù</rt></ruby><ruby>符<rt>fú</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🌧️", "title": "清明", "author": "唐·杜牧", "full": "清明时节雨纷纷，\n路上行人欲断魂。\n借问酒家何处有？\n牧童遥指杏花村。", "ann": "断魂：形容心情十分悲伤。借问：请问。", "err": "“魂”左边是“云”；“遥”右上没有点。", "no": 34, "color": "#c0397b", "fullRuby": "<ruby>清<rt>qīng</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>节<rt>jié</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>纷<rt>fēn</rt></ruby><ruby>纷<rt>fēn</rt></ruby>，<br><ruby>路<rt>lù</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>行<rt>xíng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>欲<rt>yù</rt></ruby><ruby>断<rt>duàn</rt></ruby><ruby>魂<rt>hún</rt></ruby>。<br><ruby>借<rt>jiè</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>酒<rt>jiǔ</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>有<rt>yǒu</rt></ruby>？<br><ruby>牧<rt>mù</rt></ruby><ruby>童<rt>tóng</rt></ruby><ruby>遥<rt>yáo</rt></ruby><ruby>指<rt>zhǐ</rt></ruby><ruby>杏<rt>xìng</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>村<rt>cūn</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🏔️", "title": "九月九日忆山东兄弟", "author": "唐·王维", "full": "独在异乡为异客，\n每逢佳节倍思亲。\n遥知兄弟登高处，\n遍插茱萸少一人。", "ann": "异乡：他乡。倍：加倍，更加。", "err": "“异”上面是“巳”；“茱萸”都是草字头。", "no": 35, "color": "#c0397b", "fullRuby": "<ruby>独<rt>dú</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>乡<rt>xiāng</rt></ruby><ruby>为<rt>wèi</rt></ruby><ruby>异<rt>yì</rt></ruby><ruby>客<rt>kè</rt></ruby>，<br><ruby>每<rt>měi</rt></ruby><ruby>逢<rt>féng</rt></ruby><ruby>佳<rt>jiā</rt></ruby><ruby>节<rt>jié</rt></ruby><ruby>倍<rt>bèi</rt></ruby><ruby>思<rt>sī</rt></ruby><ruby>亲<rt>qīn</rt></ruby>。<br><ruby>遥<rt>yáo</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>兄<rt>xiōng</rt></ruby><ruby>弟<rt>dì</rt></ruby><ruby>登<rt>dēng</rt></ruby><ruby>高<rt>gāo</rt></ruby><ruby>处<rt>chù</rt></ruby>，<br><ruby>遍<rt>biàn</rt></ruby><ruby>插<rt>chā</rt></ruby><ruby>茱<rt>zhū</rt></ruby><ruby>萸<rt>yú</rt></ruby><ruby>少<rt>shǎo</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>人<rt>rén</rt></ruby>。"}, {"grade": "三年级下册", "emoji": "🛶", "title": "滁州西涧", "author": "唐·韦应物", "full": "独怜幽草涧边生，\n上有黄鹂深树鸣。\n春潮带雨晚来急，\n野渡无人舟自横。", "ann": "怜：喜爱。野渡：郊野的渡口。", "err": "“涧”右边是“间”；“渡”右边是“度”。", "no": 36, "color": "#c0397b", "fullRuby": "<ruby>独<rt>dú</rt></ruby><ruby>怜<rt>lián</rt></ruby><ruby>幽<rt>yōu</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>涧<rt>jiàn</rt></ruby><ruby>边<rt>biān</rt></ruby><ruby>生<rt>shēng</rt></ruby>，<br><ruby>上<rt>shàng</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹂<rt>lí</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>树<rt>shù</rt></ruby><ruby>鸣<rt>míng</rt></ruby>。<br><ruby>春<rt>chūn</rt></ruby><ruby>潮<rt>cháo</rt></ruby><ruby>带<rt>dài</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>晚<rt>wǎn</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>急<rt>jí</rt></ruby>，<br><ruby>野<rt>yě</rt></ruby><ruby>渡<rt>dù</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>舟<rt>zhōu</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>横<rt>héng</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "🦌", "title": "鹿柴", "author": "唐·王维", "full": "空山不见人，\n但闻人语响。\n返景入深林，\n复照青苔上。", "ann": "柴：同“寨”，栅栏。返景：夕阳返照的光。", "err": "“柴”下面是“木”；“苔”下面是“台”。", "no": 37, "color": "#2e8b57", "fullRuby": "<ruby>空<rt>kōng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>人<rt>rén</rt></ruby>，<br><ruby>但<rt>dàn</rt></ruby><ruby>闻<rt>wén</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>语<rt>yǔ</rt></ruby><ruby>响<rt>xiǎng</rt></ruby>。<br><ruby>返<rt>fǎn</rt></ruby><ruby>景<rt>jǐng</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>林<rt>lín</rt></ruby>，<br><ruby>复<rt>fù</rt></ruby><ruby>照<rt>zhào</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>苔<rt>tái</rt></ruby><ruby>上<rt>shàng</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "🗻", "title": "题西林壁", "author": "宋·苏轼", "full": "横看成岭侧成峰，\n远近高低各不同。\n不识庐山真面目，\n只缘身在此山中。", "ann": "缘：因为。", "err": "“岭”右边是“令”；“侧”右边是“则”。", "no": 38, "color": "#2e8b57", "fullRuby": "<ruby>横<rt>héng</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>岭<rt>lǐng</rt></ruby><ruby>侧<rt>cè</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>峰<rt>fēng</rt></ruby>，<br><ruby>远<rt>yuǎn</rt></ruby><ruby>近<rt>jìn</rt></ruby><ruby>高<rt>gāo</rt></ruby><ruby>低<rt>dī</rt></ruby><ruby>各<rt>gè</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>同<rt>tóng</rt></ruby>。<br><ruby>不<rt>bù</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>庐<rt>lú</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>真<rt>zhēn</rt></ruby><ruby>面<rt>miàn</rt></ruby><ruby>目<rt>mù</rt></ruby>，<br><ruby>只<rt>zhǐ</rt></ruby><ruby>缘<rt>yuán</rt></ruby><ruby>身<rt>shēn</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>此<rt>cǐ</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>中<rt>zhōng</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "🏇", "title": "出塞", "author": "唐·王昌龄", "full": "秦时明月汉时关，\n万里长征人未还。\n但使龙城飞将在，\n不教胡马度阴山。", "ann": "但使：只要。教：使，令。", "err": "“塞”上面是“宀”；“度”是“广”字头。", "no": 39, "color": "#2e8b57", "fullRuby": "<ruby>秦<rt>qín</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>汉<rt>hàn</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>关<rt>guān</rt></ruby>，<br><ruby>万<rt>wàn</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>长<rt>cháng</rt></ruby><ruby>征<rt>zhēng</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>还<rt>huán</rt></ruby>。<br><ruby>但<rt>dàn</rt></ruby><ruby>使<rt>shǐ</rt></ruby><ruby>龙<rt>lóng</rt></ruby><ruby>城<rt>chéng</rt></ruby><ruby>飞<rt>fēi</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>在<rt>zài</rt></ruby>，<br><ruby>不<rt>bù</rt></ruby><ruby>教<rt>jiào</rt></ruby><ruby>胡<rt>hú</rt></ruby><ruby>马<rt>mǎ</rt></ruby><ruby>度<rt>dù</rt></ruby><ruby>阴<rt>yīn</rt></ruby><ruby>山<rt>shān</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "🍷", "title": "凉州词", "author": "唐·王翰", "full": "葡萄美酒夜光杯，\n欲饮琵琶马上催。\n醉卧沙场君莫笑，\n古来征战几人回。", "ann": "夜光杯：美玉做的酒杯。沙场：战场。", "err": "“琵”“琶”都是王字旁；“醉”右边是“卒”。", "no": 40, "color": "#2e8b57", "fullRuby": "<ruby>葡<rt>pú</rt></ruby><ruby>萄<rt>táo</rt></ruby><ruby>美<rt>měi</rt></ruby><ruby>酒<rt>jiǔ</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>杯<rt>bēi</rt></ruby>，<br><ruby>欲<rt>yù</rt></ruby><ruby>饮<rt>yǐn</rt></ruby><ruby>琵<rt>pí</rt></ruby><ruby>琶<rt>pá</rt></ruby><ruby>马<rt>mǎ</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>催<rt>cuī</rt></ruby>。<br><ruby>醉<rt>zuì</rt></ruby><ruby>卧<rt>wò</rt></ruby><ruby>沙<rt>shā</rt></ruby><ruby>场<rt>chǎng</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>莫<rt>mò</rt></ruby><ruby>笑<rt>xiào</rt></ruby>，<br><ruby>古<rt>gǔ</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>征<rt>zhēng</rt></ruby><ruby>战<rt>zhàn</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>回<rt>huí</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "⚔️", "title": "夏日绝句", "author": "宋·李清照", "full": "生当作人杰，\n死亦为鬼雄。\n至今思项羽，\n不肯过江东。", "ann": "人杰：人中豪杰。鬼雄：鬼中英雄。", "err": "“杰”下面是四点底；“项”右边是“页”。", "no": 41, "color": "#2e8b57", "fullRuby": "<ruby>生<rt>shēng</rt></ruby><ruby>当<rt>dāng</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>杰<rt>jié</rt></ruby>，<br><ruby>死<rt>sǐ</rt></ruby><ruby>亦<rt>yì</rt></ruby><ruby>为<rt>wèi</rt></ruby><ruby>鬼<rt>guǐ</rt></ruby><ruby>雄<rt>xióng</rt></ruby>。<br><ruby>至<rt>zhì</rt></ruby><ruby>今<rt>jīn</rt></ruby><ruby>思<rt>sī</rt></ruby><ruby>项<rt>xiàng</rt></ruby><ruby>羽<rt>yǔ</rt></ruby>，<br><ruby>不<rt>bù</rt></ruby><ruby>肯<rt>kěn</rt></ruby><ruby>过<rt>guò</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>东<rt>dōng</rt></ruby>。"}, {"grade": "四年级上册", "emoji": "🌫️", "title": "别董大", "author": "唐·高适", "full": "千里黄云白日曛，\n北风吹雁雪纷纷。\n莫愁前路无知己，\n天下谁人不识君。", "ann": "曛：昏暗。知己：知心的朋友。", "err": "“曛”是“日”字旁；“雁”右上是“隹”。", "no": 42, "color": "#2e8b57", "fullRuby": "<ruby>千<rt>qiān</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>曛<rt>xūn</rt></ruby>，<br><ruby>北<rt>běi</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>吹<rt>chuī</rt></ruby><ruby>雁<rt>yàn</rt></ruby><ruby>雪<rt>xuě</rt></ruby><ruby>纷<rt>fēn</rt></ruby><ruby>纷<rt>fēn</rt></ruby>。<br><ruby>莫<rt>mò</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>路<rt>lù</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>己<rt>jǐ</rt></ruby>，<br><ruby>天<rt>tiān</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>谁<rt>shuí</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>君<rt>jūn</rt></ruby>。"}, {"grade": "四年级下册", "emoji": "🌻", "title": "四时田园杂兴（其二十五）", "author": "宋·范成大", "full": "梅子金黄杏子肥，\n麦花雪白菜花稀。\n日长篱落无人过，\n惟有蜻蜓蛱蝶飞。", "ann": "杂兴：随兴而写的诗。蛱蝶：蝴蝶的一种。", "err": "“篱”下面是“离”；“蛱”右边是“夹”。", "no": 43, "color": "#1e7a4f", "fullRuby": "<ruby>梅<rt>méi</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>金<rt>jīn</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>杏<rt>xìng</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>肥<rt>féi</rt></ruby>，<br><ruby>麦<rt>mài</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>雪<rt>xuě</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>菜<rt>cài</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>稀<rt>xī</rt></ruby>。<br><ruby>日<rt>rì</rt></ruby><ruby>长<rt>zhǎng</rt></ruby><ruby>篱<rt>lí</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>过<rt>guò</rt></ruby>，<br><ruby>惟<rt>wéi</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>蜻<rt>qīng</rt></ruby><ruby>蜓<rt>tíng</rt></ruby><ruby>蛱<rt>jiá</rt></ruby><ruby>蝶<rt>dié</rt></ruby><ruby>飞<rt>fēi</rt></ruby>。"}, {"grade": "四年级下册", "emoji": "🌺", "title": "江畔独步寻花", "author": "唐·杜甫", "full": "黄师塔前江水东，\n春光懒困倚微风。\n桃花一簇开无主，\n可爱深红爱浅红？", "ann": "簇：量词，丛。无主：没有主人。", "err": "“畔”右边是“半”；“倚”右边是“奇”。", "no": 44, "color": "#1e7a4f", "fullRuby": "<ruby>黄<rt>huáng</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>塔<rt>tǎ</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>东<rt>dōng</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>懒<rt>lǎn</rt></ruby><ruby>困<rt>kùn</rt></ruby><ruby>倚<rt>yǐ</rt></ruby><ruby>微<rt>wēi</rt></ruby><ruby>风<rt>fēng</rt></ruby>。<br><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>簇<rt>cù</rt></ruby><ruby>开<rt>kāi</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>主<rt>zhǔ</rt></ruby>，<br><ruby>可<rt>kě</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>深<rt>shēn</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>浅<rt>qiǎn</rt></ruby><ruby>红<rt>hóng</rt></ruby>？"}, {"grade": "四年级下册", "emoji": "🐝", "title": "蜂", "author": "唐·罗隐", "full": "不论平地与山尖，\n无限风光尽被占。\n采得百花成蜜后，\n为谁辛苦为谁甜？", "ann": "占：占据，享有。尽：都。", "err": "“蜂”是“虫”字旁；“辛”下面一竖出头。", "no": 45, "color": "#1e7a4f", "fullRuby": "<ruby>不<rt>bù</rt></ruby><ruby>论<rt>lùn</rt></ruby><ruby>平<rt>píng</rt></ruby><ruby>地<rt>dì</rt></ruby><ruby>与<rt>yǔ</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>尖<rt>jiān</rt></ruby>，<br><ruby>无<rt>wú</rt></ruby><ruby>限<rt>xiàn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>尽<rt>jǐn</rt></ruby><ruby>被<rt>bèi</rt></ruby><ruby>占<rt>zhàn</rt></ruby>。<br><ruby>采<rt>cǎi</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>蜜<rt>mì</rt></ruby><ruby>后<rt>hòu</rt></ruby>，<br><ruby>为<rt>wèi</rt></ruby><ruby>谁<rt>shuí</rt></ruby><ruby>辛<rt>xīn</rt></ruby><ruby>苦<rt>kǔ</rt></ruby><ruby>为<rt>wèi</rt></ruby><ruby>谁<rt>shuí</rt></ruby><ruby>甜<rt>tián</rt></ruby>？"}, {"grade": "四年级下册", "emoji": "💧", "title": "芙蓉楼送辛渐", "author": "唐·王昌龄", "full": "寒雨连江夜入吴，\n平明送客楚山孤。\n洛阳亲友如相问，\n一片冰心在玉壶。", "ann": "平明：天刚亮。冰心：像冰一样纯洁的心。", "err": "“芙”“蓉”都是草字头；“壶”下面是“业”。", "no": 46, "color": "#1e7a4f", "fullRuby": "<ruby>寒<rt>hán</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>连<rt>lián</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>吴<rt>wú</rt></ruby>，<br><ruby>平<rt>píng</rt></ruby><ruby>明<rt>míng</rt></ruby><ruby>送<rt>sòng</rt></ruby><ruby>客<rt>kè</rt></ruby><ruby>楚<rt>chǔ</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>孤<rt>gū</rt></ruby>。<br><ruby>洛<rt>luò</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>亲<rt>qīn</rt></ruby><ruby>友<rt>yǒu</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>问<rt>wèn</rt></ruby>，<br><ruby>一<rt>yī</rt></ruby><ruby>片<rt>piàn</rt></ruby><ruby>冰<rt>bīng</rt></ruby><ruby>心<rt>xīn</rt></ruby><ruby>在<rt>zài</rt></ruby><ruby>玉<rt>yù</rt></ruby><ruby>壶<rt>hú</rt></ruby>。"}, {"grade": "四年级下册", "emoji": "🏹", "title": "塞下曲", "author": "唐·卢纶", "full": "月黑雁飞高，\n单于夜遁逃。\n欲将轻骑逐，\n大雪满弓刀。", "ann": "单于：匈奴的首领。遁：逃跑。将：率领。", "err": "“遁”“逐”都是走之旁；“单”中间是竖。", "no": 47, "color": "#1e7a4f", "fullRuby": "<ruby>月<rt>yuè</rt></ruby><ruby>黑<rt>hēi</rt></ruby><ruby>雁<rt>yàn</rt></ruby><ruby>飞<rt>fēi</rt></ruby><ruby>高<rt>gāo</rt></ruby>，<br><ruby>单<rt>chán</rt></ruby><ruby>于<rt>yú</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>遁<rt>dùn</rt></ruby><ruby>逃<rt>táo</rt></ruby>。<br><ruby>欲<rt>yù</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>轻<rt>qīng</rt></ruby><ruby>骑<rt>qí</rt></ruby><ruby>逐<rt>zhú</rt></ruby>，<br><ruby>大<rt>dà</rt></ruby><ruby>雪<rt>xuě</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>弓<rt>gōng</rt></ruby><ruby>刀<rt>dāo</rt></ruby>。"}, {"grade": "四年级下册", "emoji": "🖌️", "title": "墨梅", "author": "元·王冕", "full": "我家洗砚池头树，\n朵朵花开淡墨痕。\n不要人夸颜色好，\n只留清气满乾坤。", "ann": "乾坤：天地间。", "err": "“砚”右边是“见”；“乾”左边是“十日”。", "no": 48, "color": "#1e7a4f", "fullRuby": "<ruby>我<rt>wǒ</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>洗<rt>xǐ</rt></ruby><ruby>砚<rt>yàn</rt></ruby><ruby>池<rt>chí</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>树<rt>shù</rt></ruby>，<br><ruby>朵<rt>duǒ</rt></ruby><ruby>朵<rt>duǒ</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>开<rt>kāi</rt></ruby><ruby>淡<rt>dàn</rt></ruby><ruby>墨<rt>mò</rt></ruby><ruby>痕<rt>hén</rt></ruby>。<br><ruby>不<rt>bù</rt></ruby><ruby>要<rt>yào</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>夸<rt>kuā</rt></ruby><ruby>颜<rt>yán</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>好<rt>hǎo</rt></ruby>，<br><ruby>只<rt>zhǐ</rt></ruby><ruby>留<rt>liú</rt></ruby><ruby>清<rt>qīng</rt></ruby><ruby>气<rt>qì</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>乾<rt>qián</rt></ruby><ruby>坤<rt>kūn</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "📜", "title": "示儿", "author": "宋·陆游", "full": "死去元知万事空，\n但悲不见九州同。\n王师北定中原日，\n家祭无忘告乃翁。", "ann": "元：同“原”，本来。乃翁：你们的父亲。", "err": "“祭”右上是“又”不是“夕”；“翁”下面是“羽”。", "no": 49, "color": "#2c5f8a", "fullRuby": "<ruby>死<rt>sǐ</rt></ruby><ruby>去<rt>qù</rt></ruby><ruby>元<rt>yuán</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>事<rt>shì</rt></ruby><ruby>空<rt>kōng</rt></ruby>，<br><ruby>但<rt>dàn</rt></ruby><ruby>悲<rt>bēi</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>九<rt>jiǔ</rt></ruby><ruby>州<rt>zhōu</rt></ruby><ruby>同<rt>tóng</rt></ruby>。<br><ruby>王<rt>wáng</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>北<rt>běi</rt></ruby><ruby>定<rt>dìng</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>原<rt>yuán</rt></ruby><ruby>日<rt>rì</rt></ruby>，<br><ruby>家<rt>jiā</rt></ruby><ruby>祭<rt>jì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>忘<rt>wàng</rt></ruby><ruby>告<rt>gào</rt></ruby><ruby>乃<rt>nǎi</rt></ruby><ruby>翁<rt>wēng</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "🏮", "title": "题临安邸", "author": "宋·林升", "full": "山外青山楼外楼，\n西湖歌舞几时休。\n暖风熏得游人醉，\n直把杭州作汴州。", "ann": "邸：旅店。熏：吹拂。休：停止。", "err": "“邸”右边是“阝”；“熏”上面是“千”。", "no": 50, "color": "#2c5f8a", "fullRuby": "<ruby>山<rt>shān</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>楼<rt>lóu</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>楼<rt>lóu</rt></ruby>，<br><ruby>西<rt>xī</rt></ruby><ruby>湖<rt>hú</rt></ruby><ruby>歌<rt>gē</rt></ruby><ruby>舞<rt>wǔ</rt></ruby><ruby>几<rt>jǐ</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>休<rt>xiū</rt></ruby>。<br><ruby>暖<rt>nuǎn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>熏<rt>xūn</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>游<rt>yóu</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>醉<rt>zuì</rt></ruby>，<br><ruby>直<rt>zhí</rt></ruby><ruby>把<rt>bǎ</rt></ruby><ruby>杭<rt>háng</rt></ruby><ruby>州<rt>zhōu</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>汴<rt>biàn</rt></ruby><ruby>州<rt>zhōu</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "🌸", "title": "己亥杂诗", "author": "清·龚自珍", "full": "浩荡离愁白日斜，\n吟鞭东指即天涯。\n落红不是无情物，\n化作春泥更护花。", "ann": "浩荡：形容离愁广阔无边。吟鞭：诗人的马鞭。落红：落花。", "err": "“己”不封口；“涯”右边是“厓”。", "no": 51, "color": "#2c5f8a", "fullRuby": "<ruby>浩<rt>hào</rt></ruby><ruby>荡<rt>dàng</rt></ruby><ruby>离<rt>lí</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>斜<rt>xié</rt></ruby>，<br><ruby>吟<rt>yín</rt></ruby><ruby>鞭<rt>biān</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>指<rt>zhǐ</rt></ruby><ruby>即<rt>jí</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>涯<rt>yá</rt></ruby>。<br><ruby>落<rt>luò</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>情<rt>qíng</rt></ruby><ruby>物<rt>wù</rt></ruby>，<br><ruby>化<rt>huà</rt></ruby><ruby>作<rt>zuò</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>泥<rt>ní</rt></ruby><ruby>更<rt>gèng</rt></ruby><ruby>护<rt>hù</rt></ruby><ruby>花<rt>huā</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "⛩️", "title": "枫桥夜泊", "author": "唐·张继", "full": "月落乌啼霜满天，\n江枫渔火对愁眠。\n姑苏城外寒山寺，\n夜半钟声到客船。", "ann": "姑苏：苏州的别称。夜半：半夜。", "err": "“枫”右边是“风”；“寺”上面是“土”。", "no": 52, "color": "#2c5f8a", "fullRuby": "<ruby>月<rt>yuè</rt></ruby><ruby>落<rt>luò</rt></ruby><ruby>乌<rt>wū</rt></ruby><ruby>啼<rt>tí</rt></ruby><ruby>霜<rt>shuāng</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>天<rt>tiān</rt></ruby>，<br><ruby>江<rt>jiāng</rt></ruby><ruby>枫<rt>fēng</rt></ruby><ruby>渔<rt>yú</rt></ruby><ruby>火<rt>huǒ</rt></ruby><ruby>对<rt>duì</rt></ruby><ruby>愁<rt>chóu</rt></ruby><ruby>眠<rt>mián</rt></ruby>。<br><ruby>姑<rt>gū</rt></ruby><ruby>苏<rt>sū</rt></ruby><ruby>城<rt>chéng</rt></ruby><ruby>外<rt>wài</rt></ruby><ruby>寒<rt>hán</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>寺<rt>sì</rt></ruby>，<br><ruby>夜<rt>yè</rt></ruby><ruby>半<rt>bàn</rt></ruby><ruby>钟<rt>zhōng</rt></ruby><ruby>声<rt>shēng</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>客<rt>kè</rt></ruby><ruby>船<rt>chuán</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "🐟", "title": "渔歌子", "author": "唐·张志和", "full": "西塞山前白鹭飞，\n桃花流水鳜鱼肥。\n青箬笠，绿蓑衣，\n斜风细雨不须归。", "ann": "鳜鱼：一种味美的鱼。箬笠：竹篾编的斗笠。", "err": "“鳜”是“鱼”字旁；“蓑”中间是“衰”。", "no": 53, "color": "#2c5f8a", "fullRuby": "<ruby>西<rt>xī</rt></ruby><ruby>塞<rt>sài</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>前<rt>qián</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>鹭<rt>lù</rt></ruby><ruby>飞<rt>fēi</rt></ruby>，<br><ruby>桃<rt>táo</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>流<rt>liú</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>鳜<rt>guì</rt></ruby><ruby>鱼<rt>yú</rt></ruby><ruby>肥<rt>féi</rt></ruby>。<br><ruby>青<rt>qīng</rt></ruby><ruby>箬<rt>ruò</rt></ruby><ruby>笠<rt>lì</rt></ruby>，<ruby>绿<rt>lǜ</rt></ruby><ruby>蓑<rt>suō</rt></ruby><ruby>衣<rt>yī</rt></ruby>，<br><ruby>斜<rt>xié</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>细<rt>xì</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>须<rt>xū</rt></ruby><ruby>归<rt>guī</rt></ruby>。"}, {"grade": "五年级上册", "emoji": "📖", "title": "观书有感", "author": "宋·朱熹", "full": "半亩方塘一鉴开，\n天光云影共徘徊。\n问渠那得清如许？\n为有源头活水来。", "ann": "鉴：镜子。渠：它，指方塘。如许：如此。", "err": "“鉴”下面是“金”；“徘徊”都是双人旁。", "no": 54, "color": "#2c5f8a", "fullRuby": "<ruby>半<rt>bàn</rt></ruby><ruby>亩<rt>mǔ</rt></ruby><ruby>方<rt>fāng</rt></ruby><ruby>塘<rt>táng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>鉴<rt>jiàn</rt></ruby><ruby>开<rt>kāi</rt></ruby>，<br><ruby>天<rt>tiān</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>影<rt>yǐng</rt></ruby><ruby>共<rt>gòng</rt></ruby><ruby>徘<rt>pái</rt></ruby><ruby>徊<rt>huái</rt></ruby>。<br><ruby>问<rt>wèn</rt></ruby><ruby>渠<rt>qú</rt></ruby><ruby>那<rt>nǎ</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>清<rt>qīng</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>许<rt>xǔ</rt></ruby>？<br><ruby>为<rt>wèi</rt></ruby><ruby>有<rt>yǒu</rt></ruby><ruby>源<rt>yuán</rt></ruby><ruby>头<rt>tóu</rt></ruby><ruby>活<rt>huó</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>来<rt>lái</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🧑‍🌾", "title": "四时田园杂兴（其三十一）", "author": "宋·范成大", "full": "昼出耘田夜绩麻，\n村庄儿女各当家。\n童孙未解供耕织，\n也傍桑阴学种瓜。", "ann": "绩麻：把麻搓成线。供：从事。傍：靠近。", "err": "“耘”右边是“云”；“傍”右边是“旁”。", "no": 55, "color": "#1f4e79", "fullRuby": "<ruby>昼<rt>zhòu</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>耘<rt>yún</rt></ruby><ruby>田<rt>tián</rt></ruby><ruby>夜<rt>yè</rt></ruby><ruby>绩<rt>jì</rt></ruby><ruby>麻<rt>má</rt></ruby>，<br><ruby>村<rt>cūn</rt></ruby><ruby>庄<rt>zhuāng</rt></ruby><ruby>儿<rt>ér</rt></ruby><ruby>女<rt>nǚ</rt></ruby><ruby>各<rt>gè</rt></ruby><ruby>当<rt>dāng</rt></ruby><ruby>家<rt>jiā</rt></ruby>。<br><ruby>童<rt>tóng</rt></ruby><ruby>孙<rt>sūn</rt></ruby><ruby>未<rt>wèi</rt></ruby><ruby>解<rt>jiě</rt></ruby><ruby>供<rt>gòng</rt></ruby><ruby>耕<rt>gēng</rt></ruby><ruby>织<rt>zhī</rt></ruby>，<br><ruby>也<rt>yě</rt></ruby><ruby>傍<rt>bàng</rt></ruby><ruby>桑<rt>sāng</rt></ruby><ruby>阴<rt>yīn</rt></ruby><ruby>学<rt>xué</rt></ruby><ruby>种<rt>zhòng</rt></ruby><ruby>瓜<rt>guā</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🧵", "title": "游子吟", "author": "唐·孟郊", "full": "慈母手中线，\n游子身上衣。\n临行密密缝，\n意恐迟迟归。\n谁言寸草心，\n报得三春晖。", "ann": "寸草心：小草的嫩心，比喻子女的心意。三春晖：春天的阳光。", "err": "“缝”右边是“逢”；“晖”是“日”字旁。", "no": 56, "color": "#1f4e79", "fullRuby": "<ruby>慈<rt>cí</rt></ruby><ruby>母<rt>mǔ</rt></ruby><ruby>手<rt>shǒu</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>线<rt>xiàn</rt></ruby>，<br><ruby>游<rt>yóu</rt></ruby><ruby>子<rt>zi</rt></ruby><ruby>身<rt>shēn</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>衣<rt>yī</rt></ruby>。<br><ruby>临<rt>lín</rt></ruby><ruby>行<rt>xíng</rt></ruby><ruby>密<rt>mì</rt></ruby><ruby>密<rt>mì</rt></ruby><ruby>缝<rt>féng</rt></ruby>，<br><ruby>意<rt>yì</rt></ruby><ruby>恐<rt>kǒng</rt></ruby><ruby>迟<rt>chí</rt></ruby><ruby>迟<rt>chí</rt></ruby><ruby>归<rt>guī</rt></ruby>。<br><ruby>谁<rt>shuí</rt></ruby><ruby>言<rt>yán</rt></ruby><ruby>寸<rt>cùn</rt></ruby><ruby>草<rt>cǎo</rt></ruby><ruby>心<rt>xīn</rt></ruby>，<br><ruby>报<rt>bào</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>晖<rt>huī</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🌄", "title": "秋夜将晓出篱门迎凉有感", "author": "宋·陆游", "full": "三万里河东入海，\n五千仞岳上摩天。\n遗民泪尽胡尘里，\n南望王师又一年。", "ann": "将晓：天快亮。仞：古代长度单位。遗民：沦陷区的人民。", "err": "“仞”右边是“刃”；“岳”下面是“山”。", "no": 57, "color": "#1f4e79", "fullRuby": "<ruby>三<rt>sān</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>海<rt>hǎi</rt></ruby>，<br><ruby>五<rt>wǔ</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>仞<rt>rèn</rt></ruby><ruby>岳<rt>yuè</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>摩<rt>mó</rt></ruby><ruby>天<rt>tiān</rt></ruby>。<br><ruby>遗<rt>yí</rt></ruby><ruby>民<rt>mín</rt></ruby><ruby>泪<rt>lèi</rt></ruby><ruby>尽<rt>jǐn</rt></ruby><ruby>胡<rt>hú</rt></ruby><ruby>尘<rt>chén</rt></ruby><ruby>里<rt>lǐ</rt></ruby>，<br><ruby>南<rt>nán</rt></ruby><ruby>望<rt>wàng</rt></ruby><ruby>王<rt>wáng</rt></ruby><ruby>师<rt>shī</rt></ruby><ruby>又<rt>yòu</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>年<rt>nián</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🏜️", "title": "凉州词", "author": "唐·王之涣", "full": "黄河远上白云间，\n一片孤城万仞山。\n羌笛何须怨杨柳，\n春风不度玉门关。", "ann": "何须：何必。度：吹过。", "err": "“羌”下面是“儿”；“怨”下面是“心”。", "no": 58, "color": "#1f4e79", "fullRuby": "<ruby>黄<rt>huáng</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>白<rt>bái</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>间<rt>jiān</rt></ruby>，<br><ruby>一<rt>yī</rt></ruby><ruby>片<rt>piàn</rt></ruby><ruby>孤<rt>gū</rt></ruby><ruby>城<rt>chéng</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>仞<rt>rèn</rt></ruby><ruby>山<rt>shān</rt></ruby>。<br><ruby>羌<rt>qiāng</rt></ruby><ruby>笛<rt>dí</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>须<rt>xū</rt></ruby><ruby>怨<rt>yuàn</rt></ruby><ruby>杨<rt>yáng</rt></ruby><ruby>柳<rt>liǔ</rt></ruby>，<br><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>度<rt>dù</rt></ruby><ruby>玉<rt>yù</rt></ruby><ruby>门<rt>mén</rt></ruby><ruby>关<rt>guān</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🛳️", "title": "黄鹤楼送孟浩然之广陵", "author": "唐·李白", "full": "故人西辞黄鹤楼，\n烟花三月下扬州。\n孤帆远影碧空尽，\n唯见长江天际流。", "ann": "之：往，去。故人：老朋友。烟花：繁花似锦的春景。", "err": "“辞”左边是“舌”；“唯”是“口”字旁。", "no": 59, "color": "#1f4e79", "fullRuby": "<ruby>故<rt>gù</rt></ruby><ruby>人<rt>rén</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>辞<rt>cí</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>鹤<rt>hè</rt></ruby><ruby>楼<rt>lóu</rt></ruby>，<br><ruby>烟<rt>yān</rt></ruby><ruby>花<rt>huā</rt></ruby><ruby>三<rt>sān</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>下<rt>xià</rt></ruby><ruby>扬<rt>yáng</rt></ruby><ruby>州<rt>zhōu</rt></ruby>。<br><ruby>孤<rt>gū</rt></ruby><ruby>帆<rt>fān</rt></ruby><ruby>远<rt>yuǎn</rt></ruby><ruby>影<rt>yǐng</rt></ruby><ruby>碧<rt>bì</rt></ruby><ruby>空<rt>kōng</rt></ruby><ruby>尽<rt>jǐn</rt></ruby>，<br><ruby>唯<rt>wéi</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>长<rt>zhǎng</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>际<rt>jì</rt></ruby><ruby>流<rt>liú</rt></ruby>。"}, {"grade": "五年级下册", "emoji": "🕊️", "title": "乡村四月", "author": "宋·翁卷", "full": "绿遍山原白满川，\n子规声里雨如烟。\n乡村四月闲人少，\n才了蚕桑又插田。", "ann": "山原：山地和平原。子规：布谷鸟。了：结束。", "err": " a2b", "fullRuby": "<ruby>胜<rt>shèng</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>寻<rt>xún</rt></ruby><ruby>芳<rt>fāng</rt></ruby><ruby>泗<rt>sì</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>滨<rt>bīn</rt></ruby>，<br><ruby>无<rt>wú</rt></ruby><ruby>边<rt>biān</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>景<rt>jǐng</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>新<rt>xīn</rt></ruby>。<br><ruby>等<rt>děng</rt></ruby><ruby>闲<rt>xián</rt></ruby><ruby>识<rt>shí</rt></ruby><ruby>得<rt>dé</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>面<rt>miàn</rt></ruby>，<br><ruby>万<rt>wàn</rt></ruby><ruby>紫<rt>zǐ</rt></ruby><ruby>千<rt>qiān</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>总<rt>zǒng</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>春<rt>chūn</rt></ruby>。"}, {"grade": "六年级上册", "emoji": "🏡", "title": "回乡偶书", "author": "唐·贺知章", "full": "少小离家老大回，\n乡音无改鬓毛衰。\n儿童相见不相识，\n笑问客从何处来。", "ann": "偶书：偶然写下的诗。鬓毛：耳边的头发。", "err": "“鬓”上面是“髟”；“衰”中间是“口”。", "no": 63, "color": "#8b5a2b", "fullRuby": "<ruby>少<rt>shào</rt></ruby><ruby>小<rt>xiǎo</rt></ruby><ruby>离<rt>lí</rt></ruby><ruby>家<rt>jiā</rt></ruby><ruby>老<rt>lǎo</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>回<rt>huí</rt></ruby>，<br><ruby>乡<rt>xiāng</rt></ruby><ruby>音<rt>yīn</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>改<rt>gǎi</rt></ruby><ruby>鬓<rt>bìn</rt></ruby><ruby>毛<rt>máo</rt></ruby><ruby>衰<rt>cuī</rt></ruby>。<br><ruby>儿<rt>ér</rt></ruby><ruby>童<rt>tóng</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>见<rt>jiàn</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>相<rt>xiāng</rt></ruby><ruby>识<rt>shí</rt></ruby>，<br><ruby>笑<rt>xiào</rt></ruby><ruby>问<rt>wèn</rt></ruby><ruby>客<rt>kè</rt></ruby><ruby>从<rt>cóng</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>处<rt>chù</rt></ruby><ruby>来<rt>lái</rt></ruby>。"}, {"grade": "六年级上册", "emoji": "🌊", "title": "浪淘沙", "author": "唐·刘禹锡", "full": "九曲黄河万里沙，\n浪淘风簸自天涯。\n如今直上银河去，\n同到牵牛织女家。", "ann": "簸：颠簸摇荡。牵牛织女：牛郎星和织女星。", "err": "“淘”右边是“匋”；“簸”下面是“皮”。", "no": 64, "color": "#8b5a2b", "fullRuby": "<ruby>九<rt>jiǔ</rt></ruby><ruby>曲<rt>qū</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>万<rt>wàn</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>沙<rt>shā</rt></ruby>，<br><ruby>浪<rt>làng</rt></ruby><ruby>淘<rt>táo</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>簸<rt>bǒ</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>天<rt>tiān</rt></ruby><ruby>涯<rt>yá</rt></ruby>。<br><ruby>如<rt>rú</rt></ruby><ruby>今<rt>jīn</rt></ruby><ruby>直<rt>zhí</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>银<rt>yín</rt></ruby><ruby>河<rt>hé</rt></ruby><ruby>去<rt>qù</rt></ruby>，<br><ruby>同<rt>tóng</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>牵<rt>qiān</rt></ruby><ruby>牛<rt>niú</rt></ruby><ruby>织<rt>zhī</rt></ruby><ruby>女<rt>nǚ</rt></ruby><ruby>家<rt>jiā</rt></ruby>。"}, {"grade": "六年级上册", "emoji": "🏙️", "title": "江南春", "author": "唐·杜牧", "full": "千里莺啼绿映红，\n水村山郭酒旗风。\n南朝四百八十寺，\n多少楼台烟雨中。", "ann": "山郭：依山而建的城。南朝：东晋以后南方的朝代。", "err": "“莺”上是草字头；“旗”右边是“其”。", "no": 65, "color": "#8b5a2b", "fullRuby": "<ruby>千<rt>qiān</rt></ruby><ruby>里<rt>lǐ</rt></ruby><ruby>莺<rt>yīng</rt></ruby><ruby>啼<rt>tí</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>映<rt>yìng</rt></ruby><ruby>红<rt>hóng</rt></ruby>，<br><ruby>水<rt>shuǐ</rt></ruby><ruby>村<rt>cūn</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>郭<rt>guō</rt></ruby><ruby>酒<rt>jiǔ</rt></ruby><ruby>旗<rt>qí</rt></ruby><ruby>风<rt>fēng</rt></ruby>。<br><ruby>南<rt>nán</rt></ruby><ruby>朝<rt>cháo</rt></ruby><ruby>四<rt>sì</rt></ruby><ruby>百<rt>bǎi</rt></ruby><ruby>八<rt>bā</rt></ruby><ruby>十<rt>shí</rt></ruby><ruby>寺<rt>sì</rt></ruby>，<br><ruby>多<rt>duō</rt></ruby><ruby>少<rt>shǎo</rt></ruby><ruby>楼<rt>lóu</rt></ruby><ruby>台<rt>tái</rt></ruby><ruby>烟<rt>yān</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>中<rt>zhōng</rt></ruby>。"}, {"grade": "六年级上册", "emoji": "🏠", "title": "书湖阴先生壁", "author": "宋·王安石", "full": "茅檐长扫净无苔，\n花木成畦手自栽。\n一水护田将绿绕，\n两山排闼送青来。", "ann": "畦：田地分成的块。排闼：推开门。", "err": "“檐”右边是“詹”；“畦”右边是“圭”。", "no": 66, "color": "#8b5a2b", "fullRuby": "<ruby>茅<rt>máo</rt></ruby><ruby>檐<rt>yán</rt></ruby><ruby>长<rt>zhǎng</rt></ruby><ruby>扫<rt>sǎo</rt></ruby><ruby>净<rt>jìng</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>苔<rt>tái</rt></ruby>，<br><ruby>花<rt>huā</rt></ruby><ruby>木<rt>mù</rt></ruby><ruby>成<rt>chéng</rt></ruby><ruby>畦<rt>qí</rt></ruby><ruby>手<rt>shǒu</rt></ruby><ruby>自<rt>zì</rt></ruby><ruby>栽<rt>zāi</rt></ruby>。<br><ruby>一<rt>yī</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>护<rt>hù</rt></ruby><ruby>田<rt>tián</rt></ruby><ruby>将<rt>jiāng</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>绕<rt>rào</rt></ruby>，<br><ruby>两<rt>liǎng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>排<rt>pái</rt></ruby><ruby>闼<rt>tà</rt></ruby><ruby>送<rt>sòng</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>来<rt>lái</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🌞", "title": "长歌行", "author": "汉乐府", "full": "青青园中葵，\n朝露待日晞。\n阳春布德泽，\n万物生光辉。\n常恐秋节至，\n焜黄华叶衰。\n百川东到海，\n何时复西归？\n少壮不努力，\n老大徒伤悲。", "ann": "晞：晒干。布：散布。焜黄：枯黄。徒：白白地。", "err": "“葵”下面是“癸”；“晞”是“日”字旁。", "no": 67, "color": "#6f4a1f", "fullRuby": "<ruby>青<rt>qīng</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>园<rt>yuán</rt></ruby><ruby>中<rt>zhōng</rt></ruby><ruby>葵<rt>kuí</rt></ruby>，<br><ruby>朝<rt>zhāo</rt></ruby><ruby>露<rt>lù</rt></ruby><ruby>待<rt>dài</rt></ruby><ruby>日<rt>rì</rt></ruby><ruby>晞<rt>xī</rt></ruby>。<br><ruby>阳<rt>yáng</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>布<rt>bù</rt></ruby><ruby>德<rt>dé</rt></ruby><ruby>泽<rt>zé</rt></ruby>，<br><ruby>万<rt>wàn</rt></ruby><ruby>物<rt>wù</rt></ruby><ruby>生<rt>shēng</rt></ruby><ruby>光<rt>guāng</rt></ruby><ruby>辉<rt>huī</rt></ruby>。<br><ruby>常<rt>cháng</rt></ruby><ruby>恐<rt>kǒng</rt></ruby><ruby>秋<rt>qiū</rt></ruby><ruby>节<rt>jié</rt></ruby><ruby>至<rt>zhì</rt></ruby>，<br><ruby>焜<rt>kūn</rt></ruby><ruby>黄<rt>huáng</rt></ruby><ruby>华<rt>huā</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>衰<rt>shuāi</rt></ruby>。<br><ruby>百<rt>bǎi</rt></ruby><ruby>川<rt>chuān</rt></ruby><ruby>东<rt>dōng</rt></ruby><ruby>到<rt>dào</rt></ruby><ruby>海<rt>hǎi</rt></ruby>，<br><ruby>何<rt>hé</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>复<rt>fù</rt></ruby><ruby>西<rt>xī</rt></ruby><ruby>归<rt>guī</rt></ruby>？<br><ruby>少<rt>shào</rt></ruby><ruby>壮<rt>zhuàng</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>努<rt>nǔ</rt></ruby><ruby>力<rt>lì</rt></ruby>，<br><ruby>老<rt>lǎo</rt></ruby><ruby>大<rt>dà</rt></ruby><ruby>徒<rt>tú</rt></ruby><ruby>伤<rt>shāng</rt></ruby><ruby>悲<rt>bēi</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🥂", "title": "送元二使安西", "author": "唐·王维", "full": "渭城朝雨浥轻尘，\n客舍青青柳色新。\n劝君更尽一杯酒，\n西出阳关无故人。", "ann": "使：出使。浥：湿润。阳关：地名。", "err": "“浥”右边是“邑”；“柳”右边是“卯”。", "no": 68, "color": "#6f4a1f", "fullRuby": "<ruby>渭<rt>wèi</rt></ruby><ruby>城<rt>chéng</rt></ruby><ruby>朝<rt>zhāo</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>浥<rt>yì</rt></ruby><ruby>轻<rt>qīng</rt></ruby><ruby>尘<rt>chén</rt></ruby>，<br><ruby>客<rt>kè</rt></ruby><ruby>舍<rt>shè</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>青<rt>qīng</rt></ruby><ruby>柳<rt>liǔ</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>新<rt>xīn</rt></ruby>。<br><ruby>劝<rt>quàn</rt></ruby><ruby>君<rt>jūn</rt></ruby><ruby>更<rt>gèng</rt></ruby><ruby>尽<rt>jǐn</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>杯<rt>bēi</rt></ruby><ruby>酒<rt>jiǔ</rt></ruby>，<br><ruby>西<rt>xī</rt></ruby><ruby>出<rt>chū</rt></ruby><ruby>阳<rt>yáng</rt></ruby><ruby>关<rt>guān</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>故<rt>gù</rt></ruby><ruby>人<rt>rén</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🌧️", "title": "春夜喜雨", "author": "唐·杜甫", "full": "好雨知时节，\n当春乃发生。\n随风潜入夜，\n润物细无声。\n野径云俱黑，\n江船火独明。\n晓看红湿处，\n花重锦官城。", "ann": "乃：就。潜：暗暗地。锦官城：成都的别称。", "err": "“潜”右边是“替”；“俱”右边三横。", "no": 69, "color": "#6f4a1f", "fullRuby": "<ruby>好<rt>hǎo</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>知<rt>zhī</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>节<rt>jié</rt></ruby>，<br><ruby>当<rt>dāng</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>乃<rt>nǎi</rt></ruby><ruby>发<rt>fā</rt></ruby><ruby>生<rt>shēng</rt></ruby>。<br><ruby>随<rt>suí</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>潜<rt>qián</rt></ruby><ruby>入<rt>rù</rt></ruby><ruby>夜<rt>yè</rt></ruby>，<br><ruby>润<rt>rùn</rt></ruby><ruby>物<rt>wù</rt></ruby><ruby>细<rt>xì</rt></ruby><ruby>无<rt>wú</rt></ruby><ruby>声<rt>shēng</rt></ruby>。<br><ruby>野<rt>yě</rt></ruby><ruby>径<rt>jìng</rt></ruby><ruby>云<rt>yún</rt></ruby><ruby>俱<rt>jù</rt></ruby><ruby>黑<rt>hēi</rt></ruby>，<br><ruby>江<rt>jiāng</rt></ruby><ruby>船<rt>chuán</rt></ruby><ruby>火<rt>huǒ</rt></ruby><ruby>独<rt>dú</rt></ruby><ruby>明<rt>míng</rt></ruby>。<br><ruby>晓<rt>xiǎo</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>红<rt>hóng</rt></ruby><ruby>湿<rt>shī</rt></ruby><ruby>处<rt>chù</rt></ruby>，<br><ruby>花<rt>huā</rt></ruby><ruby>重<rt>zhòng</rt></ruby><ruby>锦<rt>jǐn</rt></ruby><ruby>官<rt>guān</rt></ruby><ruby>城<rt>chéng</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🌱", "title": "早春呈水部张十八员外", "author": "唐·韩愈", "full": "天街小雨润如酥，\n草色遥看近却无。\n最是一年春好处，\n绝胜烟柳满皇都。", "ann": "天街：京城的大街。酥：酥油，形容春雨润泽。", "err": "“酥”右边是“禾”；“胜”右边是“生”。", "no": 70, "color": "#6f4a1f", "fullRuby": "<ruby>天<rt>tiān</rt></ruby><ruby>街<rt>jiē</rt></ruby><ruby>小<rt>xiǎo</rt></ruby><ruby>雨<rt>yǔ</rt></ruby><ruby>润<rt>rùn</rt></ruby><ruby>如<rt>rú</rt></ruby><ruby>酥<rt>sū</rt></ruby>，<br><ruby>草<rt>cǎo</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>遥<rt>yáo</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>近<rt>jìn</rt></ruby><ruby>却<rt>què</rt></ruby><ruby>无<rt>wú</rt></ruby>。<br><ruby>最<rt>zuì</rt></ruby><ruby>是<rt>shì</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>年<rt>nián</rt></ruby><ruby>春<rt>chūn</rt></ruby><ruby>好<rt>hǎo</rt></ruby><ruby>处<rt>chù</rt></ruby>，<br><ruby>绝<rt>jué</rt></ruby><ruby>胜<rt>shèng</rt></ruby><ruby>烟<rt>yān</rt></ruby><ruby>柳<rt>liǔ</rt></ruby><ruby>满<rt>mǎn</rt></ruby><ruby>皇<rt>huáng</rt></ruby><ruby>都<rt>dū</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🚣", "title": "江上渔者", "author": "宋·范仲淹", "full": "江上往来人，\n但爱鲈鱼美。\n君看一叶舟，\n出没风波里。", "ann": "但：只。鲈鱼：一种味美的鱼。", "err": "“鲈”是“鱼”字旁；“没”右边是“殳”。", "no": 71, "color": "#6f4a1f", "fullRuby": "<ruby>江<rt>jiāng</rt></ruby><ruby>上<rt>shàng</rt></ruby><ruby>往<rt>wǎng</rt></ruby><ruby>来<rt>lái</rt></ruby><ruby>人<rt>rén</rt></ruby>，<br><ruby>但<rt>dàn</rt></ruby><ruby>爱<rt>ài</rt></ruby><ruby>鲈<rt>lú</rt></ruby><ruby>鱼<rt>yú</rt></ruby><ruby>美<rt>měi</rt></ruby>。<br><ruby>君<rt>jūn</rt></ruby><ruby>看<rt>kàn</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>叶<rt>yè</rt></ruby><ruby>舟<rt>zhōu</rt></ruby>，<br><ruby>出<rt>chū</rt></ruby><ruby>没<rt>mò</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>波<rt>bō</rt></ruby><ruby>里<rt>lǐ</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "🌉", "title": "泊船瓜洲", "author": "宋·王安石", "full": "京口瓜洲一水间，\n钟山只隔数重山。\n春风又绿江南岸，\n明月何时照我还。", "ann": "间：隔开。钟山：南京紫金山。还：回家乡。", "err": "“洲”右边是“州”；“隔”右下是“鬲”。", "no": 72, "color": "#6f4a1f", "fullRuby": "<ruby>京<rt>jīng</rt></ruby><ruby>口<rt>kǒu</rt></ruby><ruby>瓜<rt>guā</rt></ruby><ruby>洲<rt>zhōu</rt></ruby><ruby>一<rt>yī</rt></ruby><ruby>水<rt>shuǐ</rt></ruby><ruby>间<rt>jiān</rt></ruby>，<br><ruby>钟<rt>zhōng</rt></ruby><ruby>山<rt>shān</rt></ruby><ruby>只<rt>zhǐ</rt></ruby><ruby>隔<rt>gé</rt></ruby><ruby>数<rt>shù</rt></ruby><ruby>重<rt>chóng</rt></ruby><ruby>山<rt>shān</rt></ruby>。<br><ruby>春<rt>chūn</rt></ruby><ruby>风<rt>fēng</rt></ruby><ruby>又<rt>yòu</rt></ruby><ruby>绿<rt>lǜ</rt></ruby><ruby>江<rt>jiāng</rt></ruby><ruby>南<rt>nán</rt></ruby><ruby>岸<rt>àn</rt></ruby>，<br><ruby>明<rt>míng</rt></ruby><ruby>月<rt>yuè</rt></ruby><ruby>何<rt>hé</rt></ruby><ruby>时<rt>shí</rt></ruby><ruby>照<rt>zhào</rt></ruby><ruby>我<rt>wǒ</rt></ruby><ruby>还<rt>huán</rt></ruby>。"}, {"grade": "六年级下册", "emoji": "💮", "title": "游园不值", "author": "宋·叶绍翁", "full": "应怜屐齿印苍苔，\n小扣柴扉久不开。\n春色满园关不住，\n一枝红杏出墙来。", "ann": "不值：没遇到主人。屐：木底鞋。小扣：轻敲。", "err": "“屐”右边是“支”；“扉”下面是“非”。", "no": 73, "color": "#6f4a1f", "fullRuby": "<ruby>应<rt>yīng</rt></ruby><ruby>怜<rt>lián</rt></ruby><ruby>屐<rt>jī</rt></ruby><ruby>齿<rt>chǐ</rt></ruby><ruby>印<rt>yìn</rt></ruby><ruby>苍<rt>cāng</rt></ruby><ruby>苔<rt>tái</rt></ruby>，<br><ruby>小<rt>xiǎo</rt></ruby><ruby>扣<rt>kòu</rt></ruby><ruby>柴<rt>chái</rt></ruby><ruby>扉<rt>fēi</rt></ruby><ruby>久<rt>jiǔ</rt></ruby><ruby>不<rt>bù</rt></ruby><ruby>开<rt>kāi</rt></ruby>。<br><ruby>春<rt>chūn</rt></ruby><ruby>色<rt>sè</rt></ruby><ruby>满<rt>mǎn</rt></rub function computeStreak(days, today) {
  const set = new Set(days || []);
  let d = new Date(today || Date.now());
  if (!set.has(fmt(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function normPlain(s) {
  return String(s || "").replace(/[，。；、？！?？：:""''《》〈〉·—…\s＿_]/g, "");
}
function normNoParen(s) {
  return normPlain(String(s || "").replace(/[（(][^）)]*[)）]/g, ""));
}
function normParenChars(s) {
  return normPlain(String(s || "").replace(/[（）()]/g, ""));
}
function splitBlanks(q) {
  return String(q || "").split(/＿+/);
}
function fillMatch(input, accepted) {
  const variants = [normPlain(input), normNoParen(input), normParenChars(input)];
  return (accepted || []).some(function (a) {
    return variants.indexOf(normPlain(a)) >= 0
      || variants.indexOf(normNoParen(a)) >= 0
      || variants.indexOf(normParenChars(a)) >= 0;
  });
}
let fillList = [], fillIdx = 0, fillScore = 0, fillParts = [], fillAccepted = [];
function itQ(it) { return it.q !== undefined ? it.q : it.notes; }
function itAns(it) { return it.a !== undefined ? it.a : it.ans; }
function itSrc(it) { return it.t !== undefined ? it.t : (it.year ? it.year + " " + it.paper : (it.title || "")); }
function itNote(it) { return it.n || ""; }
function startFill() {
  fillList = shuffle(FILL).slice(0, 10);

}
function showFill() {
  const item = fillList[fillIdx];
  const q = itQ(item);
  fillAccepted = Array.isArray(itAns(item)) ? itAns(item) : [itAns(item)];
  const segs = splitBlanks(q);
  const blanks = segs.length - 1;
  fillParts = [];
  fillPerBlank = false;
  if (blanks > 0 && fillAccepted.length === 1) {
    const cand = String(fillAccepted[0]).split(/[，,；;。.？！?！]/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (cand.length === blanks) { fillPerBlank = true; fillParts = cand; }
  }
  let html = "<div class='progbar'><i style='width:" + Math.round((fillIdx + 1) / fillList.length * 100) + "%'></i></div>";
  html += "<div class='qhead'><span class='prog'>第 " + (fillIdx + 1) + " / " + fillList.length + " 题 · 已对 " + fillScore + " 题</span><button class='close' onclick='closeFill()'>✕</button></div>";
  html += "<div class='bcz-card'>";
  if (fillPerBlank) {
    segs.forEach(function (s, i) { html += s; if (i < segs.length - 1) html += "<input class='fill-in' id='f" + i + "' placeholder='填写' autocomplete='off'>"; });
  } else {
    html += String(q).replace(/＿+/g, "<input class='fill-in fill-wide' id='f0' placeholder='整句填写' autocomplete='off'>");
  }
  html += "</div>";
  html += "<div class='fill-src'>" + itSrc(item) + "　" + itNote(item) + "</div>";
  html += "<div class='fill-ans' id='fillAns'></div>";
  html += "<button class='fill-check' id='fillCheck' onclick='checkFill()'>检查答案</button>";
  html += "<button class='next' style='display:none' id='fillNext' onclick='nextFill()'>下一题</button>";
  el("fillBox").innerHTML = html;
  const bcx = el("fillBox");
  bcx.style.animation = "none"; void bcx.offsetWidth; bcx.style.animation = "";
  const fi = document.querySelector("#fillBox .fill-in");
  if (fi) fi.focus();
  bcx.dataset.mode = "question";
  if (fi) {
    fi.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter") {
        ev.preventDefault();
        const ckB = el("fillCheck");
        if (ckB && ckB.style.display !== "none") checkFill(); else nextFill();
      }
    });
  }
  let tX0 = null;
  bcx.ontouchstart = function (e) { if (bcx.dataset.mode === "done") tX0 = e.touches[0].clientX; };
  bcx.ontouchend = function (e) {
    if (bcx.dataset.mode !== "done" || tX0 === null) { tX0 = null; return; }
    const dx = e.changedTouches[0].clientX - tX0;
    tX0 = null;
    if (Math.abs(dx) > 60) nextFill();
  };
}
function checkFill() {
  const item = fillList[fillIdx];
  let ok = true;
  if (fillPerBlank && fillParts.length > 0) {
    for (let i = 0; i < fillParts.length; i++) {
      const inp = el("f" + i);
      const good = fillMatch(inp.value, [fillParts[i]]);
      inp.classList.add(good ? "right" : "wrong");
      if (!good) ok = false;
    }
  } else {
    const inp = el("f0");
    const good = fillMatch(inp.value, fillAccepted);
    inp.classList.add(good ? "right" : "wrong");
    ok = good;
  }
  if (ok) fillScore++;
  const c = cur();
  c.prac += 1;
  if (ok) c.corr += 1;
  save(); render();
  const ansTxt = fillAccepted.join("<br>");
  el("fillAns").innerHTML = ok
    ? "<div class='ok'>✅ 太棒了！</div>"
    : "<div class='no'>❌ 参考答案：</div><div class='show-ans'>" + ansTxt + "</div>"
    + "<div class='swipe-hint'>👆 左右滑动卡片或点「下一题」</div>";
  el("fillBox").dataset.mode = "done";
  el("fillCheck").style.display = "none";
  const nxt = el("fillNext");
  nxt.style.display = "block";
  nxt.textContent = fillIdx === fillList.length - 1 ? "查看成绩" : "下一题";
}
function nextFill() {
  fillIdx++;
  if (fillIdx >= fillList.length) {
    const pct = Math.round(fillScore / fillList.length * 100);
    const emoji = pct === 100 ? "🏆" : (pct >= 60 ? "👏" : "💪");
    el("fillBox").innerHTML = "<div class='qhead'><span class='prog'>练习完成</span><button class='close' onclick='closeFill()'>✕</button></div>"
      + "<div class='score'>" + emoji + " 本次答对 " + fillScore + " / " + fillList.length + " 题（" + pct + "%）</div>"
      + "<button class='next' onclick='closeFill()'>完成</button>";
    return;
  }
  showFill();
}
/* 朗读功能：安卓原生 → 在线中文语音 → 系统语音，三级保障 */
function readPoem(no) {
  const p = POEMS[no - 1];
  if (!p) return;
  const text = "《" + p.title + "》，" + p.author + "。" + p.full.replace(/\n/g, "。");
  // 1) 安卓 App 内：原生中文朗读（最稳定）
  if (window.AndroidBridge && typeof window.AndroidBridge.speak === "function") {
    try {
      window.AndroidBridge.speak(text);
      flash("正在朗读《" + p.title + "》");
      setReadPlaying(no, true);
      setTimeout(function () { setReadPlaying(no, false); }, 5000);
      return;
    } catch (e) {}
  }
  // 2) 在线中文语音（手机/电脑浏览器通用，微信里也能播）
  if (playOnlineAudio(no, text)) return;
  // 3) 系统语音兜底（离线时）
  speakSystem(no, text);
}
function setReadPlaying(no, on) {
  const b = document.querySelector('.card[data-no="' + no + '"] .read-btn');
  if (b) b.classList.toggle("playing", !!on);
}
var readAudio = null;
function playOnlineAudio(no, text) {
  try {
    const url = "https://fanyi.baidu.com/gettts?lan=zh&text=" + encodeURIComponent(text) + "&spd=3&source=web";
    if (readAudio) { try { readAudio.pause(); } catch (e) {} readAudio = null; }
    const a = new Audio(url);
    readAudio = a;
    a.preload = "auto";
    a.onplaying = function () {
      setReadPlaying(no, true);
      flash("正在朗读《" + POEMS[no - 1].title + "》");
    };
    a.onended = function () { setReadPlaying(no, false); readAudio = null; };
    a.onerror = function () { setReadPlaying(no, false); readAudio = null; };
    const pr = a.play();
    if (pr && typeof pr.catch === "function") {
      pr.catch(function () {
        setReadPlaying(no, false);
        readAudio = null;
        speakSystem(no, text);
      });
    }
    return true;
  } catch (e) { return false; }
}
function speakSystem(no, text) {
  if (!("speechSynthesis" in window)) { flash("当前设备不支持朗读"); return; }
  try { speechSynthesis.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 0.88;
  u.onstart = function () { setReadPlaying(no, true); };
  u.onend = u.onerror = function () { setReadPlaying(no, false); };
  try {
    const vs = speechSynthesis.getVoices();
    const v = vs.find(function (x) { return /^zh[-_]CN/i.test(x.lang); })
      || vs.find(function (x) { return /^zh/i.test(x.lang); });
    if (v) u.voice = v;
  } catch (e) {}
  speechSynthesis.speak(u);
  flash("正在朗读《" + POEMS[no - 1].title + "》");
}

/* 打开「带记录的版本」时自动恢复本地记忆 */
function importEmbedded() {
  if (!window.__EMBEDDED__) return false;
  try {
    const o = JSON.parse(JSON.stringify(window.__EMBEDDED__));
    if (!o || !o.children) return false;
    let hasLocal = false;
    try { hasLocal = !!localStorage.getItem(LS_KEY); } catch (e) { hasLocal = false; }
    if (!hasLocal) {
      state = Object.assign(defaultState(), migrate(o));
      save();
      flash("已从文件恢复全部记录");
      return true;
    }
    flash("检测到文件内记录，本机已有记录，未覆盖");
    return false;
  } catch (e) { return false; }
}

/* 生成一个自带全部记录的应用文件（本地记忆随文件走） */
function downloadWithRecords() {
  const marker = "window.__EMBEDDED__ = null;";
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const stateJson = JSON.stringify(state).replace(/<\//g, "<\/");
  const src = html.replace(marker, "window.__EMBEDDED__ = " + stateJson + ";");
  const blob = new Blob([src], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "古诗背诵打卡-带记录-" + todayStr() + ".html";
  
  if (window.AndroidBridge) { AndroidBridge.saveText(a.download, src, "text/html;charset=utf-8"); return; }
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  flash("已生成带记录的文件，请保存好");
}

function copyBackup() {
  const txt = JSON.stringify(state);
  function done() { flash("备份内容已复制"); }
  function fallbackCopy() {
    const ta = el("importArea");
    ta.value = txt; ta.select();
    document.execCommand("copy");
    done();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done, fallbackCopy);
  } else fallbackCopy();
}
function importFromText() {
  const txt = el("importArea").value.trim();
  if (!txt) { flash("请先粘贴备份内容"); return; }
  try {
    const o = JSON.parse(txt);
    state = Object.assign(defaultState(), migrate(o));
    if (!state.children || Object.keys(state.children).length === 0) state = defaultState();
    save(); render();
    flash("备份已恢复");
  } catch (e) { flash("内容格式不对"); }
}
function importFile(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function () { el("importArea").value = r.result; importFromText(); };
  r.readAsText(f);
}
