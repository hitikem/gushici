      /* ===== MD3 THEME ===== */
  :root{
    --bg:#FAF8F3; --card:#FFFFFF; --primary:#2F5D50; --secondary:#6E9F8D; --accent:#D6A84F;
    --ink:#2A2A28; --ink2:#6B6B66; --line:#EAE4D9;
    --r-card:24px; --r-btn:999px; --r-input:14px;
    --shadow:0 10px 30px -14px rgba(47,93,80,.18);
    --shadow-hover:0 20px 46px -20px rgba(47,93,80,.30);
    --font-title:"STKaiti","KaiTi","Songti SC","SimSun",serif;
    --font-body:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",sans-serif;
    --t:.22s;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181D1B; --card:#212825; --primary:#7FB3A0; --secondary:#6E9F8D; --accent:#E0B45C;
      --ink:#ECEAE3; --ink2:#A6B1AB; --line:#343E39;
      --shadow:0 12px 34px -14px rgba(0,0,0,.55);
      --shadow-hover:0 22px 50px -20px rgba(0,0,0,.7);
    }
  }
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);overflow-x:hidden;}
  .glowbg{display:none!important;}
  .ic-svg{width:1em;height:1em;vertical-align:-.12em;display:inline-block;}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}
  header{padding:26px 0 10px;}
  header h1{font-family:var(--font-title);color:var(--primary);font-size:1.55rem;letter-spacing:2px;font-weight:700;line-height:1.4;}
  header .sub{color:var(--ink2);font-size:.9rem;}
  .wm{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 14px;color:var(--primary);box-shadow:var(--shadow);font-size:.76rem;}
  .hint{color:var(--ink2);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 13px;box-shadow:var(--shadow);font-size:.78rem;}
  .save-state{color:var(--primary);font-size:.78rem;}
  .warn{background:#FDECEA;color:#A9442F;border:1px solid #F3C1BB;border-radius:14px;}
  .chips{flex-wrap:wrap;}
  .chip{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;font-weight:600;transition:transform var(--t),box-shadow var(--t),background var(--t),color var(--t);}
  .chip:active{transform:scale(.96);}
  .chip.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px -6px rgba(47,93,80,.5);}
  .chip.add{border-style:dashed;color:var(--primary);}
  .toolbar{flex-wrap:wrap;}
  .toolbar .tbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:14px;font-weight:600;box-shadow:var(--shadow);transition:transform var(--t),box-shadow var(--t);}
  .toolbar .tbtn:active{transform:scale(.97);}
  .toolbar .tbtn.go{background:linear-gradient(135deg,var(--primary),var(--secondary));color:#fff;border:none;box-shadow:0 10px 22px -10px rgba(47,93,80,.5);}
  .summary{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow);}
  .ring .num{color:var(--primary);font-family:var(--font-title);}
  .ring .num small{color:var(--ink2);}

const PIECES = [{"no": 1, "section": "初中必背古诗文", "color": "#c0392b", "title": "《观沧海》", "author": "东汉·曹操", "notes": "碣石（山名）；澹澹（水波摇荡）；竦峙（耸立）；星汉（银河）；幸甚至哉。", "errors": "碣石（勿错“竭”）；澹澹（勿作“谈谈”）；竦峙（“竦”勿少“立”）；丛生（非“从”）。江西高频：“日月之行，若出其中；星汉灿烂，若出其里”。", "exercises": [{"type": "原文挖空", "items": ["东临＿＿＿＿，以观沧海。水何澹澹，＿＿＿＿。树木丛生，百草丰茂。＿＿＿＿，洪波涌起。日月之行，＿＿＿＿；星汉灿烂，＿＿＿＿。"]}, {"type": "情景默写", "items": ["1. 曹操借想象表现大海吞吐日月星辰气概的句子：＿＿＿＿ 2. 描写秋风萧瑟中草木茂盛、海浪涌起的句子：＿＿＿＿"]}]}, {"no": 2, "section": "初中必背古诗文", "color": "#c0392b", "title": "《闻王昌龄左迁龙标遥有此寄》", "author": "唐·李白", "notes": "🔹左迁；杨花；子规；夜郎。", "errors": "杨花（非“扬”）；子规；夜郎。名句“我寄愁心与明月，随君直到夜郎西”。", "exercises": [{"type": "原文挖空", "items": ["＿＿＿＿落尽子规啼，闻道龙标过五溪。＿＿＿＿，随君直到夜郎西。"]}, {"type": "情景默写", "items": ["将明月人格化、表达对友人牵挂的句子：＿＿＿＿ 2. 点明暮春时节的句子：＿＿＿＿"]}]}, {"no": 3, "section": "初中必背古诗文", "color": "#c0392b", "title": "《次北固山下》", "author": "唐·王湾", "notes": "🔹次；客路；潮平两岸阔；海日生残夜；归雁。", "errors": "阔（勿“扩”）；生残夜（不是“升”）；入旧年；归雁（非“燕”）。名句“海日生残夜，江春入旧年”。", "exercises": [{"type": "原文挖空", "items": ["客路青山外，行舟绿水前。潮平两岸阔，＿＿＿＿。＿＿＿＿，江春入旧年。乡书何处达？＿＿＿＿。"]}, {"type": "情景默写", "items": ["蕴含新事物取代旧事物哲理的对偶句：＿＿＿＿ 2. 描绘江面开阔、风顺船稳的句子：＿＿＿＿"]}]}, {"no": 4, "section": "初中必背古诗文", "color": "#c0392b", "title": "《天净沙·秋思》", "author": "元·马致远", "notes": "🔹昏鸦；断肠人；天涯。", "errors": "枯藤（“藤”右下“水”）；昏鸦；瘦马。名句“夕阳西下，断肠人在天涯”。", "exercises": [{"type": "原文挖空", "items": ["枯藤老树昏鸦，＿＿＿＿，古道西风瘦马。夕阳西下，＿＿＿＿。"]}, {"type": "情景默写", "items": ["直抒游子凄楚之情的句子：＿＿＿＿ 2. 以乐景写哀情的句子：＿＿＿＿"]}]}, {"no": 5, "section": "初中必背古诗文", "color": "#c0392b", "title": "《峨眉山月歌》", "author": "唐·李白", "notes": "🔹半轮秋；平羌；清溪；渝州。", "errors": "🔴【易错】羌、渝。名句“峨眉山月半轮秋，影入平羌江水流”。", "exercises": [{"type": "原文挖空", "items": ["峨眉山月＿＿＿＿，影入平羌＿＿＿＿。夜发清溪向三峡，＿＿＿＿。"]}, {"type": "情景默写", "items": ["连用地名表达思念的句子：＿＿＿＿"]}]}, {"no": 6, "section": "初中必背古诗文", "color": "#c0392b", "title": "《江南逢李龟年》", "author": "唐·杜甫", "notes": "🔹岐王；崔九；落花时节。", "errors": "🔴【易错】岐（非“歧”）；宅。名句“正是江南好风景，落花时节又逢君”。", "exercises": [{"type": "原文挖空", "items": ["岐王宅里寻常见，＿＿＿＿。＿＿＿＿，落花时节又逢君。"]}, {"type": "情景默写", "items": ["表达世事无常、人生飘零的句子：＿＿＿＿"]}]}, {"no": 7, "section": "初中必背古诗文", "color": "#c0392b", "title": "《行军九日思长安故园》", "author": "唐·岑参", "notes": "🔹强欲登高；无人送酒；遥怜故园菊；傍战场开。", "errors": "🔴【易错】怜、傍。名句“遥怜故园菊，应傍战场开”。", "exercises": [{"type": "原文挖空", "items": ["强欲登高去，＿＿＿＿。遥怜故园菊，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对家乡菊花的思念及战乱忧虑：＿＿＿＿"]}]}, {"no": 8, "section": "初中必背古诗文", "color": "#c0392b", "title": "《夜上受降城闻笛》", "author": "唐·李益", "notes": "🔹回乐烽；沙似雪；芦管；征人。", "errors": "🔴【易错】烽（非“峰”）、芦管。名句“不知何处吹芦管，一夜征人尽望乡”。", "exercises": [{"type": "原文挖空", "items": ["回乐烽前沙似雪，＿＿＿＿。＿＿＿＿，一夜征人尽望乡。"]}, {"type": "情景默写", "items": ["笛声触发征人思乡的句子：＿＿＿＿"]}]}, {"no": 9, "section": "初中必背古诗文", "color": "#c0392b", "title": "《秋词（其一）》", "author": "唐·刘禹锡", "notes": "🔹自古逢秋悲寂寥；晴空一鹤排云上。", "errors": "🔴【易错】寂寥、排。名句“晴空一鹤排云上，便引诗情到碧霄”。", "exercises": [{"type": "原文挖空", "items": ["自古逢秋悲寂寥，＿＿＿＿。晴空一鹤排云上，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现诗人豪迈乐观的句子：＿＿＿＿"]}]}, {"no": 10, "section": "初中必背古诗文", "color": "#c0392b", "title": "《十一月四日风雨大作（其二）》", "author": "宋·陆游", "notes": "🔹僵卧孤村；尚思为国戍轮台；夜阑卧听风吹雨。", "errors": "🔴【易错】戍（与戌、戊区分）、阑。名句“夜阑卧听风吹雨，铁马冰河入梦来”。", "exercises": [{"type": "原文挖空", "items": ["僵卧孤村不自哀，＿＿＿＿。＿＿＿＿，铁马冰河入梦来。"]}, {"type": "情景默写", "items": ["表现诗人爱国情怀的句子：＿＿＿＿"]}]}, {"no": 11, "section": "初中必背古诗文", "color": "#c0392b", "title": "《潼关》", "author": "清·谭嗣同", "notes": "🔹终古高云簇此城；河流大野犹嫌束。", "errors": "🔴【易错】簇、嫌。名句“河流大野犹嫌束，山入潼关不解平”。", "exercises": [{"type": "原文挖空", "items": ["终古高云簇此城，＿＿＿＿。＿＿＿＿，山入潼关不解平。"]}, {"type": "情景默写", "items": ["表现黄河奔腾、山势险峻的句子：＿＿＿＿"]}]}, {"no": 12, "section": "初中必背古诗文", "color": "#c0392b", "title": "《木兰诗》", "author": "北朝民歌", "notes": "🔹唧唧；机杼；鞍马；辔头；戎机；朔气；金柝；策勋；出郭；红妆；著我旧时裳；帖花黄；傍地走。", "errors": "🔴【易错】辔、朔、柝（非“析”）、策勋、著（通“着”）、帖（通“贴”）。名句“万里赴戎机，关山度若飞”。", "exercises": [{"type": "原文挖空", "items": ["万里赴戎机，＿＿＿＿。朔气传金柝，＿＿＿＿。将军百战死，＿＿＿＿。"]}, {"type": "情景默写", "items": ["1. 描写边塞艰苦战斗生活的对偶句：＿＿＿＿ 2. 表现木兰战功卓著的句子：＿＿＿＿"]}]}, {"no": 13, "section": "初中必背古诗文", "color": "#c0392b", "title": "《登幽州台歌》", "author": "唐·陈子昂", "notes": "🔹古人；来者；悠悠；怆然；涕下。", "errors": "🔴【易错】怆然（非“沧”）、涕。名句“前不见古人，后不见来者”。", "exercises": [{"type": "原文挖空", "items": ["前不见古人，＿＿＿＿。念天地之悠悠，＿＿＿＿！"]}, {"type": "情景默写", "items": ["抒发怀才不遇、孤寂悲愤的句子：＿＿＿＿"]}]}, {"no": 14, "section": "初中必背古诗文", "color": "#c0392b", "title": "《望岳》", "author": "唐·杜甫", "notes": "🔹岱宗；齐鲁青未了；造化；决眦；会当凌绝顶。", "errors": "🔴【易错】眦、凌（非“临”）。名句“会当凌绝顶，一览众山小”。", "exercises": [{"type": "原文挖空", "items": ["岱宗夫如何？＿＿＿＿。造化钟神秀，＿＿＿＿。荡胸生曾云，＿＿＿＿。会当凌绝顶，＿＿＿＿。"]}, {"type": "情景默写", "items": ["1. 表现诗人不怕困难、俯视一切的雄心：＿＿＿＿ 2. 写泰山神奇秀丽的句子：＿＿＿＿"]}]}, {"no": 15, "section": "初中必背古诗文", "color": "#c0392b", "title": "《游山西村》", "author": "宋·陆游", "notes": "🔹腊酒；足鸡豚；山重水复；柳暗花明；箫鼓；春社；闲乘月。", "errors": "🔴【易错】豚、箫（非“萧”）、社。名句“山重水复疑无路，柳暗花明又一村”。", "exercises": [{"type": "原文挖空", "items": ["莫笑农家腊酒浑，＿＿＿＿。山重水复疑无路，＿＿＿＿。＿＿＿＿，衣冠简朴古风存。"]}, {"type": "情景默写", "items": ["蕴含困境中蕴含希望哲理的句子：＿＿＿＿"]}]}, {"no": 16, "section": "初中必背古诗文", "color": "#c0392b", "title": "《己亥杂诗（其五）》", "author": "清·龚自珍", "notes": "🔹浩荡离愁；吟鞭；落红；春泥。", "errors": "🔴【易错】吟、落红。名句“落红不是无情物，化作春泥更护花”。", "exercises": [{"type": "原文挖空", "items": ["浩荡离愁白日斜，＿＿＿＿。落红不是无情物，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达辞官后仍关心国家命运的句子：＿＿＿＿"]}]}, {"no": 17, "section": "初中必背古诗文", "color": "#c0392b", "title": "《登飞来峰》", "author": "宋·王安石", "notes": "🔹千寻塔；闻说鸡鸣见日升；不畏浮云遮望眼；自缘身在最高层。", "errors": "🔴【易错】遮、缘（非“原”）。名句“不畏浮云遮望眼，自缘身在最高层”。", "exercises": [{"type": "原文挖空", "items": ["飞来山上千寻塔，＿＿＿＿。不畏浮云遮望眼，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现诗人远大政治抱负的句子：＿＿＿＿"]}]}, {"no": 18, "section": "初中必背古诗文", "color": "#c0392b", "title": "《竹里馆》", "author": "唐·王维", "notes": "🔹幽篁；长啸；深林人不知，明月来相照。", "errors": "🔴【易错】篁、啸。", "exercises": [{"type": "原文挖空", "items": ["独坐幽篁里，＿＿＿＿。深林人不知，＿＿＿＿。"]}, {"type": "情景默写", "items": ["明月相伴、淡泊宁静的句子：＿＿＿＿"]}]}, {"no": 19, "section": "初中必背古诗文", "color": "#c0392b", "title": "《春夜洛城闻笛》", "author": "唐·李白", "notes": "🔹折柳；故园情。", "errors": "🔴【易错】折柳、园。名句“此夜曲中闻折柳，何人不起故园情”。", "exercises": [{"type": "原文挖空", "items": ["谁家玉笛暗飞声，＿＿＿＿。＿＿＿＿，何人不起故园情。"]}, {"type": "情景默写", "items": ["表达思乡之情的句子：＿＿＿＿"]}]}, {"no": 20, "section": "初中必背古诗文", "color": "#c0392b", "title": "《逢入京使》", "author": "唐·岑参", "notes": "🔹龙钟；凭君传语报平安。", "errors": "🔴【易错】凭。名句“马上相逢无纸笔，凭君传语报平安”。", "exercises": [{"type": "原文挖空", "items": ["故园东望路漫漫，＿＿＿＿。马上相逢无纸笔，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达报平安的句子：＿＿＿＿"]}]}, {"no": 21, "section": "初中必背古诗文", "color": "#c0392b", "title": "《晚春》", "author": "唐·韩愈", "notes": "🔹杨花榆荚无才思，惟解漫天作雪飞。", "errors": "🔴【易错】荚、惟。", "exercises": [{"type": "原文挖空", "items": ["草树知春不久归，＿＿＿＿。杨花榆荚无才思，＿＿＿＿。"]}, {"type": "情景默写", "items": ["拟人手法写晚春景象的句子：＿＿＿＿"]}]}, {"no": 22, "section": "初中必背古诗文", "color": "#c0392b", "title": "《泊秦淮》", "author": "唐·杜牧", "notes": "🔹烟笼寒水月笼沙；商女；后庭花。", "errors": "🔴【易错】笼、庭。名句“商女不知亡国恨，隔江犹唱后庭花”。", "exercises": [{"type": "原文挖空", "items": ["烟笼寒水月笼沙，＿＿＿＿。商女不知亡国恨，＿＿＿＿。"]}, {"type": "情景默写", "items": ["借古讽今表达忧国之情的句子：＿＿＿＿"]}]}, {"no": 23, "section": "初中必背古诗文", "color": "#c0392b", "title": "《贾生》", "author": "唐·李商隐", "notes": "🔹宣室求贤访逐臣；贾生才调更无伦；不问苍生问鬼神。", "errors": "🔴【易错】伦、苍。", "exercises": [{"type": "原文挖空", "items": ["宣室求贤访逐臣，＿＿＿＿。＿＿＿＿，不问苍生问鬼神。"]}, {"type": "情景默写", "items": ["讽刺统治者不顾民生的句子：＿＿＿＿"]}]}, {"no": 24, "section": "初中必背古诗文", "color": "#c0392b", "title": "《过松源晨炊漆公店》", "author": "宋·杨万里", "notes": "🔹莫言下岭便无难；政入万山围子里。", "errors": "🔴【易错】政（通“正”）、拦。", "exercises": [{"type": "原文挖空", "items": ["莫言下岭便无难，＿＿＿＿。＿＿＿＿，一山放出一山拦。"]}, {"type": "情景默写", "items": ["借下山说明不能松懈的句子：＿＿＿＿"]}]}, {"no": 25, "section": "初中必背古诗文", "color": "#c0392b", "title": "《约客》", "author": "宋·赵师秀", "notes": "🔹黄梅时节家家雨；闲敲棋子落灯花。", "errors": "🔴【易错】蛙、敲。", "exercises": [{"type": "原文挖空", "items": ["黄梅时节家家雨，＿＿＿＿。有约不来过夜半，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现等待客人寂寞心情的句子：＿＿＿＿"]}]}, {"no": 26, "section": "初中必背古诗文", "color": "#c0392b", "title": "《论语》十二章", "author": "", "notes": "🔹说（通“悦”）；愠；三省；忠信；不惑；天命；耳顺；逾矩；罔；殆；箪；陋巷；肱；疏食；三人行；川上；逝者如斯夫；匹夫不可夺志；博学笃志。", "errors": "🔴【易错】说、愠、罔、殆、肱、笃。高频：“学而不思则罔，思而不学则殆”“三军可夺帅也，匹夫不可夺志也”。", "exercises": [{"type": "原文挖空", "items": ["学而不思则罔，＿＿＿＿。择其善者而从之，＿＿＿＿。三军可夺帅也，＿＿＿＿。"]}, {"type": "情景默写", "items": ["1. 阐述学思辩证关系的句子：＿＿＿＿ 2. 表达即使普通人也有坚定志向的句子：＿＿＿＿"]}]}, {"no": 27, "section": "初中必背古诗文", "color": "#c0392b", "title": "《诫子书》", "author": "三国·诸葛亮", "notes": "🔹静以修身；淡泊明志；宁静致远；淫慢；励精；险躁；治性。", "errors": "🔴【易错】淫慢、躁（非“燥”）、励精。名句“非淡泊无以明志，非宁静无以致远”。", "exercises": [{"type": "原文挖空", "items": ["夫君子之行，＿＿＿＿，俭以养德。＿＿＿＿，非宁静无以致远。"]}, {"type": "情景默写", "items": ["强调内心恬淡、宁静专一的句子：＿＿＿＿"]}]}, {"no": 28, "section": "初中必背古诗文", "color": "#c0392b", "title": "《孙权劝学》", "author": "宋·司马光", "notes": "🔹当涂掌事；辞以军中多务；治经为博士邪；但当涉猎；见往事耳；刮目相待。", "errors": "🔴【易错】邪（通“耶”）、涉猎、刮目。名句“士别三日，即更刮目相待”。", "exercises": [{"type": "原文挖空", "items": ["士别三日，＿＿＿＿，大兄何见事之晚乎！"]}, {"type": "情景默写", "items": ["吕蒙的变化让人刮目相待的句子：＿＿＿＿"]}]}, {"no": 29, "section": "初中必背古诗文", "color": "#c0392b", "title": "《陋室铭》", "author": "唐·刘禹锡", "notes": "🔹惟吾德馨；苔痕上阶绿；鸿儒；调素琴；金经；丝竹；案牍劳形。", "errors": "🔴【易错】馨、儒、牍。名句“斯是陋室，惟吾德馨”“苔痕上阶绿，草色入帘青”。", "exercises": [{"type": "原文挖空", "items": ["山不在高，＿＿＿＿。斯是陋室，＿＿＿＿。苔痕上阶绿，＿＿＿＿。"]}, {"type": "情景默写", "items": ["写陋室环境清幽的对偶句：＿＿＿＿"]}]}, {"no": 30, "section": "初中必背古诗文", "color": "#c0392b", "title": "《爱莲说》", "author": "宋·周敦颐", "notes": "🔹出淤泥而不染；濯清涟而不妖；中通外直；不蔓不枝；香远益清；亭亭净植；亵玩。", "errors": "🔴【易错】淤、濯、涟、亵。名句“出淤泥而不染，濯清涟而不妖”。", "exercises": [{"type": "原文挖空", "items": ["予独爱莲之＿＿＿＿，濯清涟而不妖。"]}, {"type": "情景默写", "items": ["写莲高洁质朴的句子：＿＿＿＿"]}]}, {"no": 31, "section": "初中必背古诗文", "color": "#c0392b", "title": "《河中石兽》", "author": "清·纪昀", "notes": "🔹圮；棹；铁钯；木杮；湮；啮沙；臆断。", "errors": "🔴【易错】圮、杮（非“柿”）、湮、臆断。名句“然则天下之事，但知其一，不知其二者多矣，可据理臆断欤”。", "exercises": [{"type": "原文挖空", "items": ["然则天下之事，＿＿＿＿，不知其二者多矣，＿＿＿＿？"]}, {"type": "情景默写", "items": ["揭示不能片面判断的句子：＿＿＿＿"]}]}, {"no": 32, "section": "初中必背古诗文", "color": "#c0392b", "title": "《野望》", "author": "唐·王绩", "notes": "🔹东皋；徙倚；树树皆秋色；牧人驱犊返；相顾无相识，长歌怀采薇。", "errors": "🔴【易错】皋、犊、薇。名句“树树皆秋色，山山唯落晖”。", "exercises": [{"type": "原文挖空", "items": ["东皋薄暮望，＿＿＿＿。树树皆秋色，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描写秋天山野景色的对偶句：＿＿＿＿"]}]}, {"no": 33, "section": "初中必背古诗文", "color": "#c0392b", "title": "《黄鹤楼》", "author": "唐·崔颢", "notes": "🔹昔人已乘黄鹤去；白云千载空悠悠；晴川历历汉阳树；芳草萋萋鹦鹉洲。", "errors": "🔴【易错】萋、鹦鹉、洲。名句“晴川历历汉阳树，芳草萋萋鹦鹉洲”。", "exercises": [{"type": "原文挖空", "items": ["昔人已乘黄鹤去，＿＿＿＿。晴川历历汉阳树，＿＿＿＿。"]}, {"type": "情景默写", "items": ["登楼远眺引发乡愁的句子：＿＿＿＿"]}]}, {"no": 34, "section": "初中必背古诗文", "color": "#c0392b", "title": "《使至塞上》", "author": "唐·王维", "notes": "🔹征蓬；汉塞；归雁；大漠孤烟直，长河落日圆。", "errors": "🔴【易错】蓬、圆、候骑。名句“大漠孤烟直，长河落日圆”。", "exercises": [{"type": "原文挖空", "items": ["征蓬出汉塞，＿＿＿＿。大漠孤烟直，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描绘塞外奇特壮丽风光的句子：＿＿＿＿"]}]}, {"no": 35, "section": "初中必背古诗文", "color": "#c0392b", "title": "《渡荆门送别》", "author": "唐·李白", "notes": "🔹山随平野尽；月下飞天镜；云生结海楼；仍怜故乡水。", "errors": "🔴【易错】荆、镜。名句“山随平野尽，江入大荒流”。", "exercises": [{"type": "原文挖空", "items": ["山随平野尽，＿＿＿＿。月下飞天镜，＿＿＿＿。"]}, {"type": "情景默写", "items": ["写船入开阔平原的句子：＿＿＿＿"]}]}, {"no": 36, "section": "初中必背古诗文", "color": "#c0392b", "title": "《钱塘湖春行》", "author": "唐·白居易", "notes": "🔹早莺争暖树；新燕啄春泥；乱花渐欲迷人眼；浅草才能没马蹄。", "errors": "🔴【易错】啄、没。名句“几处早莺争暖树，谁家新燕啄春泥”。", "exercises": [{"type": "原文挖空", "items": ["几处早莺争暖树，＿＿＿＿。乱花渐欲迷人眼，＿＿＿＿。"]}, {"type": "情景默写", "items": ["早春生机勃勃的画面：＿＿＿＿"]}]}, {"no": 37, "section": "初中必背古诗文", "color": "#c0392b", "title": "《庭中有奇树》", "author": "《古诗十九首》", "notes": "🔹庭中有奇树；攀条折其荣；馨香盈怀袖。", "errors": "🔴【易错】攀、馨。", "exercises": [{"type": "原文挖空", "items": ["庭中有奇树，＿＿＿＿。攀条折其荣，＿＿＿＿。"]}, {"type": "情景默写", "items": ["借折花表达思念的句子：＿＿＿＿"]}]}, {"no": 38, "section": "初中必背古诗文", "color": "#c0392b", "title": "《龟虽寿》", "author": "东汉·曹操", "notes": "🔹老骥伏枥，志在千里；烈士暮年，壮心不已。", "errors": "🔴【易错】骥、枥、暮。", "exercises": [{"type": "原文挖空", "items": ["老骥伏枥，＿＿＿＿；烈士暮年，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现老当益壮豪情的句子：＿＿＿＿"]}]}, {"no": 39, "section": "初中必背古诗文", "color": "#c0392b", "title": "《赠从弟（其二）》", "author": "东汉·刘桢", "notes": "🔹亭亭山上松；风声一何盛，松枝一何劲；岂不罹凝寒？松柏有本性。", "errors": "🔴【易错】罹、凝。", "exercises": [{"type": "原文挖空", "items": ["风声一何盛，＿＿＿＿！＿＿＿＿？松柏有本性。"]}, {"type": "情景默写", "items": ["借松柏喻人坚贞的句子：＿＿＿＿"]}]}, {"no": 40, "section": "初中必背古诗文", "color": "#c0392b", "title": "《梁甫行》", "author": "三国·曹植", "notes": "🔹八方各异气；剧哉边海民；妻子象禽兽，行止依林阻。", "errors": "🔴【易错】剧、阻。", "exercises": [{"type": "原文挖空", "items": ["八方各异气，＿＿＿＿。妻子象禽兽，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描写海边百姓困苦的句子：＿＿＿＿"]}]}, {"no": 41, "section": "初中必背古诗文", "color": "#c0392b", "title": "《饮酒（其五）》", "author": "晋·陶渊明", "notes": "🔹结庐在人境；心远地自偏；采菊东篱下，悠然见南山；山气日夕佳。", "errors": "🔴【易错】偏、篱、悠。名句“采菊东篱下，悠然见南山”。", "exercises": [{"type": "原文挖空", "items": ["采菊东篱下，＿＿＿＿。山气日夕佳，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现隐居生活闲适的句子：＿＿＿＿"]}]}, {"no": 42, "section": "初中必背古诗文", "color": "#c0392b", "title": "《春望》", "author": "唐·杜甫", "notes": "🔹感时花溅泪；烽火连三月，家书抵万金；浑欲不胜簪。", "errors": "🔴【易错】溅、搔、簪。名句“烽火连三月，家书抵万金”。", "exercises": [{"type": "原文挖空", "items": ["感时花溅泪，＿＿＿＿。烽火连三月，＿＿＿＿。"]}, {"type": "情景默写", "items": ["写战乱中思念亲人的句子：＿＿＿＿"]}]}, {"no": 43, "section": "初中必背古诗文", "color": "#c0392b", "title": "《雁门太守行》", "author": "唐·李贺", "notes": "🔹黑云压城；甲光向日金鳞开；角声满天秋色里；提携玉龙为君死。", "errors": "🔴【易错】鳞、携。名句“黑云压城城欲摧，甲光向日金鳞开”。", "exercises": [{"type": "原文挖空", "items": ["黑云压城城欲摧，＿＿＿＿。角声满天秋色里，＿＿＿＿。"]}, {"type": "情景默写", "items": ["渲染敌军兵临城下紧张气氛的句子：＿＿＿＿"]}]}, {"no": 44, "section": "初中必背古诗文", "color": "#c0392b", "title": "《赤壁》", "author": "唐·杜牧", "notes": "🔹折戟沉沙铁未销；东风不与周郎便，铜雀春深锁二乔。", "errors": "🔴【易错】戟、郎。", "exercises": [{"type": "原文挖空", "items": ["折戟沉沙铁未销，＿＿＿＿。东风不与周郎便，＿＿＿＿。"]}, {"type": "情景默写", "items": ["借历史抒发感慨的句子：＿＿＿＿"]}]}, {"no": 45, "section": "初中必背古诗文", "color": "#c0392b", "title": "《渔家傲·天接云涛连晓雾》", "author": "宋·李清照", "notes": "🔹星河欲转千帆舞；殷勤问我归何处；风休住，蓬舟吹取三山去。", "errors": "🔴【易错】蓬。名句“九万里风鹏正举。风休住，蓬舟吹取三山去”。", "exercises": [{"type": "原文挖空", "items": ["天接云涛连晓雾，＿＿＿＿。九万里风鹏正举。＿＿＿＿，蓬舟吹取三山去。"]}, {"type": "情景默写", "items": ["表现豪迈气概与追求的句子：＿＿＿＿"]}]}, {"no": 46, "section": "初中必背古诗文", "color": "#c0392b", "title": "《浣溪沙·一曲新词酒一杯》", "author": "宋·晏殊", "notes": "🔹一曲新词酒一杯；夕阳西下几时回？无可奈何花落去，似曾相识燕归来。", "errors": "🔴【易错】燕。名句“无可奈何花落去，似曾相识燕归来”。", "exercises": [{"type": "原文挖空", "items": ["无可奈何花落去，＿＿＿＿。"]}, {"type": "情景默写", "items": ["蕴含时光流逝感伤的句子：＿＿＿＿"]}]}, {"no": 47, "section": "初中必背古诗文", "color": "#c0392b", "title": "《采桑子·轻舟短棹西湖好》", "author": "宋·欧阳修", "notes": "🔹绿水逶迤；芳草长堤；无风水面琉璃滑。", "errors": "🔴【易错】逶迤、琉璃。", "exercises": [{"type": "原文挖空", "items": ["绿水逶迤，＿＿＿＿。无风水面琉璃滑，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描绘西湖安闲的句子：＿＿＿＿"]}]}, {"no": 48, "section": "初中必背古诗文", "color": "#c0392b", "title": "《相见欢·金陵城上西楼》", "author": "宋·朱敦儒", "notes": "🔹万里夕阳垂地大江流；中原乱，簪缨散；试倩悲风吹泪过扬州。", "errors": "🔴【易错】簪缨。", "exercises": [{"type": "原文挖空", "items": ["金陵城上西楼，＿＿＿＿。万里夕阳垂地＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达亡国之痛的句子：＿＿＿＿"]}]}, {"no": 49, "section": "初中必背古诗文", "color": "#c0392b", "title": "《如梦令·常记溪亭日暮》", "author": "宋·李清照", "notes": "🔹常记溪亭日暮；误入藕花深处；惊起一滩鸥鹭。", "errors": "🔴【易错】藕、鸥鹭。", "exercises": [{"type": "原文挖空", "items": ["常记溪亭日暮，＿＿＿＿。争渡，争渡，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现少女活泼天真的句子：＿＿＿＿"]}]}, {"no": 50, "section": "初中必背古诗文", "color": "#c0392b", "title": "《关雎》", "author": "《诗经》", "notes": "🔹雎鸠；窈窕淑女；寤寐思服；琴瑟友之。", "errors": "🔴【易错】雎、寤寐、瑟。名句“关关雎鸠，在河之洲。窈窕淑女，君子好逑”。", "exercises": [{"type": "原文挖空", "items": ["关关雎鸠，＿＿＿＿。窈窕淑女，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对美好爱情的追求：＿＿＿＿"]}]}, {"no": 51, "section": "初中必背古诗文", "color": "#c0392b", "title": "《蒹葭》", "author": "《诗经》", "notes": "🔹蒹葭苍苍；溯洄从之；宛在水中央；未晞。", "errors": "🔴【易错】葭、溯洄、晞。名句“所谓伊人，在水一方”。", "exercises": [{"type": "原文挖空", "items": ["蒹葭苍苍，＿＿＿＿。所谓伊人，＿＿＿＿。"]}, {"type": "情景默写", "items": ["可望而不可即的惆怅：＿＿＿＿"]}]}, {"no": 52, "section": "初中必背古诗文", "color": "#c0392b", "title": "《式微》", "author": "《诗经·邶风》", "notes": "🔹式微式微；胡不归？微君之故，胡为乎中露！", "errors": "🔴【易错】微、露。", "exercises": [{"type": "原文挖空", "items": ["式微式微，＿＿＿＿？微君之故，＿＿＿＿！"]}, {"type": "情景默写", "items": ["表达对统治者的不满：＿＿＿＿"]}]}, {"no": 53, "section": "初中必背古诗文", "color": "#c0392b", "title": "《子衿》", "author": "《诗经·郑风》", "notes": "🔹青青子衿；纵我不往，子宁不嗣音？", "errors": "🔴【易错】衿、嗣。", "exercises": [{"type": "原文挖空", "items": ["青青子衿，＿＿＿＿。纵我不往，＿＿＿＿？"]}, {"type": "情景默写", "items": ["表达女子对恋人思念的句子：＿＿＿＿"]}]}, {"no": 54, "section": "初中必背古诗文", "color": "#c0392b", "title": "《送杜少府之任蜀州》", "author": "唐·王勃", "notes": "🔹城阙辅三秦；与君离别意；海内存知己，天涯若比邻；无为在歧路。", "errors": "🔴【易错】阙、歧。名句“海内存知己，天涯若比邻”。", "exercises": [{"type": "原文挖空", "items": ["城阙辅三秦，＿＿＿＿。海内存知己，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达真挚友情不受时空阻隔的句子：＿＿＿＿"]}]}, {"no": 55, "section": "初中必背古诗文", "color": "#c0392b", "title": "《望洞庭湖赠张丞相》", "author": "唐·孟浩然", "notes": "🔹八月湖水平；气蒸云梦泽，波撼岳阳城；欲济无舟楫；坐观垂钓者。", "errors": "🔴【易错】撼、楫。名句“气蒸云梦泽，波撼岳阳城”。", "exercises": [{"type": "原文挖空", "items": ["气蒸云梦泽，＿＿＿＿。欲济无舟楫，＿＿＿＿。"]}, {"type": "情景默写", "items": ["借洞庭湖表达求仕愿望的句子：＿＿＿＿"]}]}, {"no": 56, "section": "初中必背古诗文", "color": "#c0392b", "title": "《茅屋为秋风所破歌》", "author": "唐·杜甫", "notes": "🔹风怒号；三重茅；布衾多年冷似铁；大庇天下寒士俱欢颜；吾庐独破受冻死亦足。", "errors": "🔴【易错】衾、庇、庐。名句“安得广厦千万间，大庇天下寒士俱欢颜”。", "exercises": [{"type": "原文挖空", "items": ["安得广厦千万间，＿＿＿＿！风雨不动安如山。"]}, {"type": "情景默写", "items": ["体现诗人忧国忧民情怀：＿＿＿＿"]}]}, {"no": 57, "section": "初中必背古诗文", "color": "#c0392b", "title": "《卖炭翁》", "author": "唐·白居易", "notes": "🔹伐薪烧炭南山中；满面尘灰烟火色；心忧炭贱愿天寒；晓驾炭车辗冰辙；黄衣使者白衫儿；半匹红纱一丈绫。", "errors": "🔴【易错】辗、辙。名句“可怜身上衣正单，心忧炭贱愿天寒”。", "exercises": [{"type": "原文挖空", "items": ["可怜身上衣正单，＿＿＿＿。夜来城外一尺雪，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现卖炭翁矛盾心理：＿＿＿＿"]}]}, {"no": 58, "section": "初中必背古诗文", "color": "#c0392b", "title": "《题破山寺后禅院》", "author": "唐·常建", "notes": "🔹清晨入古寺；曲径通幽处，禅房花木深；山光悦鸟性，潭影空人心。", "errors": "🔴【易错】禅。名句“曲径通幽处，禅房花木深”。", "exercises": [{"type": "原文挖空", "items": ["曲径通幽处，＿＿＿＿。山光悦鸟性，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现环境清幽的句子：＿＿＿＿"]}]}, {"no": 59, "section": "初中必背古诗文", "color": "#c0392b", "title": "《送友人》", "author": "唐·李白", "notes": "🔹青山横北郭；浮云游子意，落日故人情；挥手自兹去，萧萧班马鸣。", "errors": "🔴【易错】班马（非“斑”）。", "exercises": [{"type": "原文挖空", "items": ["浮云游子意，＿＿＿＿。挥手自兹去，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对友人依依惜别的句子：＿＿＿＿"]}]}, {"no": 60, "section": "初中必背古诗文", "color": "#c0392b", "title": "《卜算子·黄州定慧院寓居作》", "author": "宋·苏轼", "notes": "🔹缺月挂疏桐；漏断人初静；谁见幽人独往来，缥缈孤鸿影。", "errors": "🔴【易错】疏、缥缈。", "exercises": [{"type": "原文挖空", "items": ["缺月挂疏桐，＿＿＿＿。谁见幽人独往来，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现词人孤高自许的句子：＿＿＿＿"]}]}, {"no": 61, "section": "初中必背古诗文", "color": "#c0392b", "title": "《卜算子·咏梅》", "author": "宋·陆游", "notes": "🔹驿外断桥边；已是黄昏独自愁，更著风和雨；零落成泥碾作尘，只有香如故。", "errors": "🔴【易错】驿、碾。名句“零落成泥碾作尘，只有香如故”。", "exercises": [{"type": "原文挖空", "items": ["零落成泥碾作尘，＿＿＿＿。"]}, {"type": "情景默写", "items": ["赞美梅花坚贞品格的句子：＿＿＿＿"]}]}, {"no": 62, "section": "初中必背古诗文", "color": "#c0392b", "title": "《三峡》", "author": "北魏·郦道元", "notes": "🔹自非亭午夜分；沿溯阻绝；素湍绿潭；清荣峻茂；高猿长啸；巴东三峡巫峡长，猿鸣三声泪沾裳。", "errors": "🔴【易错】曦、溯、湍、裳。名句“有时朝发白帝，暮到江陵”。", "exercises": [{"type": "原文挖空", "items": ["自非亭午夜分，＿＿＿＿。虽乘奔御风，＿＿＿＿。"]}, {"type": "情景默写", "items": ["侧面描写山势高峻的句子：＿＿＿＿"]}]}, {"no": 63, "section": "初中必背古诗文", "color": "#c0392b", "title": "《答谢中书书》", "author": "南朝·陶弘景", "notes": "🔹高峰入云；清流见底；晓雾将歇；夕日欲颓；沉鳞竞跃；实是欲界之仙都。", "errors": "🔴【易错】颓、竞。", "exercises": [{"type": "原文挖空", "items": ["晓雾将歇，＿＿＿＿；夕日欲颓，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现山川之美的句子：＿＿＿＿"]}]}, {"no": 64, "section": "初中必背古诗文", "color": "#c0392b", "title": "《记承天寺夜游》", "author": "宋·苏轼", "notes": "🔹积水空明；水中藻、荇交横；但少闲人如吾两人者耳。", "errors": "🔴【易错】藻荇、闲。名句“庭下如积水空明，水中藻、荇交横，盖竹柏影也”。", "exercises": [{"type": "原文挖空", "items": ["庭下如积水空明，＿＿＿＿，盖竹柏影也。何夜无月？＿＿＿＿？但少闲人如吾两人者耳。"]}, {"type": "情景默写", "items": ["表达微妙复杂心境的句子：＿＿＿＿"]}]}, {"no": 65, "section": "初中必背古诗文", "color": "#c0392b", "title": "《与朱元思书》", "author": "南朝·吴均", "notes": "🔹风烟俱净；急湍甚箭；猛浪若奔；负势竞上；鸢飞戾天者；经纶世务者。", "errors": "🔴【易错】戾、纶。名句“鸢飞戾天者，望峰息心；经纶世务者，窥谷忘反”。", "exercises": [{"type": "原文挖空", "items": ["鸢飞戾天者，＿＿＿＿；经纶世务者，＿＿＿＿。"]}, {"type": "情景默写", "items": ["触景生情、淡泊名利的句子：＿＿＿＿"]}]}, {"no": 66, "section": "初中必背古诗文", "color": "#c0392b", "title": "《得道多助，失道寡助》", "author": "《孟子》", "notes": "🔹天时不如地利；地利不如人和；域民不以封疆之界；固国不以山溪之险；威天下不以兵革之利；得道者多助；寡助之至，亲戚畔之。", "errors": "🔴【易错】域、畔（通“叛”）。名句“天时不如地利，地利不如人和”。", "exercises": [{"type": "原文挖空", "items": ["天时不如地利，＿＿＿＿。寡助之至，＿＿＿＿。"]}, {"type": "情景默写", "items": ["强调“人和”重要性的句子：＿＿＿＿"]}]}, {"no": 67, "section": "初中必背古诗文", "color": "#c0392b", "title": "《富贵不能淫》", "author": "《孟子》", "notes": "🔹公孙衍、张仪岂不诚大丈夫哉？居天下之广居，立天下之正位，行天下之大道；富贵不能淫，贫贱不能移，威武不能屈。", "errors": "🔴【易错】淫、移。名句“富贵不能淫，贫贱不能移，威武不能屈”。", "exercises": [{"type": "原文挖空", "items": ["富贵不能淫，＿＿＿＿，威武不能屈。"]}, {"type": "情景默写", "items": ["体现大丈夫坚贞品格：＿＿＿＿"]}]}, {"no": 68, "section": "初中必背古诗文", "color": "#c0392b", "title": "《生于忧患，死于安乐》", "author": "《孟子》", "notes": "🔹舜发于畎亩之中；傅说举于版筑之间；胶鬲举于鱼盐之中；管夷吾举于士；孙叔敖举于海；百里奚举于市；动心忍性，曾益其所不能；入则无法家拂士，出则无敌国外患者。", "errors": "🔴【易错】畎、鬲、曾（通“增”）、拂（通“弼”）。名句“故天将降大任于是人也，必先苦其心志……”。", "exercises": [{"type": "原文挖空", "items": ["故天将降大任于是人也，＿＿＿＿，劳其筋骨…… 入则无法家拂士，＿＿＿＿，国恒亡。"]}, {"type": "情景默写", "items": ["论证忧患使人生存、安乐使人灭亡的句子：＿＿＿＿"]}]}, {"no": 69, "section": "初中必背古诗文", "color": "#c0392b", "title": "《愚公移山》", "author": "《列子》", "notes": "🔹方七百里；高万仞；惩山北之塞；叩石垦壤；箕畚运于渤海之尾；始龀；无穷匮也；何苦而不平？", "errors": "🔴【易错】仞、箕畚、龀、匮。名句“子子孙孙无穷匮也，而山不加增，何苦而不平”。", "exercises": [{"type": "原文挖空", "items": ["子子孙孙无穷匮也，＿＿＿＿，何苦而不平？"]}, {"type": "情景默写", "items": ["表现愚公坚定信念的句子：＿＿＿＿"]}]}, {"no": 70, "section": "初中必背古诗文", "color": "#c0392b", "title": "《桃花源记》", "author": "晋·陶渊明", "notes": "🔹落英缤纷；欲穷其林；豁然开朗；阡陌交通；鸡犬相闻；黄发垂髫；皆叹惋；遂迷，不复得路。", "errors": "🔴【易错】缤、髫、惋。名句“阡陌交通，鸡犬相闻”“黄发垂髫，并怡然自乐”。", "exercises": [{"type": "原文挖空", "items": ["土地平旷，屋舍俨然，＿＿＿＿。阡陌交通，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描写桃花源和平安宁的句子：＿＿＿＿"]}]}, {"no": 71, "section": "初中必背古诗文", "color": "#c0392b", "title": "《小石潭记》", "author": "唐·柳宗元", "notes": "🔹如鸣佩环；俶尔远逝；往来翕忽；斗折蛇行；凄神寒骨，悄怆幽邃。", "errors": "🔴【易错】俶、翕、邃。名句“潭中鱼可百许头，皆若空游无所依”。", "exercises": [{"type": "原文挖空", "items": ["潭中鱼可百许头，＿＿＿＿。俶尔远逝，＿＿＿＿。"]}, {"type": "情景默写", "items": ["写潭水清澈、游鱼自由：＿＿＿＿"]}]}, {"no": 72, "section": "初中必背古诗文", "color": "#c0392b", "title": "《北冥有鱼》", "author": "《庄子》", "notes": "🔹北冥有鱼；化而为鸟；怒而飞；海运则将徙于南冥；野马也，尘埃也，生物之以息相吹也。", "errors": "🔴【易错】冥（通“溟”）、徙。", "exercises": [{"type": "原文挖空", "items": ["北冥有鱼，＿＿＿＿。化而为鸟，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现大鹏振翅高飞的句子：＿＿＿＿"]}]}, {"no": 73, "section": "初中必背古诗文", "color": "#c0392b", "title": "《虽有嘉肴》", "author": "《礼记》", "notes": "🔹虽有嘉肴，弗食，不知其旨也；教学相长；学学半。", "errors": "🔴【易错】肴、旨、学学半（前“学”通“敩”）。名句“教学相长”。", "exercises": [{"type": "原文挖空", "items": ["虽有嘉肴，＿＿＿＿，不知其旨也。知不足，＿＿＿＿；知困，＿＿＿＿。"]}, {"type": "情景默写", "items": ["说明教与学互相促进的句子：＿＿＿＿"]}]}, {"no": 74, "section": "初中必背古诗文", "color": "#c0392b", "title": "《大道之行也》", "author": "《礼记》", "notes": "🔹天下为公；选贤与能；讲信修睦；老有所终；壮有所用；矜、寡、孤、独、废疾者皆有所养。", "errors": "🔴【易错】与（通“举”）、矜（通“鳏”）。名句“大道之行也，天下为公”。", "exercises": [{"type": "原文挖空", "items": ["大道之行也，＿＿＿＿。选贤与能，＿＿＿＿。"]}, {"type": "情景默写", "items": ["描写理想社会特征的句子：＿＿＿＿"]}]}, {"no": 75, "section": "初中必背古诗文", "color": "#c0392b", "title": "《马说》", "author": "唐·韩愈", "notes": "🔹祗辱于奴隶人之手；骈死于槽枥之间；食马者不知其能千里而食也；食不饱，力不足，才美不外见。", "errors": "🔴【易错】祗、骈、食（通“饲”）、见（通“现”）。名句“千里马常有，而伯乐不常有”。", "exercises": [{"type": "原文挖空", "items": ["千里马常有，＿＿＿＿。其真无马邪？＿＿＿＿！"]}, {"type": "情景默写", "items": ["揭示食马者愚妄的句子：＿＿＿＿"]}]}, {"no": 76, "section": "初中必背古诗文", "color": "#c0392b", "title": "《行路难（其一）》", "author": "唐·李白", "notes": "🔹金樽清酒斗十千；停杯投箸不能食；欲渡黄河冰塞川，将登太行雪满山；长风破浪会有时，直挂云帆济沧海。", "errors": "🔴【易错】箸、济。名句“长风破浪会有时，直挂云帆济沧海”。", "exercises": [{"type": "原文挖空", "items": ["长风破浪会有时，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达乐观自信、执着追求的句子：＿＿＿＿"]}]}, {"no": 77, "section": "初中必背古诗文", "color": "#c0392b", "title": "《酬乐天扬州初逢席上见赠》", "author": "唐·刘禹锡", "notes": "🔹巴山楚水凄凉地；怀旧空吟闻笛赋；沉舟侧畔千帆过，病树前头万木春。", "errors": "🔴【易错】赋、畔。名句“沉舟侧畔千帆过，病树前头万木春”。", "exercises": [{"type": "原文挖空", "items": ["沉舟侧畔千帆过，＿＿＿＿。"]}, {"type": "情景默写", "items": ["蕴含新事物必将取代旧事物的句子：＿＿＿＿"]}]}, {"no": 78, "section": "初中必背古诗文", "color": "#c0392b", "title": "《水调歌头·明月几时有》", "author": "宋·苏轼", "notes": "🔹把酒问青天；起舞弄清影；不应有恨，何事长向别时圆？但愿人长久，千里共婵娟。", "errors": "🔴【易错】婵娟。名句“但愿人长久，千里共婵娟”。", "exercises": [{"type": "原文挖空", "items": ["但愿人长久，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对亲人美好祝愿的句子：＿＿＿＿"]}]}, {"no": 79, "section": "初中必背古诗文", "color": "#c0392b", "title": "《月夜忆舍弟》", "author": "唐·杜甫", "notes": "🔹戍鼓断人行；露从今夜白，月是故乡明。", "errors": "🔴【易错】戍。名句“露从今夜白，月是故乡明”。", "exercises": [{"type": "原文挖空", "items": ["露从今夜白，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对故乡思念的句子：＿＿＿＿"]}]}, {"no": 80, "section": "初中必背古诗文", "color": "#c0392b", "title": "《长沙过贾谊宅》", "author": "唐·刘长卿", "notes": "🔹三年谪宦此栖迟；秋草独寻人去后，寒林空见日斜时。", "errors": "🔴【易错】谪、栖。", "exercises": [{"type": "原文挖空", "items": ["秋草独寻人去后，＿＿＿＿。"]}, {"type": "情景默写", "items": ["借古伤怀的句子：＿＿＿＿"]}]}, {"no": 81, "section": "初中必背古诗文", "color": "#c0392b", "title": "《左迁至蓝关示侄孙湘》", "author": "唐·韩愈", "notes": "🔹一封朝奏九重天，夕贬潮州路八千；欲为圣明除弊事，肯将衰朽惜残年！", "errors": "🔴【易错】弊、朽。名句“云横秦岭家何在？雪拥蓝关马不前”。", "exercises": [{"type": "原文挖空", "items": ["云横秦岭家何在？＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现英雄失路的悲慨：＿＿＿＿"]}]}, {"no": 82, "section": "初中必背古诗文", "color": "#c0392b", "title": "《商山早行》", "author": "唐·温庭筠", "notes": "🔹晨起动征铎；鸡声茅店月，人迹板桥霜；槲叶落山路，枳花明驿墙。", "errors": "🔴【易错】铎、槲、枳。名句“鸡声茅店月，人迹板桥霜”。", "exercises": [{"type": "原文挖空", "items": ["鸡声茅店月，＿＿＿＿。"]}, {"type": "情景默写", "items": ["用意象罗列写早行之苦：＿＿＿＿"]}]}, {"no": 83, "section": "初中必背古诗文", "color": "#c0392b", "title": "《咸阳城东楼》", "author": "唐·许浑", "notes": "🔹一上高城万里愁；溪云初起日沉阁，山雨欲来风满楼。", "errors": "🔴【易错】阁。名句“山雨欲来风满楼”。", "exercises": [{"type": "原文挖空", "items": ["溪云初起日沉阁，＿＿＿＿。"]}, {"type": "情景默写", "items": ["常用来比喻重大事件前的紧张气氛：＿＿＿＿"]}]}, {"no": 84, "section": "初中必背古诗文", "color": "#c0392b", "title": "《无题》", "author": "唐·李商隐", "notes": "🔹相见时难别亦难；春蚕到死丝方尽，蜡炬成灰泪始干。", "errors": "🔴【易错】蜡炬。名句“春蚕到死丝方尽，蜡炬成灰泪始干”。", "exercises": [{"type": "原文挖空", "items": ["春蚕到死丝方尽，＿＿＿＿。"]}, {"type": "情景默写", "items": ["赞美无私奉献精神：＿＿＿＿"]}]}, {"no": 85, "section": "初中必背古诗文", "color": "#c0392b", "title": "《丑奴儿·书博山道中壁》", "author": "宋·辛弃疾", "notes": "🔹少年不识愁滋味；为赋新词强说愁；而今识尽愁滋味，欲说还休。", "errors": "🔴【易错】赋。", "exercises": [{"type": "原文挖空", "items": ["少年不识愁滋味，＿＿＿＿。而今识尽愁滋味，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现人生不同阶段对愁的感受：＿＿＿＿"]}]}, {"no": 86, "section": "初中必背古诗文", "color": "#c0392b", "title": "《渔家傲·秋思》", "author": "宋·范仲淹", "notes": "🔹塞下秋来风景异；浊酒一杯家万里；燕然未勒归无计；人不寐，将军白发征夫泪。", "errors": "🔴【易错】勒、寐。名句“浊酒一杯家万里，燕然未勒归无计”。", "exercises": [{"type": "原文挖空", "items": ["浊酒一杯家万里，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现边塞将士思乡而不得归的矛盾：＿＿＿＿"]}]}, {"no": 87, "section": "初中必背古诗文", "color": "#c0392b", "title": "《江城子·密州出猎》", "author": "宋·苏轼", "notes": "🔹老夫聊发少年狂；锦帽貂裘，千骑卷平冈；会挽雕弓如满月，西北望，射天狼。", "errors": "🔴【易错】貂、冈、雕。名句“会挽雕弓如满月，西北望，射天狼”。", "exercises": [{"type": "原文挖空", "items": ["会挽雕弓如满月，＿＿＿＿，＿＿＿＿。"]}, {"type": "情景默写", "items": ["抒发杀敌报国豪情的句子：＿＿＿＿"]}]}, {"no": 88, "section": "初中必背古诗文", "color": "#c0392b", "title": "《破阵子·为陈同甫赋壮词以寄之》", "author": "宋·辛弃疾", "notes": "🔹醉里挑灯看剑；五十弦翻塞外声；马作的卢飞快，弓如霹雳弦惊；了却君王天下事，赢得生前身后名。", "errors": "🔴【易错】的卢、霹雳。名句“了却君王天下事，赢得生前身后名。可怜白发生！”。", "exercises": [{"type": "原文挖空", "items": ["了却君王天下事，＿＿＿＿。可怜白发生！"]}, {"type": "情景默写", "items": ["表达壮志难酬的悲愤：＿＿＿＿"]}]}, {"no": 89, "section": "初中必背古诗文", "color": "#c0392b", "title": "《满江红·小住京华》", "author": "清·秋瑾", "notes": "🔹小住京华；四面歌残终破楚；八年风味徒思浙；苦将侬强派作蛾眉，殊未屑！", "errors": "🔴【易错】侬、屑。名句“身不得，男儿列，心却比，男儿烈”。", "exercises": [{"type": "原文挖空", "items": ["身不得，男儿列，＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现巾帼英雄气概的句子：＿＿＿＿"]}]}, {"no": 90, "section": "初中必背古诗文", "color": "#c0392b", "title": "《十五从军征》", "author": "汉乐府", "notes": "🔹十五从军征，八十始得归；遥看是君家，松柏冢累累；舂谷持作饭，采葵持作羹。", "errors": "🔴【易错】冢、舂、羹。", "exercises": [{"type": "原文挖空", "items": ["遥看是君家，＿＿＿＿。"]}, {"type": "情景默写", "items": ["揭露战争残酷的句子：＿＿＿＿"]}]}, {"no": 91, "section": "初中必背古诗文", "color": "#c0392b", "title": "《白雪歌送武判官归京》", "author": "唐·岑参", "notes": "🔹忽如一夜春风来，千树万树梨花开；瀚海阑干百丈冰；愁云惨淡万里凝；山回路转不见君，雪上空留马行处。", "errors": "🔴【易错】阑干、凝。名句“忽如一夜春风来，千树万树梨花开”。", "exercises": [{"type": "原文挖空", "items": ["忽如一夜春风来，＿＿＿＿。"]}, {"type": "情景默写", "items": ["以春花喻冬雪的千古名句：＿＿＿＿"]}]}, {"no": 92, "section": "初中必背古诗文", "color": "#c0392b", "title": "《南乡子·登京口北固亭有怀》", "author": "宋·辛弃疾", "notes": "🔹何处望神州？满眼风光北固楼；年少万兜鍪，坐断东南战未休；生子当如孙仲谋。", "errors": "🔴【易错】兜鍪。", "exercises": [{"type": "原文挖空", "items": ["年少万兜鍪，＿＿＿＿。天下英雄谁敌手？＿＿＿＿。"]}, {"type": "情景默写", "items": ["表达对英雄的仰慕：＿＿＿＿"]}]}, {"no": 93, "section": "初中必背古诗文", "color": "#c0392b", "title": "《过零丁洋》", "author": "宋·文天祥", "notes": "🔹辛苦遭逢起一经；山河破碎风飘絮；人生自古谁无死？留取丹心照汗青。", "errors": "🔴【易错】汗青。名句“人生自古谁无死？留取丹心照汗青”。", "exercises": [{"type": "原文挖空", "items": ["人生自古谁无死？＿＿＿＿。"]}, {"type": "情景默写", "items": ["表现视死如归民族气节：＿＿＿＿"]}]}, {"no": 94, "section": "初中必背古诗文", "color": "#c0392b", "title": "《山坡羊·潼关怀古》", "author": "元·张养浩", "notes": "🔹峰峦如聚，波涛如怒；伤心秦汉经行处，宫阙万间都做了土；兴，百姓苦；亡， function computeStreak(days, today) {
  const set = new Set(days || []);
  let d = new Date(today || Date.now());

  let n = 0;
  while (set.has(fmt(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

function shuffle(a) {
  const arr = a.slice();
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function normPlain(s) {
  return String(s || "").replace(/[，。；、？！?？：:""''《》〈〉·—…\s＿_]/g, "");
}
function normNoParen(s) {
  return normPlain(String(s || "").replace(/[（(][^）)]*[)）]/g, ""));
}
function normParenChars(s) {
  return normPlain(String(s || "").replace(/[（）()]/g, ""));
}
function splitBlanks(q) {
  return String(q || "").split(/＿+/);
}
function fillMatch(input, accepted) {
  const variants = [normPlain(input), normNoParen(input), normParenChars(input)];
  return (accepted || []).some(function (a) {
    return variants.indexOf(normPlain(a)) >= 0
      || variants.indexOf(normNoParen(a)) >= 0
      || variants.indexOf(normParenChars(a)) >= 0;
  });
}

function checkFill() {
  const item = fillList[fillIdx];
  let ok = true;
  if (fillPerBlank && fillParts.length > 0) {
    for (let i = 0; i < fillParts.length; i++) {
      const inp = el("f" + i);

      inp.classList.add(good ? "right" : "wrong");
      if (!good) ok = false;
    }

    const inp = el("f0");
    const good = fillMatch(inp.value, fillAccepted);
    inp.classList.add(good ? "right" : "wrong");

/* 打开「带记录的版本」时自动恢复本地记忆 */
function importEmbedded() {
  if (!window.__EMBEDDED__) return false;
  try {
    const o = JSON.parse(JSON.stringify(window.__EMBEDDED__));
    if (!o || !o.children) return false;
    let hasLocal = false;
    try { hasLocal = !!localStorage.getItem(LS_KEY); } catch (e) { hasLocal = false; }
    if (!hasLocal) {
      state = Object.assign(defaultState(), migrate(o));
      save();
      flash("已从文件恢复全部记录");
      return true;
    }
    flash("检测到文件内记录，本机已有记录，未覆盖");
    return false;
  } catch (e) { return false; }
}

/* 生成一个自带全部记录的应用文件 */
function downloadWithRecords() {
  const marker = "window.__EMBEDDED__ = null;";
  const html = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const stateJson = JSON.stringify(state).split("</").join("<\/");
  const src = html.replace(marker, "window.__EMBEDDED__ = " + stateJson + ";");
  const blob = new Blob([src], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "中考打卡-带记录-" + todayStr() + ".html";
  
  if (window.AndroidBridge) { AndroidBridge.saveText(a.download, src, "text/html;charset=utf-8"); return; }
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  flash("已生成带记录的文件，请保存好");
}

function activate() {
  const name = el("actName").value.trim();
  const code = el("actCode").value.trim();
  if (!name || !code) { el("actErr").textContent = "请填写姓名和授权码"; return; }
  if (!checkCode(name, code)) {
    el("actErr").textContent = "授权码不正确，请核对后重试（姓名须与购买时登记的一致）";
    return;
  }
  const doActivate = function () {
    state.activated = { name: name, code: makeCode(name), date: todayStr() };
    save(); render();
    el("activation").classList.remove("show");
    flash("激活成功，欢迎使用！");
  };
  const reject = function (msg) {
    el("actErr").textContent = msg || "授权码无效或已被作废，请联系卖家";
  };
  try {
    fetch("https://gaokao-english.pages.dev/api/verify", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, code: code, product: "zk" })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok === true) doActivate();
      else reject(res && res.reason ? res.reason : "授权码无效或已被作废，请联系卖家");
    }).catch(function () { doActivate(); });
  } catch (e) { doActivate(); }
}

  state.activated = {};
  save();
  el("activation").classList.add("show");

    const o = JSON.parse(txt);
    state = Object.assign(defaultState(), migrate(o));
    if (!state.children || Object.keys(state.children).length === 0) state = defaultState();
    save(); render();
    flash("备份已恢复");
  } catch (e) { flash("内容格式不对"); }
}
function importFile(ev) {
  const f = ev.target.files && ev.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = function () { el("importArea").value = r.result; importFromText(); };
  r.readAsText(f);
}
function resetAll() {
  if (!confirm("确定清空当前孩子所有打卡记录吗？建议先备份。")) return;
  if (!confirm("再次确认：真的要全部清空吗？")) return;
  state.children[state.active] = { name: cur().name, emoji: cur().emoji, rec: {}, wri: {}, par: {}, days: [] };
  save(); render();
  flash("已清空当前孩子记录");
}
function resetAllData() {
  if (!confirm("确定重置全部数据吗？将清空所有孩子的打卡记录、授权激活，恢复到出厂状态。")) return;
  if (!confirm("再次确认：此操作不可恢复，建议先备份。真的要重置吗？")) return;
  state = defaultState();
  save();
  render();
  el("activation").classList.add("show");
  flash("已重置全部数据");
}

/* 初始化 */
function init() {
  const app = el("app");
  PIECES.forEach(function (p) {
    let curG = app.lastElementChild;
    if (!curG || curG.dataset.section !== p.section) {
      const g = document.createElement("details");
      g.className = "group";
      g.dataset.section = p.section;
      g.style.background = "linear-gradient(160deg, " + p.color + ", " + p.color + "cc)";
      g.innerHTML = "<summary>" + p.section + "<span class='cnt'></span><span class='gp'></span></summary><div class='cards'></div>";
      g.querySelector(".cnt").textContent = PIECES.filter(function (x) { return x.section === p.section; }).length + " 篇";
      app.appendChild(g);
      curG = g;
    }
    let exHtml = "";
    if (p.exercises && p.exercises.length) {
      exHtml = "<div class='exs'>";
      p.exercises.forEach(function (g) {
        exHtml += "<div class='exg'><b>" + (g.type === "原文挖空" ? "① 原文挖空默写" : "② 情景式默写") + "</b>";
        g.items.forEach(function (it) { exHtml += "<div class='exl'>" + it + "</div>"; });
        exHtml += "</div>";
      });
      exHtml += "</div>";
    }
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.no = p.no;
    card.style.setProperty("--c", p.color);
    card.innerHTML =
      "<button class='head' onclick='toggleCard(this)'>" +
        "<span class='no' style='background:" + p.color + "'>" + p.no + "</span>" +
        "<span class='t'>" + p.title + "</span>" +
        "<span class='a'>" + p.author + "</span><span class='chev'>▾</span>" +
      "</button>" +
      "<div class='body'>" +
        (p.notes ? "<div class='cblock'><div class='ct'>📖 重点注释</div><div class='cc'>" + p.notes + "</div></div>" : "") +
        (p.errors ? "<div class='cblock' style='border-left-color:#c0392b'><div class='ct' style='color:#c0392b'>⚠️ 易错字词</div><div class='cc'>" + p.errors + "</div></div>" : "") +
        exHtml +
        "<div class='checks'>" +
          "<button class='ck rec' style='--c:#2c5f8a;--bc:#2c5f8a' onclick='toggleRec(" + p.no + ")'></button>" +
          "<button class='ck wri' style='--c:#d97c2b;--bc:#d97c2b' onclick='toggleWri(" + p.no + ")'></button>" +
          "<button class='ck par' style='--c:#b45f2a;--bc:#b45f2a' onclick='togglePar(" + p.no + ")'></button>" +
        "</div>" +
      "</div>";
    curG.querySelector(".cards").appendChild(card);
  });

  const pinBox = el("dlAnchor");
  const dlBlock = document.createElement("div");
  dlBlock.style.cssText = "display:grid;gap:6px";
  const dlLabel = document.createElement("label");
  dlLabel.style.cssText = "font-size:.85rem;color:#4a3f2f";
  dlLabel.textContent = "💾 最省事：下载「带记录的版本」——文件自带全部记录，发到新手机打开，记录自动恢复";
  const dlBtn = document.createElement("button");
  dlBtn.className = "mini-btn";
  dlBtn.textContent = "💾 下载带记录的版本（推荐）";
  dlBtn.onclick = downloadWithRecords;
  dlBlock.appendChild(dlLabel);
  dlBlock.appendChild(dlBtn);
  pinBox.parentNode.insertBefore(dlBlock, pinBox);
  const rsBtn = document.createElement("button");
  rsBtn.className = "mini-btn";
  rsBtn.style.cssText = "background:#fdecea;color:#a9442f;border-color:#f3c1bb";
  rsBtn.textContent = "🔄 重置全部数据（清空所有记录和激活，恢复出厂）";
  rsBtn.onclick = resetAllData;
  pinBox.parentNode.insertBefore(rsBtn, pinBox);

  importEmbedded();
  render();
  if (!storageOK) el("storageWarn").style.display = "block";
  if (devUnlocked() && (!state.activated || !state.activated.name)) {
    state.activated = { name: "开发者", code: "DEV", date: todayStr() };
  }
  if (!state.activated || !state.activated.name) el("activation").classList.add("show");
  if (location.search.indexOf("selftest") >= 0) runSelfTest();
}

/* 自检 */
function runSelfTest() {
  state = defaultState();
  state.activated = { name: "张三", code: makeCode("张三"), date: "2026-08-06" };
  el("activation").classList.remove("show");
  const codeOk = checkCode("张三", makeCode("张三"));
  const codeBad = checkCode("张三", "GK60-0000-0000");
  toggleRec("1"); toggleRec("2");
  checkin("2026-08-06"); checkin("2026-08-05");
  const s1 = computeStreak(cur().days, "2026-08-06");
  const rA = Object.keys(cur().rec).length;
  const idB = addChildRaw("妹妹", "👧");
  switchChild(idB);
  toggleRec("3");
  const rB = Object.keys(cur().rec).length;
  const firstId = Object.keys(state.children)[0];
  const rA2 = Object.keys(state.children[firstId].rec).length;
  PIECES.forEach(function (p) { cur().rec[String(p.no)] = "2026-08-06"; });
  render();
  const onN = document.querySelectorAll(".ck.rec.on").length;
  const banner = el("banner").classList.contains("show");
  const saveTxt = el("saveState").textContent.indexOf("自动保存在本机") > -1;
  const marker = "window.__EMBEDDED__ = null;";
  const htmlSrc = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
  const hasMarker = htmlSrc.indexOf(marker) > -1;
  const src2 = htmlSrc.replace(marker, "window.__EMBEDDED__ = " + JSON.stringify({ v: 2 }) + ";");
  const embOk = src2.indexOf('window.__EMBEDDED__ = {"v":2};') > -1;
  const fnReset = typeof resetAllData === "function";
  const fnSet = typeof openSettings === "function" && !!el("settingsPanel");
  let stOK = true;
  try {
    save();
    state = defaultState();
    state = load();
    stOK = !!state.children && Object.keys(state.children).length === 2;
  } catch (e) { stOK = false; }
  window.__EMBEDDED__ = { v: 2, children: state.children, active: state.active, activated: state.activated };
  try { localStorage.removeItem(LS_KEY); } catch (e) {}
  const impBefore = Object.keys(state.children).length;
  state = defaultState();
  const impOk = importEmbedded() && Object.keys(state.children).length === impBefore;
  window.__EMBEDDED__ = null;
  const sp = splitBlanks("甲＿＿＿＿乙＿＿＿＿丙");
  const spOk = sp.length === 3;
  const fm1 = fillMatch("春眠不觉晓，处处闻啼鸟", ["春眠不觉晓，处处闻啼鸟"]);
  const fm2 = !fillMatch("春眠不觉晓", ["春眠不觉晓，处处闻啼鸟"]);
  const fm3 = fillMatch("歌", ["歌"]);
  const fillOk = spOk && fm1 && fm2 && fm3 && FILL.length > 50;
  const devT = (function () {
    try {
      localStorage.setItem("gsk_dev_ok", "1");
      const r = devUnlocked();
      localStorage.removeItem("gsk_dev_ok");
      return r;
    } catch (e) { return false; }
  })();
  const ok = codeOk && devT && fillOk && !codeBad && s1 === 2 && rA === 2 && rB === 1 && rA2 === 2 && onN === TOTAL && banner && stOK && hasMarker && embOk && saveTxt && impOk && fnReset && fnSet;
  el("selftest").textContent = "SELFTEST " + (ok ? "OK" : "FAIL")
    + " code=" + codeOk + "/" + codeBad + " streak=" + s1 + " rA=" + rA + " rB=" + rB
    + " rA2=" + rA2 + " on=" + onN + " banner=" + banner + " storage=" + stOK
    + " marker=" + hasMarker + "/" + embOk + " save=" + saveTxt + " imp=" + impOk
    + " reset=" + fnReset + " set=" + fnSet + " fill=" + spOk + "/" + fm1 + "/" + fm2 + "/" + fm3 + " pool=" + FILL.length;
  el("selftest").style.display = "block";
}

document.addEventListener("DOMContentLoaded", init);
document.addEventListener("DOMContentLoaded", function () {
  if (location.search.indexOf("fill=1") >= 0 && typeof startFill === "function") {
    setTimeout(startFill, 400);
  }
});

</script>
